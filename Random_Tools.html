<script>
  // Uniform rejection sampling avoids modulo bias. No server or persistence of student names.
  const ClassroomRandom = (() => {
    function int(n) {
      if (!Number.isSafeInteger(n) || n < 1 || n > 4294967296)
        throw Error("잘못된 추첨 범위입니다.");
      if (!globalThis.crypto || !globalThis.crypto.getRandomValues)
        throw Error("안전한 추첨을 지원하는 최신 브라우저에서 열어주세요.");
      const limit = 4294967296 - (4294967296 % n),
        data = new Uint32Array(1);
      do {
        crypto.getRandomValues(data);
      } while (data[0] >= limit);
      return data[0] % n;
    }
    function shuffle(items) {
      const a = items.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = int(i + 1);
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }
    function list(raw, min = 1, max = 200) {
      const a = String(raw || "")
        .split(/[\n,]+/)
        .map((s) => s.trim())
        .filter(Boolean);
      if (a.length < min || a.length > max)
        throw Error(
          `${min}~${max}개를 줄바꿈 또는 쉼표로 구분해 입력해주세요.`,
        );
      if (a.some((s) => s.length > 60))
        throw Error("이름·항목 하나는 60자 이내로 입력해주세요.");
      return a;
    }
    function missing(raw, min, max) {
      const excluded = new Set();
      const tokens = String(raw || '').trim().split(/[\s,，]+/).filter(Boolean);
      for (const token of tokens) {
        const m = token.match(/^(-?\d+)(?:[-~](-?\d+))?$/);
        if (!m) throw Error('궐번은 4, 8, 12-14처럼 번호 또는 범위로 입력해주세요.');
        const from = Number(m[1]), to = Number(m[2] || m[1]);
        if (!Number.isSafeInteger(from) || !Number.isSafeInteger(to) || from > to || from < min || to > max)
          throw Error('궐번은 설정한 시작 번호~끝 번호 안에서 입력해주세요.');
        if (to - from > 9999) throw Error('궐번은 최대 10,000개까지 설정할 수 있습니다.');
        for (let n = from; n <= to; n++) excluded.add(n);
        if (excluded.size > 10000) throw Error('궐번은 최대 10,000개까지 설정할 수 있습니다.');
      }
      return [...excluded].sort((a,b)=>a-b);
    }
    function participants(start, end, raw, min=1, max=200) {
      if (!Number.isSafeInteger(start) || !Number.isSafeInteger(end) || start < 1 || end > 10000 || start > end)

            s.bracket,
            Number(b.dataset.round),
            Number(b.dataset.match),
            Number(b.dataset.side),
          );
          renderBracket();
          return;
        }
        if (action === "path") return revealLadder(Number(b.dataset.index));
        if (action === "all") return revealLadder(null);
        if (action === "remove") {
          const raw=field(t,'missing').value.trim();
          field(t,'missing').value=(raw?raw+', ':'')+b.dataset.number;
          updateParticipantPreview(t);
          field(t, "chips").innerHTML = "";
          message(t, "궐번에 추가했습니다. 다음 돌리기에 반영됩니다.");
          return;
        }
        if (action === "run")
          ({
            roulette: roulette,
            shuffle: shuffle,
            dice: dice,
            rps: rps,
            numberpick: numbers,
            bracket: bracket,
            seat: seat,
            ladder: ladder,
          })[t]();
      } catch (e) {
        message(t, e.message || "입력값을 확인해주세요.");
      }
    }
    async function copy(t) {
      try {
        await navigator.clipboard.writeText(state(t).text);
        message(t, "결과를 복사했습니다.");
      } catch (e) {
        act(t, "select");
        message(
          t,
          "자동 복사가 제한되어 결과를 선택했습니다. Ctrl+C 또는 길게 눌러 복사해주세요.",
        );
      }
    }
    function roulette() {
      const t = "roulette",
        s = state(t);
      let a = names(t, 1);
      const signature=a.join(',');
      if(s.snapshot!==signature){s.snapshot=signature;s.drawn=new Set();}
      if(field(t,'exclude').checked) a=a.filter(n=>!s.drawn.has(n));
      if (a.length < 2)
        throw Error(
          "돌리려면 번호가 2개 이상 필요합니다. 범위를 늘리거나 당첨 제외를 해제해주세요.",
        );
      const chosen = ClassroomRandom.int(a.length),
        rotation = ClassroomRandom.wheelRotation(s.rotation, chosen, a.length),
        colors = [
          "#bcdff3",
          "#f7d3d9",
          "#d1e9d2",
          "#f8e5ac",
          "#ded2f0",
          "#c5e7e6",
        ];
      let svg = "";
      a.forEach((name, i) => {
        const a1 = (i * 2 * Math.PI) / a.length,
          a2 = ((i + 1) * 2 * Math.PI) / a.length,
          mid = (a1 + a2) / 2;
        const x = (v) => 150 + 142 * Math.sin(v),
          y = (v) => 150 - 142 * Math.cos(v);
        svg += `<path d="M150 150 L${x(a1)} ${y(a1)} A142 142 0 ${a.length === 2 ? 1 : 0} 1 ${x(a2)} ${y(a2)} Z" fill="${colors[i % colors.length]}" stroke="#fff" stroke-width="1"/><text x="${150 + 98 * Math.sin(mid)}" y="${154 - 98 * Math.cos(mid)}" text-anchor="middle">${esc(name.replace(/번$/, ""))}</text>`;
      });
      output(
        t,
        `<div class="rt-wheel-wrap"><svg id="${id(t, "wheel")}" class="rt-wheel" viewBox="0 0 300 300" role="img" aria-label="${a.length}개 항목의 룰렛">${svg}<circle cx="150" cy="150" r="13" fill="white"/></svg></div><div class="rt-summary" id="${id(t, "win")}">돌아가는 중…</div>`,
      );
      field(t, "chips").innerHTML = a
        .map((name, i) =>
          button(
            "remove",
            `${esc(name)} ×`,
            `data-number="${parseInt(name,10)}" aria-label="${esc(name)} 궐번으로 제외"`,
          ),
        )
        .join("");
      const wheel = field(t, "wheel");
      wheel.style.transform = `rotate(${s.rotation}deg)`;
      wheel.getBoundingClientRect();
      wheel.style.transition = reduced()
        ? "none"
        : "transform 2.8s cubic-bezier(.15,.65,.15,1)";
      wheel.style.transform = `rotate(${rotation}deg)`;
      s.rotation = rotation;
      animate(t, 2850, () => {
        field(t, "win").textContent = "당첨 · " + a[chosen];
        s.drawn.add(a[chosen]);
        s.text = "당첨: " + a[chosen];
        field(t, "aux").innerHTML =
          button("run", "다시 돌리기") +
          focusButton(t) +
          button("copy", "결과 복사");
      });
    }
    function shuffle() {
      const a = ClassroomRandom.shuffle(names("shuffle"));
      output(
        "shuffle",
        '<ol class="rt-list">' +
          a
            .map(
              (n, i) =>
                `<li><span class="rt-badge">${i + 1}</span><span>${esc(n)}</span></li>`,
            )
            .join("") +
          "</ol>",
        a.map((n, i) => `${i + 1}. ${n}`).join("\n"),
      );
    }
    function dice() {
      const t = "dice",
        s = state(t),
        n = integer(t, "count"),
        mode = field(t, "mode").value;
      if (n < 1 || n > 6) throw Error("개수는 1~6개로 입력해주세요.");
      const vals = Array.from(
        { length: n },
        () =>
          ClassroomRandom.int(mode === "dice" ? 6 : 2) +
          (mode === "dice" ? 1 : 0),
      );
      output(
        t,
        `<div class="rt-balls">${vals.map(() => (mode === "dice" ? '<div class="rt-die rt-moving" aria-label="굴러가는 주사위">' + Array.from({ length: 9 }, (_, i) => `<span class="${[0, 2, 4, 6, 8].includes(i) ? "rt-pip" : ""}"></span>`).join("") + "</div>" : '<div class="rt-coin rt-flip" aria-label="뒤집는 동전">?</div>')).join("")}</div><div class="rt-summary">던지는 중…</div>`,
      );
      animate(t, 650, () => {
        let html = "",
          summary = "";
        if (mode === "dice") {
          const pips = {
            1: [4],
            2: [0, 8],
            3: [0, 4, 8],
            4: [0, 2, 6, 8],
            5: [0, 2, 4, 6, 8],
            6: [0, 2, 3, 5, 6, 8],
          };
          html = vals
            .map(
              (v) =>
                `<div class="rt-die" role="img" aria-label="주사위 ${v}">${Array.from({ length: 9 }, (_, i) => `<span class="${pips[v].includes(i) ? "rt-pip" : ""}"></span>`).join("")}</div>`,
            )
            .join("");
          summary = "합계 " + vals.reduce((a, b) => a + b, 0);
          s.history.unshift(
            "주사위 " +
              vals.join(" + ") +
              " = " +
              vals.reduce((a, b) => a + b, 0),
          );
        } else {
          const heads = vals.filter((v) => v === 0).length;
          s.heads += heads;
          s.tails += n - heads;
          html = vals
            .map(
              (v) =>
                `<div class="rt-coin ${v ? "tail" : ""}">${v ? "뒤" : "앞"}</div>`,
            )
            .join("");
          summary = `앞 ${heads} · 뒤 ${n - heads}`;
          s.history.unshift(
            "동전 " + vals.map((v) => (v ? "뒤" : "앞")).join(", "),
          );
        }
        s.history = s.history.slice(0, 5);
        output(
          t,
          `<div class="rt-balls">${html}</div><div class="rt-summary">${summary}</div>${mode === "coin" ? `<p class="rt-small">누적 · 앞 ${s.heads}회 / 뒤 ${s.tails}회</p>` : ""}<h4>최근 5회</h4><ol class="rt-list">${s.history.map((x) => "<li>" + esc(x) + "</li>").join("")}</ol>`,
          s.history[0],
        );
      });
    }
    function rps() {
      const a = names("rps", 2),
        moves = ["가위", "바위", "보"],
        icons = ["✌", "✊", "✋"],
        picks = a.map((name) => ({
          name,
          move: moves[ClassroomRandom.int(3)],
        })),
        winner = ClassroomRandom.rpsWinner(picks.map((p) => p.move));
      output("rps", '<div class="rt-summary">패를 배정하는 중…</div>');
      animate("rps", 350, () =>
        output(
          "rps",
          `<div class="rt-summary">${winner ? winner + " 승리" : "무승부"}</div><div class="rt-rps">${moves
            .map(
              (m, i) =>
                `<section class="${winner === m ? "winner" : ""}"><h4><span>${icons[i]}</span>${m}${winner === m ? " · 승자" : ""}</h4>${
                  picks
                    .filter((p) => p.move === m)
                    .map((p) => "<p>" + esc(p.name) + "</p>")
                    .join("") || "<p>없음</p>"
                }</section>`,
            )
            .join("")}</div>`,
          (winner ? winner + " 승리" : "무승부") +
            "\n" +
            picks.map((p) => p.name + ": " + p.move).join("\n"),
        ),
      );
    }
    function numbers() {
      const t = "numberpick";
      const vals = ClassroomRandom.numbers(
        integer(t, "min"),
        integer(t, "max"),
        integer(t, "count"),
        field(t, "dup").checked,
        field(t, "missing").value,
      );
      state(t).values = vals;
      output(
        t,
        '<div class="rt-balls">' +
          Array.from({ length: vals.length }, () => '<span class="rt-ball rt-ball-skeleton"></span>').join("") +
          '</div><div class="rt-summary">번호 추첨 중…</div>',
      );
      animate(t, 500, () => renderNumbers(true));
    }
    function renderNumbers(fresh) {
      const t = "numberpick";
      const a = state(t).values.slice();
      if (field(t, "sort").value === "asc") a.sort((a, b) => a - b);
      const n = a.length,
        rm = reduced(),
        stagger =
          !fresh || rm || n <= 1
            ? 0
            : Math.min(200, Math.max(10, Math.round(2200 / (n - 1)))),
        popClass = fresh ? "rt-ball-pop" : "rt-ball-resort";
      output(
        t,
        '<div class="rt-balls">' +
          a
            .map((v, i) => {
              const digits = String(v).length,
                size = digits >= 4 ? " rt-ball-xs" : digits === 3 ? " rt-ball-sm" : "";
              return `<span class="rt-ball ${popClass} c${i % 5}${size}" style="animation-delay:${i * stagger}ms">${v}</span>`;
            })
            .join("") +
          `</div><p class="rt-lotto-summary">총 ${n}개 번호가 추첨되었습니다.</p>`,
        a.join(", "),
      );
    }
    function bracket(confirmed = false) {
      const a = names("bracket", 2, 32),
        s = state("bracket");
      if (s.bracket && !confirmed) {
        ask("bracket", "현재 대진과 경기 결과를 지우고 다시 생성할까요?", () =>
          bracket(true),
        );
        return;
      }
      s.bracket = ClassroomRandom.bracket(a);
      renderBracket();
    }
    function renderBracket() {
      const b = state("bracket").bracket,
        champ = b.rounds[b.rounds.length - 1][0].winner;
      const h = (b.size / 2) * 114;
      output(
        "bracket",
        `${champ ? `<div class="rt-summary">🏆 ${esc(champ.name)}</div>` : ""}<div class="rt-scroll"><div class="rt-bracket" style="--bracket-height:${h}px">${b.rounds.map((round, r) => `<section class="rt-round"><h4>${round.length === 1 ? "결승" : round.length === 2 ? "4강" : round.length === 4 ? "8강" : r + 1 + "라운드"}</h4><div class="rt-matches" style="--connector-height:${h / round.length}px">${round.map((m, i) => `<div class="rt-match">${m.players.map((p, side) => button("winner", (m.winner === p && p ? "✓ " : "") + esc(p ? p.name : r ? "진출 대기" : "부전승"), `data-round="${r}" data-match="${i}" data-side="${side}" aria-pressed="${!!p && m.winner === p}" ${!m.players[0] || !m.players[1] ? "disabled" : ""}`)).join("")}</div>`).join("")}</div></section>`).join("")}</div></div>`,
        b.rounds
          .map(
            (round, r) =>
              `${r + 1}라운드\n` +
              round
                .map(
                  (m) =>
                    m.players
                      .map((p) => (p ? p.name : "대기/부전승"))
                      .join(" vs ") +
                    " → " +
                    (m.winner ? m.winner.name : "미정"),
                )
                .join("\n"),
          )
          .join("\n\n"),
      );
    }
    function seat() {
      const t = "seat",
        s = state(t),
        rows = integer(t, "rows"),
        cols = integer(t, "cols");
      if (s.pins.size && (s.rows !== rows || s.cols !== cols))
        throw Error("좌석 크기를 바꾸려면 먼저 모든 고정을 해제해주세요.");
      const seats = ClassroomRandom.seats(
        names(t),
        rows,
        cols,
        s.seats,
        s.pins,
      );
      s.seats = seats;
      s.rows = rows;
      s.cols = cols;
      renderSeats();
    }
    function renderSeats() {
      const s = state("seat");
      output(
        "seat",
        `<div class="rt-scroll"><div class="rt-podium">교탁 / 칠판</div><div class="rt-seats" style="--seat-cols:${s.cols}">${s.seats.map((n, i) => button("pin", `<small>${Math.floor(i / s.cols) + 1}행 ${(i % s.cols) + 1}열${s.pins.has(i) ? " · 🔒 고정" : ""}</small><span>${esc(n == null ? "빈 좌석" : n)}</span>`, `class="rt-seat" data-index="${i}" aria-pressed="${s.pins.has(i)}" title="${esc(n == null ? "빈 좌석" : n)}"`)).join("")}</div></div>`,
        Array.from({ length: s.rows }, (_, r) =>
          s.seats
            .slice(r * s.cols, (r + 1) * s.cols)
            .map((n) => (n == null ? "(빈 좌석)" : n))
            .join("\t"),
        ).join("\n"),
      );
    }
    function ladder(confirmed = false) {
      const t = "ladder",
        a = names(t, 2, 12),
        ends = ClassroomRandom.list(field(t, "ends").value, 2, 12);
      if (a.length !== ends.length)
        throw Error(
          `참가자 ${a.length}명과 결과 ${ends.length}개의 개수를 맞춰주세요.`,
        );
      const s = state(t);
      if (s.board && !confirmed) {
        ask(t, "현재 사다리와 결과를 지우고 다시 만들까요?", () =>
          ladder(true),
        );
        return;
      }
      s.names = a;
      s.ends = ClassroomRandom.shuffle(ends);
      s.board = ClassroomRandom.ladder(a.length);
      s.paths = a.map((_, i) => ClassroomRandom.trace(s.board, i));
      s.revealed = new Set();
      renderLadder();
    }
    function renderLadder(animated = -1) {
      const t = "ladder",
        s = state(t),
        n = s.names.length,
        w = n * 84,
        colors = [
          "#437caa",
          "#b25577",
          "#4b8970",
          "#927029",
          "#8057a6",
          "#377c87",
          "#a46242",
          "#6065a9",
          "#aa4f52",
          "#457449",
          "#9c6591",
          "#42687e",
        ];
      const x = (i) => 42 + i * 84;
      output(
        t,
        `<div class="rt-scroll"><div style="min-width:${w}px;--ladder-n:${n}"><div class="rt-ladder-labels">${s.names.map((name, i) => button("path", esc(name) + (s.revealed.has(i) ? " ✓" : ""), `data-index="${i}"`)).join("")}</div><svg class="rt-ladder-svg" preserveAspectRatio="none" viewBox="0 0 ${w} 330" role="img" aria-label="참가자와 결과를 잇는 사다리"><g stroke="#c8c5d8" stroke-width="3">${s.names.map((_, i) => `<path d="M${x(i)} 0 V330"/>`).join("")}${s.board.rungs.map((r) => `<path d="M${x(r.col)} ${r.y} H${x(r.col + 1)}"/>`).join("")}</g>${[...s.revealed].map((i) => `<path class="path ${i === animated ? "rt-reveal" : ""}" pathLength="1" ${i === animated ? 'stroke-dasharray="1"' : ""} stroke="${colors[i]}" d="${s.paths[i].points.map((p, j) => (j ? "L" : "M") + x(p[0]) + " " + p[1]).join(" ")}"/>`).join("")}</svg><div class="rt-ladder-labels">${s.ends.map((e) => "<span>" + esc(e) + "</span>").join("")}</div></div></div><ol class="rt-list">${[
          ...s.revealed,
        ]
          .filter((i) => i !== animated)
          .map(
            (i) =>
              `<li><span class="rt-badge">${i + 1}</span>${esc(s.names[i])} → ${esc(s.ends[s.paths[i].end])}</li>`,
          )
          .join("")}</ol>`,
        [...s.revealed]
          .filter((i) => i !== animated)
          .map((i) => s.names[i] + " → " + s.ends[s.paths[i].end])
          .join("\n"),
      );
      field(t, "aux").innerHTML =
        button("all", "전체 결과 보기") +
        button("run", "다시 만들기") +
        focusButton(t) +
        (s.text ? button("copy", "결과 복사") : "");
    }
    function revealLadder(i) {
      const s = state("ladder");
      if (i == null) {
        s.names.forEach((_, i) => s.revealed.add(i));
        renderLadder();
        return;
      }
      s.revealed.add(i);
      renderLadder(i);
      animate("ladder", 1500, () => renderLadder());
    }
    return { supports: (t) => !!configs[t], init };
  })();
  window.ClassroomTools = ClassroomTools;
</script>
