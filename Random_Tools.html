  /* ===== 자리뽑기: 단계형 자리배치 도구 =====

          message(t, "결과가 선택되었습니다. 복사할 수 있어요.");
          return;
        }
        if (t === "seat") {
          if (action === "seat-help") {
            const help = field(t, "help");
            help.hidden = !help.hidden;
            return;
          }
          if (action === "seat-build") return seatBuild();
          if (action === "seat-cell") return seatSelect(Number(b.dataset.index));
          if (action === "seat-cancel") return seatClearSel();
          if (action === "seat-fix-apply") return seatFixApply();
          if (action === "seat-fix-clear") return seatFixClear();
          if (action === "seat-next") return seatNext();
          if (action === "seat-prev") return seatShowStep(seatState().step - 1, -1);
          if (action === "seat-goto") return seatGoto(Number(b.dataset.step));
          if (action === "seat-assign" || action === "seat-reassign") return seatAssign();
          if (action === "seat-edit") return seatEdit();
          if (action === "seat-names-apply") return seatNamesApply();
          if (action === "seat-copy") return seatCopy();
          if (action === "seat-print") return seatPrint();
        }
        if (action === "winner") {
          const s = state(t);
          ClassroomRandom.advance(
            s.bracket,
            Number(b.dataset.round),
            Number(b.dataset.match),
            Number(b.dataset.side),
          );
          renderBracket();
          return;
        }
        if (action === "path") return revealLadder(Number(b.dataset.index));
        if (action === "all") return revealLadder(null);
        if (action === "remove") {
          const raw=field(t,'missing').value.trim();
          field(t,'missing').value=(raw?raw+', ':'')+b.dataset.number;
          updateParticipantPreview(t);
          field(t, "chips").innerHTML = "";
          message(t, "궐번에 추가했습니다. 다음 돌리기에 반영됩니다.");
          return;
        }
        if (action === "run")
          ({
            roulette: roulette,
            shuffle: shuffle,
            dice: dice,
            rps: rps,
            numberpick: numbers,
            bracket: bracket,
            ladder: ladder,
          })[t]();
      } catch (e) {
        message(t, e.message || "입력값을 확인해주세요.");

    }
    async function copy(t) {
      try {
        await navigator.clipboard.writeText(state(t).text);
        message(t, "결과를 복사했습니다.");
      } catch (e) {
        act(t, "select");
        message(
          t,
          "자동 복사가 제한되어 결과를 선택했습니다. Ctrl+C 또는 길게 눌러 복사해주세요.",
        );
      }
    }
    function roulette() {
      const t = "roulette",
        s = state(t);
      let a = names(t, 1);
      const signature=a.join(',');
      if(s.snapshot!==signature){s.snapshot=signature;s.drawn=new Set();}
      if(field(t,'exclude').checked) a=a.filter(n=>!s.drawn.has(n));
      if (a.length < 2)
        throw Error(
          "돌리려면 번호가 2개 이상 필요합니다. 범위를 늘리거나 당첨 제외를 해제해주세요.",
        );
      const chosen = ClassroomRandom.int(a.length),
        rotation = ClassroomRandom.wheelRotation(s.rotation, chosen, a.length),
        colors = [
          "#bcdff3",
          "#f7d3d9",
          "#d1e9d2",
          "#f8e5ac",
          "#ded2f0",
          "#c5e7e6",
        ];
      let svg = "";
      a.forEach((name, i) => {
        const a1 = (i * 2 * Math.PI) / a.length,
          a2 = ((i + 1) * 2 * Math.PI) / a.length,
          mid = (a1 + a2) / 2;
        const x = (v) => 150 + 142 * Math.sin(v),
          y = (v) => 150 - 142 * Math.cos(v);
        svg += `<path d="M150 150 L${x(a1)} ${y(a1)} A142 142 0 ${a.length === 2 ? 1 : 0} 1 ${x(a2)} ${y(a2)} Z" fill="${colors[i % colors.length]}" stroke="#fff" stroke-width="1"/><text x="${150 + 98 * Math.sin(mid)}" y="${154 - 98 * Math.cos(mid)}" text-anchor="middle">${esc(name.replace(/번$/, ""))}</text>`;
      });
      output(
        t,
        `<div class="rt-wheel-wrap"><svg id="${id(t, "wheel")}" class="rt-wheel" viewBox="0 0 300 300" role="img" aria-label="${a.length}개 항목의 룰렛">${svg}<circle cx="150" cy="150" r="13" fill="white"/></svg></div><div class="rt-summary" id="${id(t, "win")}">돌아가는 중…</div>`,
      );
      field(t, "chips").innerHTML = a
        .map((name, i) =>
          button(
            "remove",
            `${esc(name)} ×`,
            `data-number="${parseInt(name,10)}" aria-label="${esc(name)} 궐번으로 제외"`,
          ),
        )
        .join("");
      const wheel = field(t, "wheel");
      wheel.style.transform = `rotate(${s.rotation}deg)`;
      wheel.getBoundingClientRect();
      wheel.style.transition = reduced()
        ? "none"
        : "transform 2.8s cubic-bezier(.15,.65,.15,1)";
      wheel.style.transform = `rotate(${rotation}deg)`;
      s.rotation = rotation;
      animate(t, 2850, () => {
        field(t, "win").textContent = "당첨 · " + a[chosen];
        s.drawn.add(a[chosen]);
        s.text = "당첨: " + a[chosen];
        field(t, "aux").innerHTML =
          button("run", "다시 돌리기") +
          focusButton(t) +
          button("copy", "결과 복사");
      });
    }
    function shuffle() {
      const a = ClassroomRandom.shuffle(names("shuffle"));
      output(
        "shuffle",
        '<ol class="rt-list">' +
          a

    function dice() {
      const t = "dice",
        s = state(t),
        n = integer(t, "count"),
        mode = field(t, "mode").value;
      if (n < 1 || n > 6) throw Error("개수는 1~6개로 입력해주세요.");
      const vals = Array.from(
        { length: n },
        () =>
          ClassroomRandom.int(mode === "dice" ? 6 : 2) +
          (mode === "dice" ? 1 : 0),
      );
      output(
        t,
        `<div class="rt-balls">${vals.map(() => (mode === "dice" ? '<div class="rt-die rt-moving" aria-label="굴러가는 주사위">' + Array.from({ length: 9 }, (_, i) => `<span class="${[0, 2, 4, 6, 8].includes(i) ? "rt-pip" : ""}"></span>`).join("") + "</div>" : '<div class="rt-coin rt-flip" aria-label="뒤집는 동전">?</div>')).join("")}</div><div class="rt-summary">던지는 중…</div>`,
      );
      animate(t, 650, () => {
        let html = "",
          summary = "";
        if (mode === "dice") {
          const pips = {
            1: [4],
            2: [0, 8],
            3: [0, 4, 8],
            4: [0, 2, 6, 8],
            5: [0, 2, 4, 6, 8],
            6: [0, 2, 3, 5, 6, 8],
          };
          html = vals
            .map(
              (v) =>
                `<div class="rt-die" role="img" aria-label="주사위 ${v}">${Array.from({ length: 9 }, (_, i) => `<span class="${pips[v].includes(i) ? "rt-pip" : ""}"></span>`).join("")}</div>`,
            )
            .join("");
          summary = "합계 " + vals.reduce((a, b) => a + b, 0);
          s.history.unshift(
            "주사위 " +
              vals.join(" + ") +
              " = " +
              vals.reduce((a, b) => a + b, 0),
          );
        } else {
          const heads = vals.filter((v) => v === 0).length;
          s.heads += heads;
          s.tails += n - heads;
          html = vals
            .map(
              (v) =>
                `<div class="rt-coin ${v ? "tail" : ""}">${v ? "뒤" : "앞"}</div>`,
            )
            .join("");
          summary = `앞 ${heads} · 뒤 ${n - heads}`;
          s.history.unshift(
            "동전 " + vals.map((v) => (v ? "뒤" : "앞")).join(", "),
          );
        }
        s.history = s.history.slice(0, 5);
        output(
          t,
          `<div class="rt-balls">${html}</div><div class="rt-summary">${summary}</div>${mode === "coin" ? `<p class="rt-small">누적 · 앞 ${s.heads}회 / 뒤 ${s.tails}회</p>` : ""}<h4>최근 5회</h4><ol class="rt-list">${s.history.map((x) => "<li>" + esc(x) + "</li>").join("")}</ol>`,
          s.history[0],
        );
      });
    }
    function rps() {
      const a = names("rps", 2),

    function renderNumbers(fresh) {
      const t = "numberpick";

    function renderBracket() {

    // ===== 자리뽑기: 단계형 자리배치 도구 =====

    // ----- 단계 이동 -----
    function seatShowStep(n, direction) {
      const t = "seat",
        s = seatState();
      // 배치를 끝낸 뒤 앞 단계로 돌아오면 설정을 다시 만질 수 있게 배치를 비웁니다.
      // (이름은 번호별로 남아 있으므로 다시 배치하면 그대로 따라옵니다.)
      if (n < 5 && s.plan) {
        s.plan = null;
        message(t, "좌석 설정을 다시 바꿀 수 있습니다. 바꾼 뒤 마지막 단계에서 다시 배치해 주세요.", "ok");
      }
      s.step = n;
      s.sel = null;
      s.fixEditing = false;
      const pages = $(CONVENIENCE_TOOL_ELEMENT_ID[t]).querySelectorAll(".rt-seat-page");
      pages.forEach((p) => {
        const on = Number(p.dataset.step) === n;
        p.hidden = !on;
        p.classList.remove("is-flip-next", "is-flip-prev");
        if (on && direction) p.classList.add(direction > 0 ? "is-flip-next" : "is-flip-prev");
      });
      seatRenderProgress();
      seatRenderStep();
    }
    // 앞 단계가 끝나야 다음으로 갑니다. 이미 지나온 단계로는 자유롭게 돌아갈 수 있습니다.
    function seatNext() {
      const s = seatState();
      if (!s.built) throw Error("먼저 '자리 만들기'를 눌러 교실 자리를 만들어주세요.");
      if (s.step === 4) {
        const students = seatStudents(); // 숫자가 잘못되면 여기서 이유를 알려줍니다.
        if (seatUsable() !== students.length) {
          seatSummary();
          throw Error(
            seatUsable() > students.length
              ? `자리가 ${seatUsable() - students.length}개 남습니다. 쓰지 않을 좌석을 더 빼주세요.`
              : `학생이 ${students.length - seatUsable()}명 더 많습니다. 자리를 늘리거나 뺀 좌석을 되살려주세요.`,
          );
        }
      }
      seatShowStep(Math.min(5, s.step + 1), 1);
    }
    function seatGoto(n) {
      const s = seatState();
      if (n === s.step) return;
      if (n > s.step) {
        // 앞으로 갈 때는 한 단계씩만(중간 확인을 건너뛰지 않도록).
        for (let k = s.step; k < n; k++) seatNext();
        return;
      }
      seatShowStep(n, -1);
    }
    function seatRenderProgress() {
      const t = "seat",
        s = seatState(),
        el = field(t, "progress");
      el.innerHTML = SEAT_STEPS.map((label, i) => {
        const n = i + 1,
          cls = n === s.step ? "is-now" : n < s.step ? "is-done" : "";
        return `<li class="${cls}">${button("seat-goto", `<b>${n}</b><span>${label}</span>`, `data-step="${n}" title="${n}단계 ${label}"`)}</li>`;
      }).join("");
    }
    // 지금 단계에 필요한 것만 다시 그립니다(좌석표는 2·3·5단계에서 씁니다).
    function seatRenderStep() {
      const t = "seat",
        s = seatState();
      // 보이지 않는 단계의 좌석표는 비워 둡니다(옛 화면이 남아 헷갈리지 않도록).
      [2, 3, 5].forEach((n) => {
        if (n === s.step) return;
        const g = field(t, "grid" + n),
          p = field(t, "panel" + n);
        if (g) g.innerHTML = "";
        if (p) {
          p.innerHTML = "";
          p.hidden = true;
        }
      });
      if (s.step === 2 || s.step === 3 || s.step === 5) {
        seatRenderGrid(field(t, "grid" + s.step));
        seatRenderPanel();
      }
      if (s.step === 4) seatSummary();
      if (s.step === 5) {
        // 배치 전에는 '자리 배치 시작', 배치 뒤에는 '다시 배치' 하나만 보여 줍니다.
        field(t, "runbar").innerHTML = s.plan
          ? button("seat-reassign", '<i class="fas fa-shuffle" aria-hidden="true"></i> 다시 배치')
          : button("seat-assign", "자리 배치 시작", 'class="rt-primary"');
        field(t, "namesfold").hidden = !s.plan;
        seatMemoPreview();
        const note = field(t, "note5");
        if (note) note.textContent = "";
      }
    }
    function seatRenderGrid(grid) {
      const s = seatState();
      if (!grid) return;
      grid.style.setProperty("--seat-cols", s.cols);
      grid.innerHTML = seatRows()
        .reduce((all, row) => all.concat(row), [])
        .map((cell) => {
          const fixedNo = s.fixed.get(cell.index),
            cls =
              "rt-seat" +
              (cell.off ? " is-off" : "") +
              (fixedNo != null ? " is-fixed" : "") +
              (s.sel === cell.index ? " is-sel" : "") +
              (s.plan ? "" : " is-clickable");
          const face = cell.off
            ? `<span class="rt-seat-x">✕</span>`
            : `<span class="rt-seat-number">${cell.number != null ? cell.number : fixedNo != null ? fixedNo : ""}</span>` +
              (cell.name ? `<span class="rt-seat-name">${esc(cell.name)}</span>` : "") +
              (fixedNo != null ? `<span class="rt-seat-pin" aria-label="지정석">📌</span>` : "");
          return button(
            "seat-cell",
            `<span class="rt-seat-top">${face}</span><span class="rt-seat-leg"></span>`,
            `class="${cls}" data-index="${cell.index}" data-row="${cell.row}" data-col="${cell.col}"` +
              ` title="${cell.row}행 ${cell.col}열"${s.plan ? " disabled" : ""}`,
          );
        })
        .join("");
    }
    // 좌석을 고르면 그 좌석 상태에 맞는 할 일만 보여 줍니다(제외/복구/지정/해제).
    // 2단계는 누르는 즉시 빼고/되살리고, 3단계는 좌석 옆에 작은 창을 띄웁니다.
    function seatRenderPanel() {
      const t = "seat",
        s = seatState(),
        panel = field(t, "panel" + s.step);
      if (!panel) return;
      if (s.step !== 3 || s.sel == null || !s.fixEditing || s.plan) {
        panel.hidden = true;
        panel.innerHTML = "";
        return;
      }
      const i = s.sel,
        fixedNo = s.fixed.get(i),
        where = `${Math.floor(i / s.cols) + 1}행 ${(i % s.cols) + 1}열`;
      panel.innerHTML =
        `<div class="rt-seat-pop" id="${id(t, "pop")}">` +
        `<b>${where}</b>` +
        `<label for="${id(t, "fixnumber")}">이 자리에 앉을 번호</label>` +
        `<input id="${id(t, "fixnumber")}" type="number" min="1" max="10000" step="1" value="${fixedNo != null ? fixedNo : ""}">` +
        `<div class="rt-seat-pop-btns">` +
        button("seat-fix-apply", "지정", 'class="rt-primary"') +
        (fixedNo != null ? button("seat-fix-clear", "해제") : "") +
        button("seat-cancel", "취소") +
        `</div></div>`;
      panel.hidden = false;
      seatPlacePop();
      const input = field(t, "fixnumber");
      if (input) {
        input.focus();
        input.select();
      }
    }
    // 작은 창을 누른 좌석 바로 아래에 붙이고, 화면 밖으로 나가지 않게 안쪽으로 당깁니다.
    function seatPlacePop() {
      const t = "seat",
        s = seatState(),
        pop = field(t, "pop"),
        grid = field(t, "grid" + s.step);
      if (!pop || !grid) return;
      const seat = grid.querySelector(`[data-index="${s.sel}"]`),
        wrap = pop.parentElement && pop.parentElement.parentElement,
        board = grid.parentElement;
      if (!seat || !wrap || typeof seat.getBoundingClientRect !== "function") return;
      const sb = seat.getBoundingClientRect(),
        wb = wrap.getBoundingClientRect(),
        pw = pop.offsetWidth || 210,
        half = pw / 2,
        limit = Math.max(half, wb.width - half);
      let x = sb.left - wb.left + sb.width / 2;
      if (x < half) x = half;
      if (x > limit) x = limit;
      pop.style.left = Math.round(x) + "px";
      pop.style.top = Math.round(sb.bottom - wb.top + 6) + "px";
      if (board && typeof board.scrollLeft === "number") pop.dataset.scroll = board.scrollLeft;
    }
    function seatSelect(index) {
      const s = seatState();
      if (s.plan) return; // 배치 결과를 보는 중에는 좌석 설정을 잠급니다.
      if (s.step === 2) return seatToggleOff(index);
      if (s.step === 3) return seatOpenFix(index);
    }
    // 2단계: 좌석을 누르면 바로 빠지고, 빠진 좌석을 다시 누르면 되살아납니다.
    function seatToggleOff(index) {
      const s = seatState();
      if (s.fixed.has(index))
        throw Error("지정석입니다. 3단계에서 지정을 해제한 뒤 빼주세요.");
      const off = s.disabled.has(index);
      if (off) s.disabled.delete(index);
      else s.disabled.add(index);
      s.sel = null;
      s.fixEditing = false;
      seatRenderGrid(field("seat", "grid2"));
      seatRenderPanel();
      message("seat", off ? "자리를 되살렸습니다." : "자리를 뺐습니다.", "ok");
    }
    // 3단계: 좌석을 누르면 번호를 넣는 작은 창이 열립니다(같은 자리를 다시 누르면 닫힘).
    function seatOpenFix(index) {
      const s = seatState();
      if (s.disabled.has(index))
        throw Error("뺀 자리예요. 2단계에서 자리를 되살린 뒤 지정해주세요.");
      const same = s.sel === index && s.fixEditing;
      s.sel = same ? null : index;
      s.fixEditing = !same;
      seatRenderGrid(field("seat", "grid3"));
      seatRenderPanel();
    }
    function seatClearSel() {
      const s = seatState();
      s.sel = null;
      s.fixEditing = false;
      seatRenderGrid(field("seat", "grid" + s.step));
      seatRenderPanel();
    }
    function seatFixApply() {
      const t = "seat",
        s = seatState();
      if (s.sel == null) throw Error("먼저 자리를 골라주세요.");
      const number = integer(t, "fixnumber");
      for (const [seat, no] of s.fixed)
        if (no === number && seat !== s.sel)
          throw Error(`${number}번은 이미 다른 자리에 지정되어 있습니다.`);
      s.fixed.set(s.sel, number);
      seatClearSel();
      message(t, `${number}번을 지정석으로 정했습니다.`, "ok");
    }
    function seatFixClear() {
      const s = seatState();
      if (s.sel == null) return;
      s.fixed.delete(s.sel);
      seatClearSel();
      message("seat", "지정석을 해제했습니다.", "ok");
    }
    // ----- 학생 번호 -----
    function seatStudents() {
      const t = "seat";
      return ClassroomRandom.studentNumbers(
        integer(t, "start"),
        integer(t, "end"),
        field(t, "missing").value,
        1,
        144,
      );
    }
    function seatUsable() {
      const s = seatState();
      return s.rows * s.cols - s.disabled.size;
    }
    function seatSummary() {
      const t = "seat",
        s = seatState(),
        el = field(t, "summary");
      if (!el || !s.built) return;
      const usable = seatUsable();
      let students;
      try {
        students = seatStudents();
      } catch (e) {
        el.className = "rt-seat-tally is-warn";
        el.innerHTML = `<span>사용 좌석 <b>${usable}</b></span><span>${esc(e.message)}</span>`;
        return;
      }
      const gap = Math.abs(usable - students.length);
      const ok = usable === students.length;
      el.className = "rt-seat-tally" + (ok ? " is-ok" : " is-warn");
      el.innerHTML =
        `<span>사용 좌석 <b>${usable}</b></span><span>유효 학생 <b>${students.length}</b></span>` +
        `<span class="rt-seat-tally-say">${
          ok
            ? "배치 가능"
            : usable > students.length
              ? `자리가 ${gap}개 많아요 · 좌석을 ${gap}개 빼주세요`
              : `학생이 ${gap}명 많아요 · 자리를 ${gap}개 늘려주세요`
        }</span>`;
    }
    function seatBuild() {
      const t = "seat",
        s = seatState(),
        rows = integer(t, "rows"),
        cols = integer(t, "cols");
      if (rows < 1 || cols < 1 || rows > 12 || cols > 12)
        throw Error("행과 열을 1~12 사이 정수로 입력해주세요.");
      s.rows = rows;
      s.cols = cols;
      s.built = true;
      s.disabled = new Set();
      s.fixed = new Map();
      s.plan = null;
      message(t, `${rows}행 × ${cols}열 자리를 만들었습니다.`, "ok");
      seatShowStep(2, 1); // 만들자마자 다음 단계로 넘어갑니다.
    }
    function seatAssign() {
      const t = "seat",
        s = seatState();
      const students = seatStudents();
      s.plan = ClassroomRandom.seatPlan(
        s.rows,
        s.cols,
        Array.from(s.disabled),
        Array.from(s.fixed),
        students,
      );
      s.students = students;
      s.sel = null;
      seatRenderStep();
      seatNamesRender();
      message(t, "자리를 배치했습니다. 이름을 넣거나 바로 복사·인쇄할 수 있어요.", "ok");
    }
    function seatEdit() {
      const s = seatState();
      s.plan = null;
      seatShowStep(2, -1);
      message("seat", "좌석 설정을 다시 바꿀 수 있습니다.", "ok");
    }
    // ----- 학생 이름 -----
    function seatNamesRender() {
      const t = "seat",
        s = seatState(),
        wrap = field(t, "names");
      wrap.innerHTML = (s.students || [])
        .map(
          (n) =>
            `<label class="rt-seat-name-row"><span>${n}</span><input type="text" maxlength="20" data-number="${n}" value="${esc(s.names[n] || "")}" placeholder="이름"></label>`,
        )
        .join("");
      wrap.oninput = (e) => {
        const input = e.target.closest("input[data-number]");
        if (input) s.names[Number(input.dataset.number)] = input.value.trim();
      };
      wrap.onkeydown = (e) => {
        if (e.key !== "Enter") return;
        e.preventDefault();
        const inputs = [...wrap.querySelectorAll("input[data-number]")];
        const next = inputs[inputs.indexOf(e.target) + 1];
        if (next) next.focus();
        else seatNamesApply();
      };
      // 여러 이름을 줄바꿈으로 붙여넣으면 그 칸부터 번호 순서대로 채웁니다.
      wrap.onpaste = (e) => {
        const text = (e.clipboardData || window.clipboardData).getData("text/plain");
        const list = text
          .split(/\r?\n/)
          .map((v) => v.trim())
          .filter(Boolean);
        if (list.length < 2) return;
        e.preventDefault();
        const inputs = [...wrap.querySelectorAll("input[data-number]")];
        let at = inputs.indexOf(e.target);
        if (at < 0) at = 0;
        let filled = 0;
        list.forEach((name, k) => {
          const input = inputs[at + k];
          if (!input) return;
          input.value = name.slice(0, 20);
          s.names[Number(input.dataset.number)] = input.value;
          filled++;
        });
        message("seat", `이름 ${filled}명을 채웠습니다. '자리표에 이름 반영'을 눌러주세요.`, "ok");
      };
    }
    function seatNamesApply() {
      seatRenderGrid(field("seat", "grid5"));
      message("seat", "자리표에 이름을 반영했습니다.", "ok");
    }
    // ----- 자리표 데이터(화면·복사·인쇄 공통) -----
    // 순서는 '교사가 교탁 앞에서 보는 기준'입니다: 뒷줄이 맨 위, 앞줄(1행)이 맨 아래(교탁 바로 위).
    // 좌우는 뒤집지 않습니다. 교탁 쪽에서 교실을 바라볼 때의 왼쪽·오른쪽과 그대로 일치합니다.
    function seatRows() {
      const s = seatState();
      const rows = [];
      for (let r = s.rows - 1; r >= 0; r--) {
        const row = [];
        for (let c = 0; c < s.cols; c++) {
          const i = r * s.cols + c;
          if (s.disabled.has(i)) {
            row.push({ off: true, index: i, row: r + 1, col: c + 1 });
            continue;
          }
          const number = s.plan ? s.plan[i] : null;
          row.push({
            off: false,
            index: i,
            row: r + 1,
            col: c + 1,
            number,
            name: number != null ? s.names[number] || "" : "",
          });
        }
        rows.push(row);
      }
      return rows;
    }
    function seatMemo() {
      const el = field("seat", "memo");
      return el ? el.value.trim() : "";
    }
    function seatMemoPreview() {
      const memo = seatMemo(),
        view = field("seat", "memoview");
      if (!view) return;
      view.textContent = memo;
      view.style.display = memo ? "block" : "none";
    }
    function seatChartHtml() {
      const body = seatRows()
        .map(
          (row) =>
            "<tr>" +
            row
              .map((cell) =>
                cell.off
                  ? '<td style="border:1px solid #888;padding:6px;text-align:center;color:#888;">사용 안함</td>'
                  : `<td style="border:1px solid #333;padding:6px;text-align:center;">${cell.number != null ? cell.number + "번" : ""}${cell.name ? "<br>" + esc(cell.name) : ""}</td>`,
              )
              .join("") +
            "</tr>",
        )
        .join("");
      // 교탁은 표 아래(교사 쪽)에 두고, 글귀가 있으면 그 아래에 덧붙입니다.
      const memo = seatMemo();
      return (
        `<table style="border-collapse:collapse;margin:0 auto;">${body}</table>` +
        `<p style="text-align:center;font-weight:bold;margin:8px 0 0;">교탁</p>` +
        (memo ? `<p style="text-align:center;margin:6px 0 0;color:#444;">${esc(memo)}</p>` : "")
      );
    }
    function seatChartText() {
      const memo = seatMemo();
      return (
        seatRows()
          .map((row) =>
            row
              .map((cell) =>
                cell.off
                  ? "사용 안함"
                  : (cell.number != null ? cell.number + "번" : "") +
                    (cell.name ? " " + cell.name : ""),
              )
              .join(" | "),
          )
          .join("\n") +
        "\n\n[교탁]" +
        (memo ? "\n\n" + memo : "")
      );
    }
    async function seatCopy() {
      const t = "seat",
        html = seatChartHtml(),
        text = seatChartText();
      try {
        // 한글(HWP)에 표 그대로 붙여넣을 수 있도록 HTML 형식을 우선 넣고, 텍스트도 함께 담습니다.
        if (window.ClipboardItem && navigator.clipboard && navigator.clipboard.write) {
          await navigator.clipboard.write([
            new ClipboardItem({
              "text/html": new Blob([html], { type: "text/html" }),
              "text/plain": new Blob([text], { type: "text/plain" }),
            }),
          ]);
        } else {
          await navigator.clipboard.writeText(text);
        }
        message(t, "자리표를 복사했습니다.", "ok");
      } catch (e) {
        try {
          await navigator.clipboard.writeText(text);
          message(t, "자리표를 글자 형태로 복사했습니다.", "ok");
        } catch (e2) {
          message(t, "자동 복사가 제한되었습니다. 인쇄를 이용하거나 화면에서 직접 선택해 복사해주세요.");
        }
      }
    }
    // 완성된 자리표만 A4(가로)로 인쇄합니다. 주간계획서 본문 인쇄 규칙과 섞이지 않도록,
    // 인쇄할 때만 전용 영역과 @page 규칙을 만들고 끝나면 지웁니다.
    function seatPrint() {
      const s = seatState();
      const memo = seatMemo();
      const mount = document.createElement("div");
      mount.id = "rtSeatPrint";
      // 교사가 교탁 앞에 두고 보는 기준: 제목 → 학생 자리 → 교탁 → 글귀 순서로 놓습니다.
      mount.innerHTML =
        `<p class="rt-print-title">자리 배치표</p>` +
        `<div class="rt-print-grid" style="--seat-cols:${s.cols}">` +
        seatRows()
          .reduce((all, row) => all.concat(row), [])
          .map((cell) =>
            cell.off
              ? '<div class="rt-print-seat off"><span class="n">사용 안함</span></div>'
              : `<div class="rt-print-seat"><span class="n">${cell.number != null ? cell.number + "번" : ""}</span>${cell.name ? `<span class="nm">${esc(cell.name)}</span>` : ""}</div>`,
          )
          .join("") +
        `</div>` +
        `<div class="rt-print-podium">교탁</div>` +
        (memo ? `<p class="rt-print-memo">${esc(memo)}</p>` : "");
      const page = document.createElement("style");
      page.id = "rtSeatPrintPage";
      page.textContent = "@page { size: A4 landscape; margin: 10mm; }";
      document.head.appendChild(page);
      document.body.appendChild(mount);
      document.body.classList.add("rt-seat-printing");
      const cleanup = () => {
        document.body.classList.remove("rt-seat-printing");
        mount.remove();
        page.remove();
        window.removeEventListener("afterprint", cleanup);
      };
      window.addEventListener("afterprint", cleanup);
      window.print();
      setTimeout(cleanup, 1000); // afterprint 이벤트를 주지 않는 환경 대비
    }
    function ladder(confirmed = false) {
      const t = "ladder",
        a = names(t, 2, 12),
        ends = ClassroomRandom.list(field(t, "ends").value, 2, 12);
      if (a.length !== ends.length)
        throw Error(
          `참가자 ${a.length}명과 결과 ${ends.length}개의 개수를 맞춰주세요.`,
        );
      const s = state(t);
      if (s.board && !confirmed) {
        ask(t, "현재 사다리와 결과를 지우고 다시 만들까요?", () =>
          ladder(true),
        );
        return;
      }
      s.names = a;
      s.ends = ClassroomRandom.shuffle(ends);
      s.board = ClassroomRandom.ladder(a.length);
      s.paths = a.map((_, i) => ClassroomRandom.trace(s.board, i));
      s.revealed = new Set();
      renderLadder();
    }
    function renderLadder(animated = -1) {
      const t = "ladder",
        s = state(t),
        n = s.names.length,
        w = n * 84,
        colors = [
          "#437caa",
          "#b25577",
          "#4b8970",
          "#927029",
          "#8057a6",
          "#377c87",
          "#a46242",
          "#6065a9",
          "#aa4f52",
          "#457449",
          "#9c6591",
          "#42687e",
        ];
      const x = (i) => 42 + i * 84;
      output(
        t,
        `<div class="rt-scroll"><div style="min-width:${w}px;--ladder-n:${n}"><div class="rt-ladder-labels">${s.names.map((name, i) => button("path", esc(name) + (s.revealed.has(i) ? " ✓" : ""), `data-index="${i}"`)).join("")}</div><svg class="rt-ladder-svg" preserveAspectRatio="none" viewBox="0 0 ${w} 330" role="img" aria-label="참가자와 결과를 잇는 사다리"><g stroke="#c8c5d8" stroke-width="3">${s.names.map((_, i) => `<path d="M${x(i)} 0 V330"/>`).join("")}${s.board.rungs.map((r) => `<path d="M${x(r.col)} ${r.y} H${x(r.col + 1)}"/>`).join("")}</g>${[...s.revealed].map((i) => `<path class="path ${i === animated ? "rt-reveal" : ""}" pathLength="1" ${i === animated ? 'stroke-dasharray="1"' : ""} stroke="${colors[i]}" d="${s.paths[i].points.map((p, j) => (j ? "L" : "M") + x(p[0]) + " " + p[1]).join(" ")}"/>`).join("")}</svg><div class="rt-ladder-labels">${s.ends.map((e) => "<span>" + esc(e) + "</span>").join("")}</div></div></div><ol class="rt-list">${[
          ...s.revealed,
        ]
          .filter((i) => i !== animated)
          .map(
            (i) =>
              `<li><span class="rt-badge">${i + 1}</span>${esc(s.names[i])} → ${esc(s.ends[s.paths[i].end])}</li>`,
          )
          .join("")}</ol>`,
        [...s.revealed]
          .filter((i) => i !== animated)
          .map((i) => s.names[i] + " → " + s.ends[s.paths[i].end])
          .join("\n"),
      );
      field(t, "aux").innerHTML =
        button("all", "전체 결과 보기") +
        button("run", "다시 만들기") +
        focusButton(t) +
        (s.text ? button("copy", "결과 복사") : "");
    }
    function revealLadder(i) {
      const s = state("ladder");
      if (i == null) {
        s.names.forEach((_, i) => s.revealed.add(i));
        renderLadder();
        return;
      }
      s.revealed.add(i);
      renderLadder(i);
      animate("ladder", 1500, () => renderLadder());
    }
    return { supports: (t) => !!configs[t], init };
  })();
  window.ClassroomTools = ClassroomTools;
</script>
