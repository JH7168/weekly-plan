<script>
  let currentDelDept = '';
  let currentEditDept = '';
  let currentEditList = []; // 수정 목록 조회 결과를 보관 (onclick 속성에 텍스트를 직접 넣지 않기 위함)
  let wzAttachmentFiles = [];
  let currentEditAttachments = [];
  let currentEditNewFiles = [];
  let wzLinks = [];            // 등록 마법사에서 추가한 링크 [{name, url}]
  let currentEditLinks = [];   // 수정창의 링크 [{name, url}]

  function addScheduleFiles(mode, input) {
    const added = Array.from(input.files || []);
    const target = mode === 'register' ? wzAttachmentFiles : currentEditNewFiles;
    added.forEach(file => target.push({ file: file, displayName: file.name }));
    input.value = ''; // 같은 파일도 필요하면 다시 선택할 수 있게 초기화합니다.
    renderScheduleFileLists(mode);
  }

  function makeScheduleFileRow(item, onName, onRemove, existing) {
    const row = document.createElement('div');
    row.className = 'schedule-file-row';
    const original = document.createElement('div');
    original.className = 'schedule-file-original';
    original.textContent = (existing ? '등록된 파일: ' : '선택한 파일: ') + (existing ? item.fileName : item.file.name);
    const name = document.createElement('input');
    name.type = 'text';
    name.value = item.displayName || (existing ? item.fileName : item.file.name);
    name.placeholder = '다운로드할 파일명';
    name.addEventListener('input', () => onName(name.value));
    const remove = document.createElement('button');
    remove.type = 'button';
    remove.className = 'schedule-file-remove';
    remove.textContent = '삭제';
    remove.onclick = onRemove;
    row.append(original, name, remove);
    return row;
  }

  function renderScheduleFileLists(mode) {
    if (mode === 'register') {
      const list = document.getElementById('wzAttachmentList');
      list.innerHTML = '';
      wzAttachmentFiles.forEach((item, idx) => list.appendChild(makeScheduleFileRow(
        item,
        value => { item.displayName = value; },
        () => { wzAttachmentFiles.splice(idx, 1); renderScheduleFileLists('register'); },
        false
      )));
      return;
    }
    const existingList = document.getElementById('singleEditExistingAttachment');
    existingList.innerHTML = '';
    currentEditAttachments.forEach((item, idx) => existingList.appendChild(makeScheduleFileRow(
      item,
      value => { item.displayName = value; },
      () => { currentEditAttachments.splice(idx, 1); renderScheduleFileLists('edit'); },
      true
    )));
    const newList = document.getElementById('singleEditNewAttachmentList');
    newList.innerHTML = '';
    currentEditNewFiles.forEach((item, idx) => newList.appendChild(makeScheduleFileRow(
      item,
      value => { item.displayName = value; },
      () => { currentEditNewFiles.splice(idx, 1); renderScheduleFileLists('edit'); },
      false
    )));
  }

  function readScheduleAttachmentPayloads(items) {
    const totalSize = items.reduce((sum, item) => sum + item.file.size, 0);
    if (totalSize > 30 * 1024 * 1024) return Promise.reject(new Error('한 번에 저장하는 첨부파일 전체 용량은 30MB 이하로 올려주세요.'));
    return Promise.all(items.map(item => new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve({
        base64: String(reader.result || '').split(',')[1] || '',
        originalName: item.file.name,
        displayName: String(item.displayName || '').trim(),
        mimeType: item.file.type || 'application/octet-stream'
      });
      reader.onerror = () => reject(new Error(item.file.name + ' 파일을 읽지 못했습니다. 다시 선택해주세요.'));
      reader.readAsDataURL(item.file);
    })));
  }

  // ===== 링크(이름+주소) =====
  function addScheduleLink(mode) {
    const prefix = mode === 'register' ? 'wz' : 'singleEdit';
    const urlEl = document.getElementById(prefix + 'LinkUrl');
    const nameEl = document.getElementById(prefix + 'LinkName');
    let url = String(urlEl.value || '').trim();
    const name = String(nameEl.value || '').trim();
    if (!url) { showAlert('링크 주소를 입력해주세요.'); return; }
    if (!/^https?:\/\//i.test(url)) url = 'https://' + url.replace(/^\/+/, ''); // http/https가 없으면 https://를 붙여줍니다.
    const target = mode === 'register' ? wzLinks : currentEditLinks;
    target.push({ name: name || url, url: url });
    urlEl.value = ''; nameEl.value = '';
    renderScheduleLinkLists(mode);
    nameEl.focus();
  }

  function makeScheduleLinkRow(item, onName, onRemove) {
    const row = document.createElement('div');
    row.className = 'schedule-file-row';
    const original = document.createElement('div');
    original.className = 'schedule-file-original';
    original.textContent = '링크: ' + item.url;
    const name = document.createElement('input');
    name.type = 'text';
    name.value = item.name || '';
    name.placeholder = '버튼 이름';
    name.addEventListener('input', () => onName(name.value));
    const remove = document.createElement('button');
    remove.type = 'button';
    remove.className = 'schedule-file-remove';
    remove.textContent = '삭제';
    remove.onclick = onRemove;
    row.append(original, name, remove);
    return row;
  }

  function renderScheduleLinkLists(mode) {
    const listId = mode === 'register' ? 'wzLinkList' : 'singleEditLinkList';
    const arr = mode === 'register' ? wzLinks : currentEditLinks;
    const list = document.getElementById(listId);
    if (!list) return;
    list.innerHTML = '';
    arr.forEach((item, idx) => list.appendChild(makeScheduleLinkRow(
      item,
      value => { item.name = value; },
      () => { arr.splice(idx, 1); renderScheduleLinkLists(mode); }
    )));
  }

  // ===== 드래그&드롭 파일 업로드 =====
  // 지정한 영역에 파일을 끌어다 놓으면, '파일추가' 버튼으로 고른 것과 똑같이 목록에 담깁니다.
  function setupScheduleDropzone(zoneId, mode) {
    const zone = document.getElementById(zoneId);
    if (!zone || zone._dropReady) return;
    zone._dropReady = true;
    ['dragenter', 'dragover'].forEach(ev => zone.addEventListener(ev, e => {
      e.preventDefault(); e.stopPropagation(); zone.classList.add('dragover');
    }));
    ['dragleave', 'dragend', 'drop'].forEach(ev => zone.addEventListener(ev, e => {
      e.preventDefault(); e.stopPropagation(); zone.classList.remove('dragover');
    }));
    zone.addEventListener('drop', e => {
      const files = Array.from((e.dataTransfer && e.dataTransfer.files) || []);
      if (!files.length) return;
      const target = mode === 'register' ? wzAttachmentFiles : currentEditNewFiles;
      files.forEach(file => target.push({ file: file, displayName: file.name }));
      renderScheduleFileLists(mode);
    });
  }

  window.addEventListener('dragover', e => { e.preventDefault(); });
  window.addEventListener('drop', e => { e.preventDefault(); });

  // "매주 반복 등록" 체크 시 반복 주차 수 입력칸을 보여줍니다.
  function toggleRepeatFields(prefix) {
    const checked = document.getElementById(`${prefix}Repeat`).checked;
    document.getElementById(`${prefix}RepeatWeeks`).style.display = checked ? 'inline-block' : 'none';
    document.getElementById(`${prefix}RepeatUnitLabel`).style.display = checked ? 'inline' : 'none';

  // 대상 학년 체크박스 그룹에서 선택된 값을 "1,2,3" 형태의 문자열로 읽어옵니다.
  function getCheckedGrades(containerId) {
    const boxes = document.querySelectorAll(`#${containerId} input[type="checkbox"]:checked`);
    return Array.from(boxes).map(b => b.value).join(',');
  }

  // 대상 학년 체크박스 그룹을 저장된 값 그대로 되돌립니다.
  // 값이 비어 있으면 "학년 미선택" 상태이므로 어느 체크박스도 선택하지 않습니다.
  function setCheckedGrades(containerId, gradesStr) {
    const grades = String(gradesStr || '')
      .split(',')
      .map(grade => grade.trim())
      .filter(Boolean);
    document.querySelectorAll(`#${containerId} input[type="checkbox"]`).forEach(cb => {
      cb.checked = grades.includes(cb.value);
    });
  }

  function selectWzDept(dept) {
    document.getElementById('wzDept').value = dept;
    nextWzStep(2);
  }

  function nextWzStep(stepNum) {
    document.getElementById('wzStep1').style.display = 'none';
    document.getElementById('wzStep2').style.display = 'none';
    document.getElementById('wzStep3').style.display = 'none';
    document.getElementById(`wzStep${stepNum}`).style.display = 'block';

    if (stepNum === 2) {
      wzCalDate = new Date();
      buildWzCalendar();
    } else if (stepNum === 3) {
      const isRange = document.getElementById('wzIsRange').checked && wzStartD && wzEndD;
      const dateText = isRange ? `${wzStartD} ~ ${wzEndD}` : wzStartD;
      document.getElementById('wzSelectedDateDisplay').innerText = `선택된 날짜: ${dateText}`;

      // 일시 예시를 실제 선택한 날짜에 맞춰 보여줍니다: 하루면 교시만, 기간이면 "월.일.(요일)~월.일.(요일)".
      const scheduleExample = isRange ? `${formatMD(wzStartD)}~${formatMD(wzEndD)}` : '3교시~4교시';
      document.getElementById('wizardSingleInput').placeholder =
        `1. 일시: ${scheduleExample}\n2. 장소: 시청각실\n3. 대상: 1학년`;
    }
  }

  // "YYYY-MM-DD"를 "M.D.(요일)" 형태로 바꿉니다. (일시 예시 표시용)
  function formatMD(dateStr) {
    const days = ['일', '월', '화', '수', '목', '금', '토'];
    const d = new Date(dateStr + 'T00:00:00');
    return `${d.getMonth() + 1}.${d.getDate()}.(${days[d.getDay()]})`;
  }

  function toggleWzRange() {
    wzClickCount = 0; wzStartD = ''; wzEndD = '';
    const isRange = document.getElementById('wzIsRange').checked;
    document.getElementById('wzRangeStatus').style.display = isRange ? 'inline' : 'none';
    document.getElementById('wzRangeStatus').innerText = "시작일을 선택하세요";
    buildWzCalendar();
  }

  function changeWzMonth(offset) {
    // 날짜를 1일로 두고 월만 바꿉니다. (예: 8/31에서 +1하면 '9/31'=10/1로 튀는 것을 방지)
    wzCalDate = new Date(wzCalDate.getFullYear(), wzCalDate.getMonth() + offset, 1);
    buildWzCalendar();
  }

  function buildWzCalendar() {
    const y = wzCalDate.getFullYear(); const m = wzCalDate.getMonth();
    document.getElementById('wzCalTitle').innerText = `${y}년 ${m + 1}월`;
    const firstDay = new Date(y, m, 1).getDay(); const lastDate = new Date(y, m + 1, 0).getDate();
    
    let html = '';
    for (let i = 0; i < firstDay; i++) { html += `<div class="cal-day empty"></div>`; }
    for (let d = 1; d <= lastDate; d++) {
      const dateStr = `${y}-${String(m+1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
      let extraClass = '';
      if (dateStr === wzStartD || dateStr === wzEndD) extraClass = 'selected';
      if (wzStartD && wzEndD && dateStr > wzStartD && dateStr < wzEndD) extraClass = 'range-path';
      
      html += `<div class="cal-day ${extraClass}" onclick="clickWzDate('${dateStr}')">${d}</div>`;
    }
    document.getElementById('wzCalGrid').innerHTML = html;
  }

  function clickWzDate(dateStr) {
    const isRange = document.getElementById('wzIsRange').checked;
    if (!isRange) {
      wzStartD = dateStr; wzEndD = dateStr;
      nextWzStep(3); 
    } else {
      if (wzClickCount === 0) {
        wzStartD = dateStr; wzEndD = ''; wzClickCount = 1;
        document.getElementById('wzRangeStatus').innerText = "종료일을 선택하세요";
        buildWzCalendar();
      } else {
        wzEndD = dateStr;
        if (wzStartD > wzEndD) { [wzStartD, wzEndD] = [wzEndD, wzStartD]; } 
        wzClickCount = 0;
        nextWzStep(3); 
      }
    }
  }

  async function saveWizard() {
    const dept = document.getElementById('wzDept').value;
    if (!wzStartD) { showAlert("날짜를 선택해주세요."); return; }

    const title = document.getElementById('wzTitle').value.trim();
    if (!title) { showAlert("제목을 입력해주세요."); return; }

    const detail = document.getElementById('wizardSingleInput').value.trim();
    if (!detail) { showAlert("상세 내용을 입력해주세요."); return; }
    const notice = document.getElementById('wizardNoticeInput').value.trim();

    // 제목은 화면에 [ ] 안에 담아 저장합니다(기존 데이터·표시 로직과 형식을 맞추기 위함).
    // 전달사항이 있으면 "【전달사항】" 구분 헤더 뒤에 붙여, 상세 보기에서 별도 박스로 분리 표시합니다.
    let finalContent = `[${title}]\n${detail}`;
    if (notice) finalContent += `\n\n【전달사항】\n${notice}`;

    // 대상 학년을 하나도 선택하지 않아도 등록할 수 있습니다. 이 경우 학년별(1/2/3학년) 필터에는
    // 나타나지 않고, "전체" 필터에서만 보이게 됩니다.
    const grades = getCheckedGrades('wzGradeGroup');

    const isRepeat = document.getElementById('wzRepeat').checked;
    const weeks = isRepeat ? Math.max(2, parseInt(document.getElementById('wzRepeatWeeks').value) || 2) : 1;

    let attachmentPayloads;
    try {
      attachmentPayloads = await readScheduleAttachmentPayloads(wzAttachmentFiles);
    } catch (err) {
      showAlert(err.message || String(err));
      return;
    }

    toggleLoading(true, attachmentPayloads.length ? "파일과 일정을 저장 중..." : "저장 중...");
    g.withSuccessHandler(() => {
      toggleLoading(false); closeMod('workMod'); loadAll();
      showAlert(isRepeat ? `${weeks}주간 반복 등록이 완료되었습니다.` : "등록이 완료되었습니다.");
    }).withFailureHandler(err => {
      toggleLoading(false);
      showAlert('저장 중 오류가 발생했습니다.\n' + (err && err.message ? err.message : err));
    }).saveRangeToSheet(wzStartD, wzEndD || wzStartD, dept, finalContent, '', weeks, grades, attachmentPayloads, wzLinks);
  }

  // 서버(Code.js)의 escapeHtml_와 동일하게 이스케이프합니다. "세부 내용 보기" 팝업의 텍스트(calendarItemDetails의
  // text)는 서버가 이미 이스케이프해서 내려준 값이라, getItemsForDelete가 돌려주는 원문(fullText)과 그냥 비교하면
  // 특수문자(& < > " ')가 섞인 항목만 매칭에 실패합니다. 비교 전에 같은 방식으로 맞춰줍니다.
  function escapeHtmlClient_(text) {
    return String(text)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  // 팝업 "수정"에서 넘어온 항목이 속한 주(연/월/주차). 월경계 주 항목을 현재 달력 월이 아니라
  // 그 항목이 속한 주로 조회하기 위해 씁니다. (일반 수정 메뉴로 들어오면 null → 화면의 년/월/주차 사용)
  let currentEditWeekCtx = null;

  // targetText를 넘기면(팝업에서 "수정" 클릭 시), 목록을 불러온 뒤 그 항목과 원문이 정확히 일치하는
  // 항목의 수정창을 자동으로 엽니다. (일반적인 "수정" 메뉴로 들어올 때는 targetText 없이 목록만 보여줍니다.)
  function fetchForEditWizard(targetText, targetRowNum) {
    const ctx = currentEditWeekCtx;
    const y = ctx ? ctx.y : el.y().value, m = ctx ? ctx.m : el.m().value, w = ctx ? ctx.w : el.w().value;
    document.getElementById('editList').innerHTML = '<div style="text-align:center; color:#999; padding:20px;">불러오는 중...</div>';

    g.withSuccessHandler(list => {
      if (!list || list.length === 0) {
        document.getElementById('editList').innerHTML = '<div style="text-align:center; color:#999; padding:20px;">수정할 항목이 없습니다.</div>';
        return;
      }
      currentEditList = list;
      document.getElementById('editList').innerHTML = list.map((item, idx) => `
        <div class="edit-item">
          <div class="edit-item-info">
            <span>${item.date}</span>
            <b>${item.display}</b>
          </div>
          <button class="btn-search" style="padding: 6px 12px; margin: 0; width: auto; background:var(--edit);" onclick="openSingleEdit(${idx})">수정</button>
        </div>
      `).join('');
      if (targetText != null) {
        const foundIdx = list.findIndex(it => targetRowNum
          ? Number(it.rowNum) === Number(targetRowNum)
          : escapeHtmlClient_(it.fullText) === targetText);
        if (foundIdx !== -1) openSingleEdit(foundIdx);
        else {
          // 예외: 항목을 못 찾은 경우에만 목록 창을 띄워 직접 고르게 합니다.
          openMod('editMod');
          showAlert("해당 항목을 찾을 수 없습니다. 목록이 바뀌었을 수 있어요. 아래 목록에서 다시 선택해주세요.");
        }
      }
    }).getItemsForDelete(currentEditType, y, m, w, currentEditDept);
  }

  // "세부 내용 보기" 팝업의 수정 버튼: 팝업을 닫고 해당 부서의 수정 목록을 불러와, 지금 보고 있던
  // 항목의 수정창으로 바로 이동합니다.
  function editItemFromDetail(idx) {
    const d = calendarItemDetails[idx];
    if (!d || d.label === '연간 행사') return;
    closeMod('itemDetailMod');
    isEdited = false;
    currentEditType = 'data';
    currentEditDept = d.label;
    currentEditWeekCtx = d.weekCtx || null; // 이 항목이 속한 주로 조회하도록
    // 목록 창(editMod)은 띄우지 않고, 해당 항목의 수정창(singleEditMod)만 바로 엽니다.
    // (항목을 못 찾는 예외 상황에서만 fetchForEditWizard가 목록 창을 대체로 띄웁니다.)
    document.getElementById('editStep1').style.display = 'none';
    document.getElementById('editStep2').style.display = 'none';
    document.getElementById('editStep3').style.display = 'block';
    document.getElementById('editListTitle').innerText = `[${currentEditDept}] 수정`;
    fetchForEditWizard(d.text, d.rowNum);
  }

  // "세부 내용 보기" 팝업의 삭제 버튼: 확인 후 지금 보고 있던 항목 하나만 바로 삭제합니다.
  function deleteItemFromDetail(idx) {
    const d = calendarItemDetails[idx];
    if (!d || d.label === '연간 행사') return;
    // 이 항목이 속한 주(월경계 주 포함)로 조회 — 현재 달력 월과 다를 수 있어 항목의 주 정보를 우선 사용합니다.
    const ctx = d.weekCtx;
    const y = ctx ? ctx.y : el.y().value, m = ctx ? ctx.m : el.m().value, w = ctx ? ctx.w : el.w().value;

    toggleLoading(true, "확인 중...");
    g.withSuccessHandler(list => {
      toggleLoading(false);
      const found = (list || []).find(it => d.rowNum
        ? Number(it.rowNum) === Number(d.rowNum)
        : escapeHtmlClient_(it.fullText) === d.text);
      if (!found) { showAlert("해당 항목을 찾을 수 없습니다. 목록이 바뀌었을 수 있어요. 새로고침 후 다시 시도해주세요."); return; }

      showConfirm("이 항목을 삭제하시겠습니까?", () => {
        toggleLoading(true, "삭제 중...");
        g.withSuccessHandler(() => {
          toggleLoading(false);
          closeMod('itemDetailMod');
          showAlert("삭제되었습니다.");
          loadAll();
        }).withFailureHandler(err => {
          toggleLoading(false);
          showAlert('삭제 중 오류가 발생했습니다.\n' + (err && err.message ? err.message : err));
        }).processBulkDelete('data', [found.rowNum]);
      });
    }).withFailureHandler(err => {
      toggleLoading(false);
      showAlert('불러오는 중 오류가 발생했습니다.\n' + (err && err.message ? err.message : err));
    }).getItemsForDelete('data', y, m, w, d.label);
  }

  // 원문(fullText)에 따옴표 등이 포함돼도 onclick 속성이 깨지지 않도록,
  // 텍스트를 속성에 직접 넣는 대신 currentEditList에서 인덱스로 조회합니다.
  function openSingleEdit(idx) {
    const item = currentEditList[idx];
    if (!item) return;
    const isNotice = (currentEditType === 'notice');
    document.getElementById('singleEditRow').value = item.rowNum;
    document.getElementById('singleEditStart').value = item.isoStart;
    document.getElementById('singleEditEnd').value = item.isoEnd;
    // 전달사항(공지) 수정은 일정명/전달사항 칸이 필요 없어 숨기고 본문만 그대로 편집합니다.
    document.getElementById('singleEditTitleField').style.display = isNotice ? 'none' : 'block';
    // 연간행사 세부 편집에서 숨겼을 수 있는 '대상 학년' 칸을 부서/전달 수정에서는 다시 보이게 복원합니다.
    const _gradeField = document.getElementById('singleEditGradeGroup').closest('.field');
    if (_gradeField) _gradeField.style.display = '';
    document.getElementById('singleEditNoticeField').style.display = isNotice ? 'none' : 'block';
    document.getElementById('singleEditAttachmentField').style.display = isNotice ? 'none' : 'block';
    document.getElementById('singleEditAttachmentFile').value = '';
    currentEditAttachments = isNotice ? [] : (item.attachments || []).map(file => Object.assign({}, file, { displayName: file.fileName }));
    currentEditNewFiles = [];
    renderScheduleFileLists('edit');
    // 링크: 기존에 저장된 링크를 그대로 불러와 수정/추가/삭제할 수 있게 합니다.
    document.getElementById('singleEditLinkField').style.display = isNotice ? 'none' : 'block';
    document.getElementById('singleEditLinkName').value = '';
    document.getElementById('singleEditLinkUrl').value = '';
    currentEditLinks = isNotice ? [] : (item.links || []).map(l => ({ name: l.name, url: l.url }));
    renderScheduleLinkLists('edit');
    setupScheduleDropzone('singleEditDropzone', 'edit');
    if (isNotice) {
      document.getElementById('singleEditText').value = item.fullText;
    } else {
      // 저장 텍스트를 일정명/내용/전달사항 3칸으로 분해합니다. (옛 형식의 "전달사항" 라벨도 자동 감지)
      const p = parseTaskText(item.fullText);
      document.getElementById('singleEditTitle').value = p.title;
      document.getElementById('singleEditText').value = p.detail;
      document.getElementById('singleEditNotice').value = p.notice;
    }
    setCheckedGrades('singleEditGradeGroup', item.grades);
    openMod('singleEditMod');
  }

  async function saveSingleEdit() {
    const rowNum = document.getElementById('singleEditRow').value;
    const start = document.getElementById('singleEditStart').value;
    const end = document.getElementById('singleEditEnd').value;
    const grades = getCheckedGrades('singleEditGradeGroup');

    let text;
    if (currentEditType === 'notice') {
      text = document.getElementById('singleEditText').value.trim();
      if (!start || !end || !text) { showAlert("날짜와 내용을 모두 입력하세요."); return; }
    } else {
      const title = document.getElementById('singleEditTitle').value.trim();
      const detail = document.getElementById('singleEditText').value.trim();
      const notice = document.getElementById('singleEditNotice').value.trim();
      // 연간행사 세부는 상세가 비어도(첨부/링크만) 허용합니다. 부서 업무는 상세 필수.
      if (!start || !end || (currentEditType !== 'annual' && !detail)) { showAlert("날짜와 내용을 모두 입력하세요."); return; }
      // 일정명/내용/전달사항을 다시 저장 형식으로 결합합니다.
      text = title ? `[${title}]\n${detail}` : detail;
      if (notice) text += `\n\n【전달사항】\n${notice}`;
    }
    // 대상 학년 미선택도 허용합니다(교직원용 등). 학년 정보 없이 저장되어 '전체' 필터에서만 표시됩니다.

    let attachmentAction = { mode: 'keep' };
    if (currentEditType !== 'notice') {
      try {
        const newFiles = await readScheduleAttachmentPayloads(currentEditNewFiles);
        attachmentAction = {
          mode: 'sync',
          existing: currentEditAttachments.map(file => ({ fileId: file.fileId, fileName: String(file.displayName || '').trim() || file.fileName })),
          newFiles: newFiles
        };
      } catch (err) {
        showAlert(err.message || String(err));
        return;
      }
    }

    toggleLoading(true, attachmentAction.newFiles && attachmentAction.newFiles.length ? "파일과 내용을 저장 중..." : "저장 중...");
    const onSaved = res => {
      toggleLoading(false);
      if (res && res.success === false) { showAlert(res.msg || res.message || "저장 실패"); return; }
      if (res) {
        closeMod('singleEditMod');
        closeMod('editMod'); // 목록 창은 더 이상 띄우지 않고 바로 달력으로 돌아갑니다.
        isEdited = true;
        showAlert(currentEditType === 'annual' ? "세부 내용이 저장되었습니다." : "수정 완료");
        loadAll(); // 달력 새로고침
      } else {
        showAlert("저장 실패");
      }
    };
    const onFail = err => { toggleLoading(false); showAlert('저장 중 오류가 발생했습니다.\n' + (err && err.message ? err.message : err)); };
    if (currentEditType === 'annual') {
      // 연간행사 세부: 명칭(학사일정표)은 유지하고 상세/전달사항/첨부/링크만 저장/수정합니다.
      const name = _annualEdit ? _annualEdit.name : '';
      if (rowNum) {
        g.withSuccessHandler(onSaved).withFailureHandler(onFail).updateAnnualDetail(rowNum, name, start, end, text, attachmentAction, currentEditLinks);
      } else {
        g.withSuccessHandler(onSaved).withFailureHandler(onFail).saveAnnualDetail(name, start, end, text, attachmentAction.newFiles || [], currentEditLinks);
      }
    } else {
      g.withSuccessHandler(onSaved).withFailureHandler(onFail).updateRowContent(currentEditType, rowNum, text, start, end, '', grades, attachmentAction, currentEditLinks);
    }
  }

  // ===== 연간행사 '세부 내용'(상세/전달사항/첨부/링크) 등록·수정·삭제 =====
  // singleEditMod를 재사용하되, 명칭(학사일정표)·학년 칸은 숨기고 세부만 다룹니다.
  let _annualEdit = null;
  function registerAnnualDetail(idx) { openAnnualDetailEditor(idx, null); }
  function editAnnualDetail(idx) {
    const d = calendarItemDetails[idx];
    openAnnualDetailEditor(idx, (d && d.rowNum) || null);
  }
  function openAnnualDetailEditor(idx, rowNum) {
    const d = calendarItemDetails[idx];
    if (!d || !d.annual) return;
    _annualEdit = { name: d.annual.name };
    currentEditType = 'annual';
    isEdited = false;
    closeMod('itemDetailMod');

    document.getElementById('singleEditRow').value = rowNum || '';
    document.getElementById('singleEditStart').value = d.annual.startIso || '';
    document.getElementById('singleEditEnd').value = d.annual.endIso || '';

    // 명칭(제목)·학년 칸 숨김: 명칭은 학사일정표에서 관리, 연간행사는 학년 구분 없음.
    document.getElementById('singleEditTitleField').style.display = 'none';
    document.getElementById('singleEditTitle').value = '';
    document.getElementById('singleEditNoticeField').style.display = 'block';
    const gradeField = document.getElementById('singleEditGradeGroup').closest('.field');
    if (gradeField) gradeField.style.display = 'none';

    // 세부(상세/전달사항) 채우기 — 수정창엔 이스케이프 안 된 원문(rawText)을 넣습니다.
    const p = parseTaskText((d.annual && d.annual.rawText) || '');
    document.getElementById('singleEditText').value = p.detail;
    document.getElementById('singleEditNotice').value = p.notice;

    // 첨부/링크
    document.getElementById('singleEditAttachmentField').style.display = 'block';
    document.getElementById('singleEditAttachmentFile').value = '';
    currentEditAttachments = (d.attachments || []).map(f => Object.assign({}, f, { displayName: f.fileName }));
    currentEditNewFiles = [];
    renderScheduleFileLists('edit');
    document.getElementById('singleEditLinkField').style.display = 'block';
    document.getElementById('singleEditLinkName').value = '';
    document.getElementById('singleEditLinkUrl').value = '';
    currentEditLinks = (d.links || []).map(l => ({ name: l.name, url: l.url }));
    renderScheduleLinkLists('edit');
    setupScheduleDropzone('singleEditDropzone', 'edit');

    openMod('singleEditMod');
  }
  function deleteAnnualDetail(idx) {
    const d = calendarItemDetails[idx];
    if (!d || !d.annual || !d.rowNum) return;
    showConfirm("이 연간행사의 '세부 내용'을 삭제할까요?\n(행사 명칭은 학사일정표에 그대로 남습니다.)", () => {
      toggleLoading(true, '삭제 중...');
      g.withSuccessHandler(() => {
        toggleLoading(false);
        closeMod('itemDetailMod');
        loadAll();
      }).withFailureHandler(err => {
        toggleLoading(false);
        showAlert('삭제 중 오류가 발생했습니다.\n' + (err && err.message ? err.message : err));
      }).processBulkDelete('data', [d.rowNum]);
    });
  }

  function closeEditModal() {
    closeMod('editMod');
    if (isEdited) loadAll();
  }
</script>
