<script>
  const g = google.script.run;
  let isDeleted = false;
  let isEdited = false;
  let currentDelType = 'data';
  let currentEditType = 'data';

  let wzCalDate = new Date();
  let wzStartD = '', wzEndD = '', wzClickCount = 0;

  const el = {
    y: () => document.getElementById('ySel'),
    m: () => document.getElementById('mSel'),
    w: () => document.getElementById('wSel')
  };

  // 1. 초기 세팅 (페이지 로드 시 호출)
  window.onload = () => {
    initSelects();
    loadAll();
    loadMeals();
    initScrollTopBtn();
    initInstitutionBannerCarousel();
  };

  // 데스크톱은 배너가 4개를 넘을 때만 3초마다 자동 순환하고,
  // 모바일은 표시 개수와 관계없이 손가락으로 좌우 이동할 수 있습니다.
  function initInstitutionBannerCarousel() {
    const viewport = document.querySelector('.institution-banner-viewport');
    const track = viewport && viewport.querySelector('.institution-banner-grid');
    if (!viewport || !track) return;

    const originals = Array.from(track.children).filter(el => el.classList.contains('institution-banner'));
    if (originals.length < 2) return;

    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const mobileView = window.matchMedia('(max-width: 768px)');
    const autoRotate = originals.length > 4 && !reducedMotion;
    const manualLoop = !autoRotate;

    if (autoRotate) {
      // 데스크톱의 네 칸이 끝까지 자연스럽게 이어지도록 첫 네 개를 복제합니다.
      originals.slice(0, 4).forEach(item => {
        const clone = item.cloneNode(true);
        clone.setAttribute('aria-hidden', 'true');
        clone.setAttribute('tabindex', '-1');
        track.appendChild(clone);
      });
    } else {
      // 4번→1번, 1번→4번 전환이 같은 방향으로 이어지도록 양 끝에 연결용 배너를 둡니다.
      const leadingClone = originals[originals.length - 1].cloneNode(true);
      const trailingClone = originals[0].cloneNode(true);
      [leadingClone, trailingClone].forEach(clone => {
        clone.setAttribute('aria-hidden', 'true');
        clone.setAttribute('tabindex', '-1');
      });
      track.prepend(leadingClone);
      track.appendChild(trailingClone);
    }

    let index = manualLoop ? 1 : 0;
    let timer = null;
    const slide = animate => {
      const first = track.querySelector('.institution-banner');
      if (!first) return;
      const gap = parseFloat(getComputedStyle(track).gap) || 0;
      track.style.transition = animate ? '' : 'none';
      track.style.transform = `translateX(-${index * (first.getBoundingClientRect().width + gap)}px)`;
    };
    const advance = () => {
      if (manualLoop) {
        index += 1;
        slide(true);
        if (index === originals.length + 1) {
          window.setTimeout(() => {
            index = 1;
            slide(false);
            requestAnimationFrame(() => { track.style.transition = ''; });
          }, 570);
        }
        return;
      }
      index += 1;
      slide(true);
      if (index === originals.length) {
        window.setTimeout(() => {
          index = 0;
          slide(false);
          requestAnimationFrame(() => { track.style.transition = ''; });
        }, 570);
      }
    };
    const retreat = () => {
      if (manualLoop) {
        index -= 1;
        slide(true);
        if (index === 0) {
          window.setTimeout(() => {
            index = originals.length;
            slide(false);
            requestAnimationFrame(() => { track.style.transition = ''; });
          }, 570);
        }
        return;
      }
      index = index > 0 ? index - 1 : originals.length - 1;
      slide(true);
    };
    const stop = () => {
      if (timer) window.clearInterval(timer);
      timer = null;
    };
    const start = () => {
      stop();
      if (autoRotate) timer = window.setInterval(advance, 3000);
    };

    let touchStartX = 0;
    let touchStartY = 0;
    let blockNextClick = false;
    viewport.addEventListener('touchstart', event => {
      if (!mobileView.matches || event.touches.length !== 1) return;
      touchStartX = event.touches[0].clientX;
      touchStartY = event.touches[0].clientY;
      stop();
    }, { passive: true });
    viewport.addEventListener('touchend', event => {
      if (!mobileView.matches || !touchStartX || event.changedTouches.length !== 1) return;
      const deltaX = event.changedTouches[0].clientX - touchStartX;
      const deltaY = event.changedTouches[0].clientY - touchStartY;
      touchStartX = 0;
      touchStartY = 0;
      if (Math.abs(deltaX) >= 40 && Math.abs(deltaX) > Math.abs(deltaY)) {
        blockNextClick = true;
        window.setTimeout(() => { blockNextClick = false; }, 450);
        deltaX < 0 ? advance() : retreat();
      }
      start();
    }, { passive: true });
    viewport.addEventListener('touchcancel', () => {
      touchStartX = 0;
      touchStartY = 0;
      start();
    }, { passive: true });
    viewport.addEventListener('click', event => {
      if (!blockNextClick) return;
      event.preventDefault();
      event.stopPropagation();
      blockNextClick = false;
    }, true);

    viewport.addEventListener('mouseenter', stop);
    viewport.addEventListener('mouseleave', start);
    viewport.addEventListener('focusin', stop);
    viewport.addEventListener('focusout', event => {
      if (!viewport.contains(event.relatedTarget)) start();
    });
    window.addEventListener('resize', () => {
      index = manualLoop ? 1 : 0;
      slide(false);
      requestAnimationFrame(() => { track.style.transition = ''; });
    });
    document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());
    slide(false);
    requestAnimationFrame(() => { track.style.transition = ''; });
    start();
  }

  // 맨 위로 가기(TOP) 버튼: 일정 높이 이상 스크롤을 내리면 나타나고, 누르면 맨 위로 부드럽게 올라갑니다.
  // (GAS는 내용이 iframe 안에서 스크롤되므로, 그 스크롤 위치를 기준으로 표시 여부를 정합니다.)
  function initScrollTopBtn() {
    const btn = document.getElementById('scrollTopBtn');
    if (!btn) return;
    const scrollY = () => window.pageYOffset || document.documentElement.scrollTop || document.body.scrollTop || 0;
    const onScroll = () => { btn.classList.toggle('show', scrollY() > 300); };
    window.addEventListener('scroll', onScroll, { passive: true });
    document.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
  }

  function scrollToTop() {
    try {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    } catch (e) {
      window.scrollTo(0, 0);
    }
    // 일부 환경에서 스크롤 주체가 문서 요소일 수 있어 함께 처리합니다.
    if (document.documentElement) document.documentElement.scrollTop = 0;
    if (document.body) document.body.scrollTop = 0;
  }

  // 오늘 급식(NEIS) 렌더링. 하루 한 끼만: 서버가 현재 시각 기준으로 정한 "지금 보여줄 한 끼"(cards[0])를 씁니다.
  //  - 13:00 이전: 오늘 점심 / 13:00~18:15: 오늘 저녁 / 18:15 이후: 다음 등교일 점심
  function loadMeals() {
    g.withSuccessHandler(cards => {
      renderMealInline('mealNow', cards && cards[0]);
    }).withFailureHandler(() => {
      renderMealInline('mealNow', null);
    }).getMealCards();
  }

  function renderMealInline(id, card) {
    const box = document.getElementById(id);
    if (!box) return;
    if (!card) { box.innerHTML = ''; return; }

    let body;
    if (card.status === 'ok' && card.items && card.items.length) {
      body = card.items.map(it => `<li>${it}</li>`).join('');
    } else if (card.status === 'holiday') {
      const nm = (card.holidayName && card.holidayName !== '공휴일')
        ? `공휴일 (${card.holidayName})` : '공휴일';
      body = `<li class="meal-holiday">${nm}</li>`;
    } else {
      body = ''; // 이유를 알 수 없으면 날짜만 표시하고 메뉴는 공란
    }
    const safeLabel = String(card.label).replace(/</g, '&lt;').replace(/>/g, '&gt;');
    box.innerHTML =
      `<div class="meal-inline-label">${safeLabel}</div>` +
      `<div class="meal-card-box">` +
        `<ul class="meal-inline-menu">${body}</ul>` +
      `</div>`;
  }

  // 주말(토·일)은 다음 주를 준비하는 시기이므로, "이번 주"를 정할 때 토/일이면 다음 주 월요일로
  // 당겨서 계산합니다. (평일은 오늘 그대로) 예: 8/29(토) → 8/31(월)이 속한 9월 1주차를 이번 주로 봅니다.
  function effectiveToday() {
    const d = new Date();
    const day = d.getDay(); // 0=일, 6=토
    if (day === 6) d.setDate(d.getDate() + 2);
    else if (day === 0) d.setDate(d.getDate() + 1);
    d.setHours(0, 0, 0, 0);
    return d;
  }
  // effectiveToday가 속한 주(월~금)의 소속 달(수요일 기준) 연/월을 돌려줍니다.
  function effectiveOwningYM() {
    const d = effectiveToday();
    const day = d.getDay(); // 월~금(1~5)
    const monday = new Date(d.getFullYear(), d.getMonth(), d.getDate() - (day - 1));
    const wed = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + 2);
    return { y: wed.getFullYear(), m: wed.getMonth() + 1 };
  }

  function initSelects() {
    const ew = effectiveOwningYM();          // 주말이면 다음 주가 속한 달로 시작
    const y = ew.y, m = ew.m;
    const base = serverData.currentYear;
    let yH = '', mH = '';
    for(let i=base-2; i<=base+2; i++) yH += `<option value="${i}" ${i===y?'selected':''}>${i}년</option>`;
    for(let i=1; i<=12; i++) mH += `<option value="${i}" ${i===m?'selected':''}>${i}월</option>`;
    el.y().innerHTML = yH; el.m().innerHTML = mH;
    upWeeks();
  }

  // 한 주(월~금 5일) 중 수요일이 속한 달을 그 주의 '소속 달'로 봅니다.
  // (평일 5일 중 최소 3일이 그 달에 속하는 것과 항상 같은 결과이며, 5일이 홀수라 동률 없이 한쪽으로 정해집니다.)
  // 예: 6/29(월)~7/3(금) 주는 수요일이 7/1이라 "7월 1주차"가 되고, 6월 쪽 주차 목록에는 포함되지 않습니다.
  // 이 기준으로 해당 (year, month)에 속하는 주차들의 월요일 날짜를 순서대로 반환합니다.
  function getWeekMondaysForMonth(year, month) {
    year = Number(year);
    month = Number(month);
    const mondays = [];
    let probe = new Date(year, month - 1, 1);
    probe.setDate(probe.getDate() - 10); // 전달 마지막 주까지 여유 있게 앞에서부터 탐색
    for (let i = 0; i < 60; i++) {
      if (probe.getDay() === 1) {
        const wed = new Date(probe.getFullYear(), probe.getMonth(), probe.getDate() + 2);
        if (wed.getFullYear() === year && wed.getMonth() === month - 1) {
          mondays.push(new Date(probe.getFullYear(), probe.getMonth(), probe.getDate()));
        }
      }
      probe.setDate(probe.getDate() + 1);
    }
    return mondays;
  }

  function upWeeks() {
    const d = effectiveToday();
    const y = parseInt(el.y().value), m = parseInt(el.m().value);
    const mondays = getWeekMondaysForMonth(y, m);

    // 오늘 날짜가 몇 주차(월~금)에 속하는지 계산합니다.
    let currentWeekNum = 1;
    mondays.forEach((mon, idx) => {
      const fri = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + 4, 23, 59, 59, 999);
      if (d >= mon && d <= fri) currentWeekNum = idx + 1;
    });

    let html = '';
    mondays.forEach((mon, idx) => {
      const w = idx + 1;
      html += `<option value="${w}" ${w === currentWeekNum ? 'selected' : ''}>${w}주차</option>`;
    });
    el.w().innerHTML = html;
  }

  // 2. 데이터 조회 및 가로 막대(Gantt) 시간표 렌더링
  // PC는 이제 "그 달 전체"(주차들을 세로로 이어붙인 달력)를 보여주고, 모바일은 기존처럼 한 주만 보여줍니다.
  let currentWeekSchedule = []; // (모바일용) 현재 주차 날짜 데이터 보관
  let currentWeekWorkList = []; // (모바일용) 현재 주차 업무 데이터 보관
  let currentWeekSTime = 0;
  let currentMonthWeeks = []; // (PC용) 이번 달에 속한 주차들의 데이터 배열 (앞뒤로 인접 주 1개씩 포함)
  let currentViewYear = null, currentViewMonth = null; // (PC용) 지금 보고 있는 달 — 전체 월 뷰에서 인접 주 제외용

  // 한 주(월~금 5일 중 하루라도)가 지정한 연·월에 걸쳐 있는지 확인합니다.
  function weekHasDayInMonth_(week, y, m) {
    if (!y || !m) return true;
    // select 값은 문자열로 들어오므로 날짜의 숫자 연·월과 비교하기 전에 통일합니다.
    y = Number(y);
    m = Number(m);
    for (let i = 0; i < 5; i++) {
      const d = new Date(week.sTime + i * 86400000);
      if (d.getFullYear() === y && (d.getMonth() + 1) === m) return true;
    }
    return false;
  }
  let activeFilterIndices = [0, 1, 2, 3, 4]; // 화면에 그려지는 날짜 인덱스 (월~금 5일 고정)
  let currentGradeFilter = 'all'; // 학년 필터 ('all' | '1' | '2' | '3')
  let calendarItemDetails = []; // 화면에 그려진 항목(연간 행사/부서별 업무)의 세부 내용 (클릭 시 팝업용)
  let hasAutoJumpedToThisWeek = false; // PC 첫 조회 때만 "이번주+다음주"를 기본 선택하기 위한 1회성 플래그

  // 화면 폭 기준으로 지금이 모바일 레이아웃인지 판단합니다(CSS의 max-width:768px 기준과 동일).
  function isMobileLayout() {
    return window.matchMedia('(max-width: 768px)').matches;
  }

  // 지금 그려져 있는 화면(모바일=주간 / PC=월간)을 같은 날짜 필터(indices)로 다시 그립니다.
  function rerenderCurrent(indices) {
    if (isMobileLayout()) renderFilteredWeek(indices);
    else renderMonthView(indices);
  }

  function loadAll() {
    const y = el.y().value, m = el.m().value, w = el.w().value;
    toggleLoading(true, "조회 중...");

    activeFilterIndices = [0, 1, 2, 3, 4];
    activeWeekFilter = null;

    if (isMobileLayout()) {
      g.withSuccessHandler(res => {
        toggleLoading(false);
        currentWeekSchedule = res.schedule;
        currentWeekWorkList = res.list;
        currentWeekSTime = res.sTime;

        document.getElementById('printTitle').innerText = `${y}년 ${m}월 ${w}주차 주간 계획서`;
        renderWeekRangeInfo(y);
        updateMonthYearHeading(y, m);

        renderFilteredWeek(activeFilterIndices);
      }).withFailureHandler(err => {
        toggleLoading(false);
        showAlert('데이터를 불러오는 중 오류가 발생했습니다.\n' + (err && err.message ? err.message : err));
      }).getCombinedData(y, m, w);
    } else {
      g.withSuccessHandler(res => {
        toggleLoading(false);
        currentMonthWeeks = res.weeks || [];
        currentViewYear = Number(y);
        currentViewMonth = Number(m);
        document.getElementById('printTitle').innerText = `${y}년 ${m}월 주간 계획서`;
        updateMonthYearHeading(y, m);

        // 맨 처음 페이지를 열었을 때만, 오늘이 포함된 "이번주+다음주"를 함께 보여줍니다.
        // (달을 옮기거나 다시 조회할 때는 그 달 전체를 보여주는 게 맞으므로, 최초 1회만 적용합니다.)
        if (!hasAutoJumpedToThisWeek) {
          hasAutoJumpedToThisWeek = true;
          const today = effectiveToday();
          const todayTime = today.getTime();
          const curWeek = currentMonthWeeks.find(wk => todayTime >= wk.sTime && todayTime <= wk.sTime + 4 * 86400000 + 86399999);
          if (curWeek) {
            // 첫 화면은 이번주와 다음주 2개를 함께 선택해 보여줍니다.
            const WEEK = 7 * 86400000;
            const wanted = [curWeek.sTime, curWeek.sTime + WEEK];
            const avail = currentMonthWeeks.map(w => w.sTime);
            activeWeekFilter = wanted.filter(t => avail.includes(t));
            if (activeWeekFilter.length === 0) activeWeekFilter = [curWeek.sTime];
          }
        }

        renderMonthView(activeFilterIndices);
      }).withFailureHandler(err => {
        toggleLoading(false);
        showAlert('데이터를 불러오는 중 오류가 발생했습니다.\n' + (err && err.message ? err.message : err));
      }).getMonthlyCombinedData(y, m);
    }
  }

  // 상단 큰 제목("◀ 2026년 8월 ▶", 한 줄)을 갱신합니다. 모바일에서는 CSS로 숨겨져 있어 실제로는 PC에서만 보입니다.
  function updateMonthYearHeading(y, m) {
    const elH = document.getElementById('monthYearHeading');
    if (!elH) return;
    elH.innerHTML =
      `<button class="cal-heading-nav" onclick="shiftMonth(-1)" aria-label="이전 달">◀</button>` +
      `<span><span class="cal-heading-year">${y}년</span>${m}월</span>` +
      `<button class="cal-heading-nav" onclick="shiftMonth(1)" aria-label="다음 달">▶</button>`;
  }

  // 년/월 select를 직접 바꿨을 때: PC에서는 바로 다시 조회하고, 모바일에서는 예전처럼 조회 버튼을 눌러야 합니다.
  function onYearMonthChange() {
    upWeeks();
    if (!isMobileLayout()) loadAll();
  }

  // 월 이동 화살표(◀ ▶) 클릭 시: 년/월 select를 옮기고 바로 다시 조회합니다.
  function shiftMonth(offset) {
    let y = parseInt(el.y().value), m = parseInt(el.m().value) + offset;
    if (m < 1) { m = 12; y -= 1; }
    else if (m > 12) { m = 1; y += 1; }
    // 연도 select에 없는 해(선택 가능 범위 밖)로는 넘어가지 않습니다.
    const hasYear = Array.from(el.y().options).some(o => Number(o.value) === y);
    if (!hasYear) return;
    el.y().value = y;
    el.m().value = m;
    upWeeks();
    loadAll();
  }

  // "N주차" 바로가기(전체/1학년/2학년/3학년 줄의 맨 왼쪽, PC 전용)를 그립니다.
  // 실제 소속 달(owningYear/owningMonth, 수요일 기준)별로 줄을 나눠, 각 줄 맨 앞에 "그 달로 가기" 버튼을
  // 두고 그 뒤에 그 달의 주차 버튼을 나열합니다. 오늘이 포함된 주는 "N주차" 대신 "이번주"로 표시합니다.
  // 아무 버튼도 누르지 않은 초기 화면은 항상 달(月) 전체가 그대로 보이는 달력 상태입니다.
  function renderWeekQuickNav() {
    const navEl = document.getElementById('weekQuickNav');
    if (!navEl) return;
    if (!currentMonthWeeks || currentMonthWeeks.length === 0) { navEl.innerHTML = ''; return; }

    const today = effectiveToday();
    const todayTime = today.getTime();

    // 소속 달(owningYear-owningMonth)별로 묶습니다. currentMonthWeeks가 이미 날짜순이라 그룹도 자연히 순서대로 생깁니다.
    // 기본적으로 현재 달과 겹치는 주만 버튼으로 표시하되, 첫 화면의 "이번주+다음주"처럼 실제 화면에
    // 선택되어 보이는 인접 주는 다음 달 소속이어도 버튼을 함께 표시합니다.
    const groups = [];
    const groupIndexByKey = {};
    currentMonthWeeks.filter(w =>
      weekHasDayInMonth_(w, currentViewYear, currentViewMonth) ||
      !!(activeWeekFilter && activeWeekFilter.includes(w.sTime))
    ).forEach(week => {
      const key = week.owningYear + '-' + week.owningMonth;
      if (!(key in groupIndexByKey)) {
        groupIndexByKey[key] = groups.length;
        groups.push({ year: week.owningYear, month: week.owningMonth, weeks: [] });
      }
      groups[groupIndexByKey[key]].weeks.push(week);
    });

    navEl.innerHTML = groups.map(group => {
      const monthBtn = `<button class="week-quick-btn week-quick-month-btn" onclick="jumpToMonth(${group.year}, ${group.month})">${group.month}월</button>`;
      const weekBtns = group.weeks.map(week => {
        const isThisWeek = todayTime >= week.sTime && todayTime <= week.sTime + 4 * 86400000 + 86399999;
        const label = isThisWeek ? '이번주' : `${week.weekNum}주차`;
        const isActive = !!(activeWeekFilter && activeWeekFilter.includes(week.sTime));
        return `<button type="button" aria-pressed="${isActive}" class="week-quick-btn${isThisWeek ? ' week-quick-btn-today' : ''}${isActive ? ' active' : ''}" onclick="toggleQuickWeek(${week.sTime})">${label}</button>`;
      }).join('');
      return `<div class="week-quick-row">${monthBtn}${weekBtns}</div>`;
    }).join('');
  }

  // "N주차"/"이번주" 버튼은 누를 때마다 기존 선택을 유지한 채 추가/해제합니다.
  // 선택이 하나도 남지 않으면 현재 달의 전체 주차를 다시 보여줍니다.
  function toggleQuickWeek(sTime) {
    const next = activeWeekFilter ? [...activeWeekFilter] : [];
    const pos = next.indexOf(sTime);
    if (pos >= 0) next.splice(pos, 1);
    else next.push(sTime);
    activeWeekFilter = next.length ? next.sort((a, b) => a - b) : null;
    renderMonthView(activeFilterIndices);
  }

  // "N월" 버튼 클릭 시: 지금 보고 있는 달이면 그 달 자체 주차들만(다른 달에 곁다리로 걸친 주는 제외) 확대해서
  // 보여주고, 다른 달이면 그 달의 달력으로 이동합니다.
  function jumpToMonth(y, m) {
    if (Number(el.y().value) === y && Number(el.m().value) === m) {
      // 그 달(y년 m월)의 날짜가 월~금 중 하루라도 포함된 주는 모두 보여줍니다.
      // (예: "8월"을 누르면 8/31이 든 9월 1주차(8/31~9/4)도 함께 나옵니다.)
      const weeksOfMonth = (currentMonthWeeks || []).filter(w => {
        for (let i = 0; i < 5; i++) {
          const d = new Date(w.sTime + i * 86400000);
          if (d.getFullYear() === y && (d.getMonth() + 1) === m) return true;
        }
        return false;
      });
      if (weeksOfMonth.length === 0) return;
      activeWeekFilter = weeksOfMonth.map(w => w.sTime);
      renderMonthView(activeFilterIndices);
    } else {
      el.y().value = y;
      el.m().value = m;
      upWeeks();
      loadAll();
    }
  }

  // 항목의 대상 학년(grades, 예: "1,2,3")이 현재 학년 필터에 해당하는지 확인합니다.
  // 대상 학년을 하나도 지정하지 않은 항목(학년 정보 없음)은 "전체" 필터에서만 보이고,
  // 1/2/3학년별 필터에서는 보이지 않습니다.
  function matchesGradeFilter(grades) {
    if (currentGradeFilter === 'all') return true;
    if (!grades) return false;
    return String(grades).split(',').map(s => s.trim()).includes(currentGradeFilter);
  }

  // 학년 필터 칩 클릭 시 호출됩니다. PC(제목 옆)와 모바일(검색창 안) 두 군데에 사본이 있으므로
  // data-grade로 두 군데 모두 활성 표시를 맞춰줍니다.
  function setGradeFilter(grade, btnEl) {
    currentGradeFilter = grade;
    document.querySelectorAll('.grade-filter-group .grade-chip').forEach(b => {
      b.classList.toggle('active', b.dataset.grade === grade);
    });
    rerenderCurrent(activeFilterIndices);
  }

  // 조회된 주차가 몇월 며칠부터 며칠까지인지(예: "2026년 8월 24일 ~ 8월 28일") #rangeInfo에 표시합니다.
  // currentWeekSchedule[i].date는 서버가 "8/24(월)" 형태로 내려주므로 그 중 월/일만 뽑아 씁니다.
  function renderWeekRangeInfo(year) {
    const el2 = document.getElementById('rangeInfo');
    if (!el2) return;
    if (!currentWeekSchedule || currentWeekSchedule.length === 0) { el2.innerText = ''; return; }

    const toMd = raw => {
      const m = String(raw || '').match(/^(\d+)\/(\d+)/);
      return m ? `${m[1]}월 ${m[2]}일` : raw;
    };
    const first = toMd(currentWeekSchedule[0].date);
    const last = toMd(currentWeekSchedule[currentWeekSchedule.length - 1].date);
    el2.innerText = `${year}년 ${first} ~ ${last}`;
  }

  // 부서명 포맷팅 헬퍼 함수
  function formatDeptName(name) {
    const map = {
      '교무기획부': '교무부', '교육과정부': '교육<br>과정부', '교육연구부': '교육<br>연구부',
      '학생안전부': '학생<br>안전부', '체육인성부': '체육<br>인성부', '융합과학정보부': '융합<br>과학<br>정보부',
      '방과후활동부': '방과후<br>활동부', '진로상담부': '진로<br>상담부', '보건실': '보건실',
      '1학년부': '1학년', '2학년부': '2학년', '3학년부': '3학년', '행정실': '행정실'
    };
    return map[name] || name;
  }

  // 모바일 목록에서 부서 이름 줄의 배경색(부서마다 다르게, 날짜/내용 줄과 확실히 구분되도록).
  const DEPT_COLORS = {
    '교무기획부': '#3b82f6', '교육과정부': '#8b5cf6', '교육연구부': '#06b6d4',
    '학생안전부': '#ef4444', '방과후활동부': '#f97316', '융합과학정보부': '#14b8a6',
    '체육인성부': '#22c55e', '진로상담부': '#d97706', '보건실': '#ec4899',
    '1학년부': '#0ea5e9', '2학년부': '#a855f7', '3학년부': '#64748b', '행정실': '#f5b026'
  };
  function deptHeaderColor(name) { return DEPT_COLORS[name] || '#64748b'; }

  // 부서 업무 항목에서 '제목'만 뽑습니다: 선생님들이 보통 첫 줄에 제목을 쓰므로 첫 줄만 쓰고,
  // '[', ']' 기호만 지웁니다(안의 글자는 그대로 둡니다).
  function extractDeptTitle(text) {
    const firstLine = (text || '').split(/\r?\n/)[0] || '';
    return firstLine.replace(/[\[\]]/g, '').trim() || '(제목 없음)';
  }

  // 한 주(week: {schedule, list, sTime}) 분량의 "날짜 헤더 행 + 연간행사 행 + 부서별 업무 행"을 HTML로 만듭니다.
  // 모바일(한 주만 조회)과 PC(달 전체 = 이 함수를 주차 수만큼 반복 호출) 양쪽에서 공용으로 씁니다.
  // registerDetail은 calendarItemDetails에 항목을 등록해 클릭 팝업과 연결하는 함수를 그대로 전달받습니다.
  // isCurrentWeek이 true면(오늘이 이 주에 포함되면), 그 주 전체를 감싸는 강조 테두리를 두릅니다.
  // cornerHtml을 넘기면 맨 왼쪽 위 칸("구분")에 그 내용을 대신 넣습니다(PC 월간 달력의 "N주차" 클릭용).
  function renderWeekBlockHtml(week, indices, fsStyle, deptCellStyle, registerDetail, showDateHeader, isCurrentWeek, cornerHtml) {
    const rows = []; // <tr>...</tr> 문자열을 순서대로 모아 두었다가, 맨 끝에 첫/마지막 행 표시를 붙입니다.

    if (showDateHeader) {
      let headerRow = `<tr style="${fsStyle}">
        <th style="${deptCellStyle} background:#fdfdfd; border-bottom:1px solid #cbd5e1;">
          ${cornerHtml || '구분'}
        </th>`;
      indices.forEach(idx => {
        headerRow += `<th style="${fsStyle} border-bottom:1px solid #cbd5e1; padding:6px;">${week.schedule[idx].date}</th>`;
      });
      headerRow += `</tr>`;
      rows.push(headerRow);
    }

    // 연간 행사(학사일정표, 부서명 없음)를 "같은 행사가 연속된 날짜"별로 하나로 묶어, 부서 업무 항목과
    // 똑같은 형태(st/et를 가진 가상 항목)로 만듭니다. 이렇게 하면 renderCalendarRow가 부서 업무와
    // 동일한 방식으로 날짜 칸을 이어붙인 막대 하나로 그려줍니다(주 안에서 이어지면 이어진 채로 표시).
    const eventOrder = [];
    const eventDayIdx = {};
    week.schedule.forEach((it, dayIdx) => {
      const content = (it.content || '').trim();
      if (!content) return;
      content.split(/\r?\n/).map(s => s.trim()).filter(Boolean).forEach(ev => {
        if (!(ev in eventDayIdx)) { eventDayIdx[ev] = []; eventOrder.push(ev); }
        eventDayIdx[ev].push(dayIdx);
      });
    });
    const eventItems = [];
    eventOrder.forEach(ev => {
      const idxs = eventDayIdx[ev]; // 오름차순
      let runStart = idxs[0], prev = idxs[0];
      for (let k = 1; k <= idxs.length; k++) {
        const cur = idxs[k];
        if (cur === prev + 1) { prev = cur; continue; }
        const dateLabel = (runStart === prev)
          ? week.schedule[runStart].date
          : `${week.schedule[runStart].date} ~ ${week.schedule[prev].date}`;
        eventItems.push({ st: week.sTime + runStart * 86400000, et: week.sTime + prev * 86400000, text: ev, dateLabel });
        runStart = cur; prev = cur;
      }
    });

    // item(st/et)이 이 주에서 화면에 표시된 날짜(indices) 중 어디에 걸치는지 칸 위치로 바꿔줍니다.
    function mapItemToIndices(item) {
      const globalStartIdx = Math.max(0, Math.round((item.st - week.sTime) / 86400000));
      const globalEndIdx = Math.min(4, Math.round((item.et - week.sTime) / 86400000));
      let mapped = [];
      for (let i = globalStartIdx; i <= globalEndIdx; i++) {
        let pos = indices.indexOf(i);
        if (pos !== -1) mapped.push(pos);
      }
      return mapped;
    }

    // 행사 한 줄 / 부서 한 줄을 그리는 공용 함수. 날짜 범위가 이어지는 항목은 칸을 합쳐 색이 이어진
    // 막대 하나로, 제목만 표시합니다. 막대를 누르면 팝업으로 작성된 내용 전체를 볼 수 있습니다.
    function renderCalendarRow(label, popupLabel, items, isEventRow) {
      let rowHtml = `<tr style="page-break-inside: avoid; break-inside: avoid; border-bottom:1px solid #e2e8f0;"${isEventRow ? ' class="cal-event-tr"' : ''}>
        <td class="dept-name-cell" style="${deptCellStyle}${isEventRow ? ' border-right:none;' : ''}">${label}</td>
        <td colspan="${indices.length}" style="padding:0; vertical-align:middle; border:none;">`;
      // 부서명이 2줄로 줄바꿈되어 행이 항목 막대보다 높아질 때, 막대가 위에 붙지 않고 세로 가운데로 오도록 합니다.
      // (표 셀 안에서는 height:100%가 잘 안 먹으므로, td를 vertical-align:middle로 두고 이 div는 내용 높이로 둡니다.)
      // 같은 날짜 항목이 겹쳐 둘째 줄이 생겨도, 이후 날짜의 항목은 윗줄의 빈칸을 다시 찾아 채웁니다.
      rowHtml += `<div style="display:grid; grid-template-columns: repeat(${indices.length}, minmax(0, 1fr)); grid-auto-flow:row dense; gap:6px; padding:10px; box-sizing:border-box;">`;

      items.forEach(item => {
        const mappedIndices = mapItemToIndices(item);
        if (mappedIndices.length > 0) {
          const gridStart = Math.min(...mappedIndices) + 1;
          const span = Math.max(...mappedIndices) - Math.min(...mappedIndices) + 1;
          const title = isEventRow ? item.text : extractDeptTitle(item.text);
          const barClass = 'event-bar' + (isEventRow ? ' cal-event-bar' : '') + (!isEventRow && popupLabel === '행정실' ? ' dept-haengjeong' : '');
          // 이 항목이 실제로 속한 주(연/월/주차, 수요일 기준)를 함께 저장해, 월경계 주(예: 8/31~9/4=9월1주차)의
          // 항목도 현재 달력의 월이 아니라 '항목이 속한 주'로 정확히 조회(수정/삭제)되게 합니다.
          const weekCtx = (week && week.owningYear && week.owningMonth)
            ? { y: week.owningYear, m: week.owningMonth, w: week.weekNum } : null;
          const detailIdx = registerDetail(
            popupLabel, item.dateLabel || item.date || '', item.text, weekCtx,
            item.attachments || [], item.rowNum || null, item.links || []
          );

          rowHtml += `<div class="${barClass}" style="grid-column: ${gridStart} / span ${span}; ${fsStyle}" role="button" tabindex="0" onclick="showItemDetail(${detailIdx})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();showItemDetail(${detailIdx});}">${title}</div>`;
        }
      });
      rowHtml += `</div></td></tr>`;
      return rowHtml;
    }

    const visibleDepts = week.list
      .map(dept => ({ name: dept.name, items: dept.items.filter(item => matchesGradeFilter(item.grades)) }))
      .filter(dept => dept.items.length > 0);

    // 맨 왼쪽 "구분" 칸의 "연간 행사" 글자는 없애고 빈칸으로 둡니다(주황색 배경/줄만 유지).
    // 클릭했을 때 뜨는 팝업 제목에는 구분을 위해 "연간 행사"를 그대로 씁니다.
    if (eventItems.length > 0) rows.push(renderCalendarRow('', '연간 행사', eventItems, true));
    visibleDepts.forEach(dept => { rows.push(renderCalendarRow(formatDeptName(dept.name), dept.name, dept.items, false)); });

    // 모든 주를 하나의 카드처럼 묶고, 오늘이 포함된 주에만 주황색 강조 테두리를 추가합니다.
    // 각 <tr>에 첫 행/중간 행/마지막 행 클래스를 붙여 표 구조를 유지하면서도 주차별 외곽선을 만듭니다.
    const finalRows = rows.map((rowHtml, i) => {
      let cls = 'cal-week-card';
      if (i === 0) cls += ' cal-week-card-start';
      if (i === rows.length - 1) cls += ' cal-week-card-end';
      if (isCurrentWeek) {
        cls += ' cal-current-week';
        if (i === 0) cls += ' cal-current-week-start';
        if (i === rows.length - 1) cls += ' cal-current-week-end';
      }
      return rowHtml.replace(/^<tr style="([^"]*)"( class="([^"]*)")?/,
        (m, styleVal, _g2, existingClass) => `<tr style="${styleVal}" class="${existingClass ? existingClass + ' ' : ''}${cls}"`);
    });

    return { html: finalRows.join(''), visibleDepts };
  }

  // 선택된 날짜 인덱스(예: [0, 2, 4] -> 월, 수, 금)만 화면에 그려주는 (모바일용) 한 주 렌더러
  function renderFilteredWeek(indices) {
    // 최초 조회가 아직 끝나기 전(currentWeekSchedule이 비어있을 때) 학년 필터 등을 눌러도
    // 존재하지 않는 데이터에 접근해 에러가 나지 않도록 조용히 무시합니다.
    if (!currentWeekSchedule || currentWeekSchedule.length === 0) return;
    if (!indices || indices.length === 0) indices = [0, 1, 2, 3, 4];

    // 날짜 개수에 따른 폰트 스케일 계산 (5일: 1.0배, 4일: 1.07배, 3일: 1.14배, 2일: 1.21배, 1일: 1.28배)
    const fontScale = 1.0 + (5 - indices.length) * 0.07;
    const fsStyle = `font-size: ${fontScale}em;`;
    const deptWidth = Math.round(80 * fontScale);
    const deptCellStyle = `width:${deptWidth}px; min-width:${deptWidth}px; box-sizing:border-box; padding:8px 4px; text-align:center; vertical-align:middle; border-right:1px solid #cbd5e1; ${fsStyle}`;

    calendarItemDetails = [];
    function registerDetail(label, dateLabel, text, weekCtx, attachments, rowNum, links) {
      calendarItemDetails.push({
        label, dateLabel, text, weekCtx: weekCtx || null,
        attachments: attachments || [], links: links || [], rowNum: rowNum || null
      });
      return calendarItemDetails.length - 1;
    }

    const week = { schedule: currentWeekSchedule, list: currentWeekWorkList, sTime: currentWeekSTime };
    const { html: bodyHtml, visibleDepts } = renderWeekBlockHtml(week, indices, fsStyle, deptCellStyle, registerDetail, true);

    document.getElementById('workHead').innerHTML = ''; // 날짜 헤더는 이제 본문 첫 행에 포함됩니다.
    document.getElementById('workBody').innerHTML = bodyHtml
      || `<tr style="${fsStyle}"><td colspan="${indices.length + 1}" style="padding:40px; color:#999; text-align:center; ${fsStyle}">데이터 없음</td></tr>`;
    fitEventBarText(); // 칸 폭에 비해 일정명이 길어 잘리면, 잘리지 않을 때까지 글자를 조금씩 줄입니다.

    // 모바일 전용 목록형 렌더링(PC에서는 CSS로 숨김).
    // 위: 연간 행사 — 날짜별로 한 줄씩, 행사 없는 날짜는 표시하지 않고 같은 날 여러 행사는 쉼표로 나열합니다.
    const dateMobileEl = document.getElementById('dateMobileList');
    if (dateMobileEl) {
      const dateItems = indices.map(i => currentWeekSchedule[i]);
      const annualRowsHtml = dateItems
        .filter(it => (it.content || '').trim())
        .map(it => {
          const events = it.content.trim().split(/\r?\n/).map(s => s.trim()).filter(Boolean).join(', ');
          return `<div class="mobile-list-row">
            <div class="mobile-list-date">${it.date}</div>
            <div class="mobile-list-content">${events}</div>
          </div>`;
        }).join('');
      dateMobileEl.innerHTML = `<div class="mobile-list-annual-label">연간 행사</div>`
        + (annualRowsHtml
          || `<div class="mobile-list-row"><div class="mobile-list-content mobile-list-empty">연간 행사가 없습니다.</div></div>`);
    }

    // 아래: 부서별 업무 — 부서마다(지정된 순서로) 그 주의 업무 제목만 세로로 나열합니다. 항목을 누르면
    // 팝업으로 작성된 내용 전체를 볼 수 있습니다.
    const workMobileEl = document.getElementById('workMobileList');
    if (workMobileEl) {
      if (!visibleDepts || visibleDepts.length === 0) {
        workMobileEl.innerHTML = `<div class="mobile-list-row"><div class="mobile-list-content mobile-list-empty">데이터 없음</div></div>`;
      } else {
        workMobileEl.innerHTML = visibleDepts.map(dept => {
          const rows = dept.items.map(item => {
            const detailIdx = registerDetail(dept.name, item.date || '', item.text, null, item.attachments || [], item.rowNum || null, item.links || []);
            return `<div class="mobile-list-row cal-clickable" role="button" tabindex="0" onclick="showItemDetail(${detailIdx})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();showItemDetail(${detailIdx});}">
              <div class="mobile-list-date">${item.date}</div>
              <div class="mobile-list-content">${extractDeptTitle(item.text)}</div>
            </div>`;
          }).join('');
          return `<div class="mobile-list-dept-header" style="background:${deptHeaderColor(dept.name)};">${dept.name}</div>${rows}`;
        }).join('');
      }
    }
  }

  // (PC용) "N주차"를 선택확대/원래대로 하기 위한 상태. 이전의 날짜 단위 선택확대와 같은 방식이며,
  // 단위만 날짜에서 주차로 바뀐 것입니다. 주차 선택은 week.sTime(그 주 월요일 시각, 고유값)으로 구분합니다
  // — weekNum만으로는 "8월 달력에 곁다리로 보이는 9월 1주차"처럼 다른 달의 같은 번호와 겹칠 수 있어서입니다.
  let activeWeekFilter = null; // null이면 이번 달의 모든 주차, 배열(sTime)이면 그 주차들만 표시

  // (PC용) 이번 달에 속한 주차들을 세로로 이어붙여 "월간 달력"처럼 그리는 렌더러.
  function renderMonthView(indices) {
    if (!currentMonthWeeks || currentMonthWeeks.length === 0) return;
    if (!indices || indices.length === 0) indices = [0, 1, 2, 3, 4];

    const fontScale = 1.0 + (5 - indices.length) * 0.07;
    const fsStyle = `font-size: ${fontScale}em;`;
    const deptWidth = Math.round(80 * fontScale);
    const deptCellStyle = `width:${deptWidth}px; min-width:${deptWidth}px; box-sizing:border-box; padding:8px 4px; text-align:center; vertical-align:middle; border-right:1px solid #cbd5e1; ${fsStyle}`;

    calendarItemDetails = [];
    function registerDetail(label, dateLabel, text, weekCtx, attachments, rowNum, links) {
      calendarItemDetails.push({
        label, dateLabel, text, weekCtx: weekCtx || null,
        attachments: attachments || [], links: links || [], rowNum: rowNum || null
      });
      return calendarItemDetails.length - 1;
    }

    // 오늘(주말이면 다음 주)이 포함된 주를 찾아 강조 테두리를 표시합니다.
    const now = effectiveToday();
    const todayTime = now.getTime();

    // 3주 등 필터가 있으면 그 주들만, 전체 월 뷰에서는 그 달에 실제로 걸친 주들만(앞뒤 인접 주는 제외) 보여줍니다.
    const weeksToShow = activeWeekFilter
      ? currentMonthWeeks.filter(w => activeWeekFilter.includes(w.sTime))
      : currentMonthWeeks.filter(w => weekHasDayInMonth_(w, currentViewYear, currentViewMonth));

    let bodyHtml = '';
    weeksToShow.forEach((week, wIdx) => {
      const isCurrentWeek = todayTime >= week.sTime && todayTime <= week.sTime + 4 * 86400000 + 86399999;
      // 이 주가 실제로 소속된 달/주차(수요일 기준)를 두 줄로 보여줍니다. 지금 보고 있는 달과 다를 수 있습니다
      // (예: 8월 달력 맨 끝의 8/31~9/4 주는 "9월 1주차"로 표시됩니다).
      const cornerHtml = `<div style="padding:6px; display:inline-block; line-height:1.3;">${week.owningMonth}월<br>${week.weekNum}주차</div>`;

      const { html } = renderWeekBlockHtml(week, indices, fsStyle, deptCellStyle, registerDetail, true, isCurrentWeek, cornerHtml);
      bodyHtml += html;
      // 주차와 주차 사이를 살짝 띄워 구분합니다(마지막 주는 제외).
      if (wIdx < weeksToShow.length - 1) {
        bodyHtml += `<tr class="cal-week-gap" aria-hidden="true"><td colspan="${indices.length + 1}"></td></tr>`;
      }
    });

    document.getElementById('workHead').innerHTML = '';
    document.getElementById('workBody').innerHTML = bodyHtml
      || `<tr style="${fsStyle}"><td colspan="${indices.length + 1}" style="padding:40px; color:#999; text-align:center; ${fsStyle}">데이터 없음</td></tr>`;
    fitEventBarText();
    renderWeekQuickNav();
  }

  // 항목(연간 행사/부서별 업무) 막대나 모바일 목록 줄을 클릭했을 때, 작성된 내용 전체를 팝업으로 보여줍니다.
  // 저장 텍스트에서 '전달사항'을 분리합니다. body(제목+상세 포함)와 notice로 나눕니다.
  //  - 새 형식: "【전달사항】" 헤더 뒤를 전달사항으로.
  //  - 옛 형식: "전달사항"으로 시작하는 줄(예: "4. 전달사항: ...")부터 뒤를 전달사항으로 자동 감지.
  function splitNotice(text) {
    text = String(text || '');
    const mk = text.match(/^([\s\S]*?)\n*【전달사항】\n*([\s\S]*)$/);
    if (mk) return { body: mk[1].replace(/\s+$/, ''), notice: mk[2].trim() };
    const lines = text.split(/\r?\n/);
    // "전달사항:" 또는 "4. 전달사항:" 또는 "전달사항"(단독 줄)만 감지 (뒤에 다른 말이 붙은 줄은 제외해 오탐 방지)
    const idx = lines.findIndex(l => /^\s*\d*\s*[.)]?\s*전달\s*사항\s*(?:[:：]|\s*$)/.test(l));
    if (idx !== -1) {
      const body = lines.slice(0, idx).join('\n').replace(/\s+$/, '');
      const firstNoticeLine = lines[idx].replace(/^\s*\d*\s*[.)]?\s*전달\s*사항\s*[:：]?\s*/, '');
      const notice = [firstNoticeLine].concat(lines.slice(idx + 1)).join('\n').trim();
      return { body: body, notice: notice };
    }
    return { body: text, notice: '' };
  }

  // 저장 텍스트를 { title, detail, notice }로 분해합니다. (수정 창 3칸 채우기용)
  //  - 제목: 첫 줄이 "[...]" 이면 그 안의 글자.
  function parseTaskText(raw) {
    raw = String(raw || '');
    let title = '', rest = raw;
    const nl = raw.indexOf('\n');
    const firstLine = nl === -1 ? raw : raw.slice(0, nl);
    const tm = firstLine.match(/^\s*\[(.*)\]\s*$/);
    if (tm) { title = tm[1].trim(); rest = (nl === -1) ? '' : raw.slice(nl + 1); }
    const sn = splitNotice(rest);
    return { title: title, detail: sn.body.trim(), notice: sn.notice };
  }

  let currentDetailIdx = -1; // 지금 팝업에 열려 있는 항목의 calendarItemDetails 인덱스 (수정/삭제 버튼에서 사용)
  function showItemDetail(idx) {
    const d = calendarItemDetails[idx];
    if (!d) return;
    currentDetailIdx = idx;
    document.getElementById('itemDetailDept').innerText = d.label || '';
    document.getElementById('itemDetailDate').innerText = d.dateLabel || '';
    // 저장 텍스트를 제목/내용/전달사항으로 분해해 각각 표시합니다.
    //  - 제목: 대괄호 없이 가운데·굵게·크게(별도 요소)  - 전달사항: 아래 박스(라벨+색)
    const p = parseTaskText(d.text);
    const titleEl = document.getElementById('itemDetailTitle');
    if (p.title) { titleEl.innerHTML = p.title; titleEl.style.display = 'block'; }
    else { titleEl.style.display = 'none'; }
    document.getElementById('itemDetailText').innerHTML = p.detail;
    const noticeWrap = document.getElementById('itemDetailNoticeWrap');
    if (p.notice) {
      document.getElementById('itemDetailNotice').innerHTML = p.notice;
      noticeWrap.style.display = 'block';
    } else {
      noticeWrap.style.display = 'none';
    }
    const attachmentWrap = document.getElementById('itemDetailAttachmentWrap');
    const attachmentList = document.getElementById('itemDetailAttachmentList');
    attachmentList.innerHTML = '';
    if (d.attachments && d.attachments.length && d.rowNum) {
      d.attachments.forEach((file, fileIdx) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.onclick = () => downloadScheduleAttachment(currentDetailIdx, fileIdx);
        const icon = document.createElement('i');
        icon.className = 'fas fa-download';
        const name = document.createElement('span');
        name.textContent = file.fileName;
        button.append(icon, name);
        attachmentList.appendChild(button);
      });
      attachmentWrap.style.display = 'block';
    } else {
      attachmentWrap.style.display = 'none';
    }
    // 링크: 등록 시 넣어둔 '이름 붙인 주소'를 버튼으로 보여줍니다. 버튼을 누르면 새 창으로 열리고,
    //       옆의 '복사' 버튼으로 (긴 주소도) 클립보드에 바로 복사할 수 있습니다.
    const linkWrap = document.getElementById('itemDetailLinkWrap');
    const linkList = document.getElementById('itemDetailLinkList');
    linkList.innerHTML = '';
    if (d.links && d.links.length) {
      d.links.forEach(link => {
        const row = document.createElement('div');
        row.className = 'item-detail-link-row';

        const item = document.createElement('div');
        item.className = 'item-detail-link-item';
        const open = document.createElement('a');
        open.href = link.url; open.target = '_blank'; open.rel = 'noopener noreferrer';
        open.className = 'item-detail-link-open';
        const icon = document.createElement('i'); icon.className = 'fas fa-link';
        const name = document.createElement('span'); name.textContent = link.name || link.url;
        open.append(icon, name);
        const copy = document.createElement('button');
        copy.type = 'button'; copy.className = 'item-detail-link-copy'; copy.title = '주소 복사';
        copy.textContent = '복사';
        copy.onclick = () => copyScheduleLink(link.url, copy);
        const qrBtn = document.createElement('button');
        qrBtn.type = 'button'; qrBtn.className = 'item-detail-link-qr'; qrBtn.title = 'QR 코드 만들기';
        qrBtn.textContent = 'QR코드 생성';
        item.append(open, copy, qrBtn);

        // QR 박스(처음엔 숨김): 'QR코드 생성'을 누르면 링크 오른쪽에 QR 그림 + 'QR 복사' 버튼이 나옵니다.
        const qrBox = document.createElement('div');
        qrBox.className = 'item-detail-qr-box'; qrBox.style.display = 'none';
        const qrHolder = document.createElement('div');
        qrHolder.className = 'item-detail-qr-holder';
        const qrCopy = document.createElement('button');
        qrCopy.type = 'button'; qrCopy.className = 'item-detail-qr-copy'; qrCopy.textContent = 'QR 복사';
        qrBox.append(qrHolder, qrCopy);
        qrBtn.onclick = () => toggleLinkQR(link.url, qrBox, qrHolder, qrCopy, qrBtn);

        row.append(item, qrBox);
        linkList.appendChild(row);
      });
      linkWrap.style.display = 'block';
    } else {
      linkWrap.style.display = 'none';
    }
    // 연간 행사(부서명 없음)는 학사일정표 시트에서 직접 관리하므로 이 화면에서는 수정/삭제할 수 없습니다.
    document.getElementById('itemDetailActions').style.display = (d.label === '연간 행사') ? 'none' : 'flex';
    initItemDetailDrag();               // 드래그 기능 준비(최초 1회만 실제로 설정)
    if (_resetItemDetailPos) _resetItemDetailPos(); // 열 때마다 가운데로 되돌립니다.
    openMod('itemDetailMod');
  }

  // 링크 주소를 클립보드에 복사합니다. (긴 주소도 한 번에) 복사되면 버튼에 잠깐 '복사됨'을 표시합니다.
  function copyScheduleLink(url, btn) {
    const flash = () => {
      const original = btn.textContent;
      btn.textContent = '복사됨';
      btn.classList.add('copied');
      setTimeout(() => { btn.textContent = original; btn.classList.remove('copied'); }, 1300);
    };
    const fallback = () => {
      try {
        const ta = document.createElement('textarea');
        ta.value = url; ta.style.position = 'fixed'; ta.style.top = '-1000px'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.focus(); ta.select();
        document.execCommand('copy'); document.body.removeChild(ta);
        flash();
      } catch (e) { showAlert('복사에 실패했습니다. 아래 주소를 직접 복사해주세요.\n\n' + url); }
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(flash).catch(fallback);
    } else {
      fallback();
    }
  }

  // 'QR코드 생성' 버튼: 링크 오른쪽에 QR 그림을 그려서 보여주거나(다시 누르면) 닫습니다.
  // QR은 브라우저 안에서 직접 그려지므로 주소가 외부 서버로 나가지 않습니다.
  function toggleLinkQR(url, box, holder, copyBtn, genBtn) {
    if (box.style.display !== 'none') {          // 이미 열려 있으면 닫기
      box.style.display = 'none';
      genBtn.textContent = 'QR코드 생성';
      return;
    }
    if (typeof QRCode === 'undefined') {
      showAlert('QR 생성 기능을 아직 불러오지 못했습니다. 인터넷 연결을 확인한 뒤 잠시 후 다시 시도해주세요.');
      return;
    }
    holder.innerHTML = '';
    try {
      new QRCode(holder, { text: url, width: 150, height: 150, correctLevel: QRCode.CorrectLevel.M });
      box.style.display = 'flex';
      genBtn.textContent = 'QR 닫기';
      copyBtn.onclick = () => copyLinkQR(holder, copyBtn);
    } catch (e) {
      showAlert('QR 코드를 만들지 못했습니다.\n' + (e && e.message ? e.message : e));
    }
  }

  // QR 그림을 이미지(PNG)로 클립보드에 복사합니다. (다른 곳에 붙여넣어 활용)
  function copyLinkQR(holder, btn) {
    const canvas = holder.querySelector('canvas');
    if (!canvas || !canvas.toBlob) {
      showAlert('QR 이미지를 준비하지 못했습니다. QR 그림을 마우스 오른쪽 클릭(모바일은 길게 눌러) → "이미지 복사"를 사용해주세요.');
      return;
    }
    const flash = () => {
      const o = btn.textContent;
      btn.textContent = '복사됨'; btn.classList.add('copied');
      setTimeout(() => { btn.textContent = o; btn.classList.remove('copied'); }, 1300);
    };
    const manual = () => showAlert('이 브라우저에서는 버튼으로 바로 복사가 안 됩니다.\nQR 그림을 마우스 오른쪽 클릭(모바일은 길게 눌러) → "이미지 복사"를 사용해주세요.');
    if (navigator.clipboard && window.ClipboardItem) {
      canvas.toBlob(blob => {
        if (!blob) { manual(); return; }
        navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]).then(flash).catch(manual);
      }, 'image/png');
    } else {
      manual();
    }
  }

  // 세부 내용 팝업을 상단(제목/날짜 줄)을 잡고 자유롭게 옮길 수 있게 합니다. (닫기 × 버튼은 제외)
  let _itemDetailDragReady = false;
  let _resetItemDetailPos = null;
  function initItemDetailDrag() {
    if (_itemDetailDragReady) return;
    const content = document.getElementById('itemDetailContent');
    const handle = document.getElementById('itemDetailHeader');
    if (!content || !handle) return;
    _itemDetailDragReady = true;
    let dragging = false, startX = 0, startY = 0, curX = 0, curY = 0;
    const apply = () => { content.style.transform = `translate(${curX}px, ${curY}px)`; };
    _resetItemDetailPos = () => { curX = 0; curY = 0; content.style.transform = ''; };
    handle.addEventListener('mousedown', e => {
      if (e.target.closest('[aria-label="닫기"]')) return; // 닫기 버튼 클릭은 드래그로 처리하지 않음
      dragging = true;
      startX = e.clientX - curX;
      startY = e.clientY - curY;
      document.body.style.userSelect = 'none';
      e.preventDefault();
    });
    document.addEventListener('mousemove', e => {
      if (!dragging) return;
      curX = e.clientX - startX;
      curY = e.clientY - startY;
      apply();
    });
    document.addEventListener('mouseup', () => {
      if (!dragging) return;
      dragging = false;
      document.body.style.userSelect = '';
    });
  }

  function downloadScheduleAttachment(idx, fileIdx) {
    const d = calendarItemDetails[idx];
    const attachment = d && d.attachments ? d.attachments[fileIdx] : null;
    if (!d || !attachment || !d.rowNum) return;
    toggleLoading(true, '첨부파일을 준비 중...');
    g.withSuccessHandler(res => {
      toggleLoading(false);
      if (!res || !res.success) { showAlert((res && res.message) || '첨부파일을 불러오지 못했습니다.'); return; }
      const byteChars = atob(res.base64);
      const bytes = new Uint8Array(byteChars.length);
      for (let i = 0; i < byteChars.length; i++) bytes[i] = byteChars.charCodeAt(i);
      const blob = new Blob([bytes], { type: res.mimeType || 'application/octet-stream' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = res.fileName || attachment.fileName || 'download';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }).withFailureHandler(err => {
      toggleLoading(false);
      showAlert('첨부파일 다운로드 중 오류가 발생했습니다.\n' + (err && err.message ? err.message : err));
    }).getScheduleAttachmentContent(d.rowNum, attachment.fileId);
  }

  // "주간 일정" 달력 막대는 칸 폭에 맞춰 한 줄로 자동으로 잘립니다(...). 일정명이 칸보다 길어 잘렸으면,
  // 다 보일 때까지(또는 너무 작아지기 전까지) 글자 크기를 조금씩 줄입니다.
  function fitEventBarText() {
    const minFontSize = 9;
    document.querySelectorAll('#workBody .event-bar').forEach(el => {
      el.style.fontSize = '';
      let fontSize = parseFloat(getComputedStyle(el).fontSize);
      let guard = 0;
      while (el.scrollWidth > el.clientWidth + 1 && fontSize > minFontSize && guard < 20) {
        fontSize -= 0.5;
        el.style.fontSize = fontSize + 'px';
        guard++;
      }
    });
  }


  // 3. UI 유틸리티 (로딩, 모달, 알림창)
  function toggleLoading(s, t) {
    document.getElementById('loadingOverlay').style.display = s ? 'flex' : 'none';
    if (s) document.getElementById('loadingText').innerText = t || '로딩 중...';
  }
  
  function openMod(id) { document.getElementById(id).style.display = 'flex'; }
  function closeMod(id) { document.getElementById(id).style.display = 'none'; }
  
  function showAlert(msg) {
    const alertMod = document.getElementById('customAlertMod');
    if (alertMod) alertMod.style.zIndex = '10010';
    document.getElementById('alertMsg').innerText = msg;
    document.getElementById('alertCancelBtn').style.display = 'none';
    document.getElementById('alertOkBtn').onclick = () => closeMod('customAlertMod');
    openMod('customAlertMod');
  }

  function showConfirm(msg, callback) {
    const alertMod = document.getElementById('customAlertMod');
    if (alertMod) alertMod.style.zIndex = '10010';
    document.getElementById('alertMsg').innerText = msg;
    const cancelBtn = document.getElementById('alertCancelBtn');
    const okBtn = document.getElementById('alertOkBtn');
    
    cancelBtn.style.display = 'block'; 
    
    okBtn.onclick = () => {
      closeMod('customAlertMod');
      cancelBtn.style.display = 'none';
      if (callback) callback(); 
    };
    
    cancelBtn.onclick = () => {
      closeMod('customAlertMod');
      cancelBtn.style.display = 'none';
    };
    
    openMod('customAlertMod');
  }

  // --- 인쇄 및 복사 제어 로직 ---
  function copyTimetable() {
    const viewEl = document.getElementById('viewTimetable');
    let targetTable = viewEl.querySelector('table') || (viewEl.tagName === 'TABLE' || viewEl.tagName === 'TBODY' ? viewEl : viewEl);
    
    const range = document.createRange();
    range.selectNode(targetTable);
    window.getSelection().removeAllRanges();
    window.getSelection().addRange(range);
    try {
      document.execCommand('copy');
      showAlert("시간표 표가 복사되었습니다.\n엑셀이나 한글 문서에 바로 붙여넣기(Ctrl+V) 하세요!");
    } catch (err) {
      showAlert("복사 실패: 사용 중인 브라우저 환경을 확인해주세요.");
    }
    window.getSelection().removeAllRanges();
  }

  function printTimetable() {
    const viewEl = document.getElementById('viewTimetable');
    let targetTable = viewEl.querySelector('table') || viewEl;
    const title = currentTimetableTitle;

    const win = window.open('', '_blank', 'width=1000,height=800');
    if (!win) {
      showAlert('팝업이 차단되어 인쇄 화면을 열 수 없습니다.\n브라우저 주소창의 팝업 차단 아이콘을 눌러 이 사이트의 팝업을 허용한 뒤 다시 시도해주세요.');
      return;
    }
    win.document.write('<html><head><title>' + title + '</title>');
    win.document.write('<style>');
    win.document.write('body { font-family: "Malgun Gothic", sans-serif; padding: 20px; }');
    win.document.write('table { border-collapse: collapse; text-align: center; width: 100%; margin: 0 auto; font-size: 14px; }');
    win.document.write('th, td { border: 1px solid #cbd5e1; padding: 10px; }');
    win.document.write('th { background: #f1f5f9 !important; font-weight: bold; }');
    win.document.write('</style></head><body>');
    win.document.write('<h2 style="text-align:center; color:#333;">' + title + '</h2>');
    
    if (targetTable.tagName === 'TBODY') {
      win.document.write('<table>' + targetTable.innerHTML + '</table>');
    } else {
      win.document.write(targetTable.outerHTML);
    }
    
    win.document.write('</body></html>');
    win.document.close();
    win.onload = function() {
      win.focus();
      win.print();
      win.close();
    };
  }

  // --- 전체 시간표 모달 및 확대/축소 제어 로직 ---
  let timetableZoom = 0.9;
  let fullTimetableData = [];
  let fullTimetableBgs = [];
  // 인쇄 제목으로 쓰는 "진짜" 제목. #zoomLabel은 확대/축소(%) 표시 전용이라
  // 그걸 그대로 인쇄 제목으로 쓰면 확대 후 제목이 "100%"로 깨져버리므로 별도 변수로 관리합니다.
  let currentTimetableTitle = '전체 시간표';

  // 전체시간표가 실제로 적용되는 기간(학기 시작~방학식 등). 서버(스크립트 속성)에서 불러온 값을 캐시합니다.
  // 결보강 계획서의 날짜 추천이 이 기간을 벗어나지 않도록 참고합니다.
  let scheduleValidRange = null;

  // 저장된 값이 없을 때 쓰는 기본값: 우리나라 학년도 관례상 3/1 ~ 다음해 2월 말일.
  function computeDefaultSchoolYearRange(baseDate) {
    const d = baseDate || new Date();
    const y = d.getFullYear();
    const startYear = (d.getMonth() >= 2) ? y : y - 1; // 3월(index 2) 이전이면 전년도 학년도
    const endYear = startYear + 1;
    const from = `${startYear}-03-01`;
    const lastFebDay = new Date(endYear, 2, 0).getDate(); // 28 또는 29(윤년)
    const to = `${endYear}-02-${String(lastFebDay).padStart(2, '0')}`;
    return { from, to };
  }

  // scheduleValidRange를 아직 못 불러왔다면 서버에서 가져온 뒤 callback(range)을 호출합니다.
  function ensureScheduleValidRange(callback) {
    if (scheduleValidRange) { callback(scheduleValidRange); return; }
    g.withSuccessHandler(res => {
      const def = computeDefaultSchoolYearRange();
      scheduleValidRange = { from: (res && res.from) || def.from, to: (res && res.to) || def.to };
      callback(scheduleValidRange);
    }).withFailureHandler(() => {
      scheduleValidRange = computeDefaultSchoolYearRange();
      callback(scheduleValidRange);
    }).getScheduleValidRange();
  }

  function openTimetableModal() {
    // 이미 불러온 시간표가 있으면 다시 서버에 요청하지 않고 그대로 재사용합니다.
    if (fullTimetableData && fullTimetableData.length > 0) {
      ttSelectedGrade = null;
      ttActiveDays = ['월', '화', '수', '목', '금'];
      renderTtGradeBar();
      renderFullTimetable();
      openMod('timetableMod');
      return;
    }

    toggleLoading(true, "전체 시간표 및 배경색 로딩 중...");
    g.withSuccessHandler(res => {
      toggleLoading(false);

      ttSelectedGrade = null;
      ttActiveDays = ['월', '화', '수', '목', '금'];
      renderTtGradeBar();

      if (!res || !res.values || res.values.length === 0) {
        document.getElementById('viewTimetable').innerHTML = '<tr><td style="padding:40px; color:#999; text-align:center;">시간표 데이터 또는 "전체시간표" 시트를 찾을 수 없습니다.</td></tr>';
      } else {
        fullTimetableData = res.values;
        fullTimetableBgs = res.backgrounds;
        renderFullTimetable();
      }

      openMod('timetableMod');
    }).withFailureHandler(err => {
      toggleLoading(false);
      showAlert('전체 시간표를 불러오는 중 오류가 발생했습니다.\n' + (err && err.message ? err.message : err));
    }).getTimetableFromSheet();
  }

  // 요일/교시(0,1열)는 세로로 병합해서 가운데 정렬하고, 학년/반(2열~) 헤더는 "1-1","3-4"처럼
  // 학년 숫자+반 숫자 한 줄로 합쳐서 보여주는 공용 렌더러입니다. dayFilter가 없으면 전체 요일을 표시합니다.
  // dataCellRenderer(r, cIdx)가 주어지면 2열(학년/반 데이터) 셀의 렌더링을 위임합니다.
  // 문자열을 반환하면 그 <td>...</td> 마크업을 그대로 쓰고, null/undefined면 기본 렌더링으로 대체합니다.
  function buildMergedTimetableHtml(cols, dayFilter, dataCellRenderer) {
    const dayList = ['월', '화', '수', '목', '금'];

    let gradeRowIdx = -1;
    for (let i = 0; i < 10; i++) {
      if (fullTimetableData[i] && fullTimetableData[i].some(v => String(v).includes('1학년'))) {
        gradeRowIdx = i; break;
      }
    }
    const classRowIdx = gradeRowIdx !== -1 ? gradeRowIdx + 1 : -1;
    const headerEnd = classRowIdx !== -1 ? classRowIdx : 1;
    const dataStart = headerEnd + 1;

    let colGradeNum = {};
    if (gradeRowIdx !== -1) {
      let currentGradeText = '';
      for (let c = 2; c < fullTimetableData[gradeRowIdx].length; c++) {
        let gVal = String(fullTimetableData[gradeRowIdx][c] || '').trim();
        if (gVal.includes('학년')) currentGradeText = gVal;
        const m = currentGradeText.match(/(\d+)/);
        colGradeNum[c] = m ? m[1] : '';
      }
    }

    const labelColStyle = 'width:30px; padding:4px; font-size:13px; line-height:1.2; white-space:normal;';
    // width(고정 기준값)로 지정해야 auto 테이블 레이아웃이 모든 열에 이 너비를 기본값으로 맞추고,
    // 내용이 이 너비 안에 줄바꿈으로 다 안 들어갈 때만 그 열만 더 넓어집니다. (min-width는 표에서 무시되는 경우가 있음)
    const dataColStyle = 'width:52px; padding:6px; font-size:14px; line-height:1.4; white-space:normal;';

    // 헤더 1행: 요일 / 교시 (아래 반 번호 행까지 세로 병합)
    let headHtml = '<tr>';
    cols.forEach(cIdx => {
      if (cIdx !== 0 && cIdx !== 1) return;
      const rawBg = (fullTimetableBgs[gradeRowIdx] || [])[cIdx];
      const bg = (rawBg && rawBg !== '#ffffff') ? rawBg : '#f1f5f9';
      const label = String((fullTimetableData[gradeRowIdx] || [])[cIdx] || '').trim();
      headHtml += `<th rowspan="2" style="background:${bg}; ${labelColStyle} vertical-align:middle; text-align:center;">${label}</th>`;
    });
    headHtml += '</tr>';

    // 헤더 2행: 학년-반 (예: 1-1, 3-4)
    headHtml += '<tr>';
    cols.forEach(cIdx => {
      if (cIdx === 0 || cIdx === 1) return;
      const rawClass = String((fullTimetableData[classRowIdx] || [])[cIdx] || '').trim();
      const label = colGradeNum[cIdx] ? `${colGradeNum[cIdx]}-${rawClass}` : rawClass;
      const rawBg = (fullTimetableBgs[classRowIdx] || [])[cIdx];
      const bg = (rawBg && rawBg !== '#ffffff') ? rawBg : '#f1f5f9';
      headHtml += `<th style="background:${bg}; ${dataColStyle}">${label}</th>`;
    });
    headHtml += '</tr>';

    // 본문: dayFilter에 해당하는 행만 골라내고, 요일(0열)은 같은 요일끼리 세로 병합합니다.
    let rowsToRender = [];
    let currentDay = '';
    for (let r = dataStart; r < fullTimetableData.length; r++) {
      let rowDay = String(fullTimetableData[r][0] || '').trim();
      if (rowDay && dayList.includes(rowDay)) currentDay = rowDay;
      if (!currentDay) continue;
      if (dayFilter && !dayFilter.includes(currentDay)) continue;
      rowsToRender.push({ r, day: currentDay });
    }

    let blockSizeAt = {};
    for (let i = 0; i < rowsToRender.length; i++) {
      if (i === 0 || rowsToRender[i].day !== rowsToRender[i - 1].day) {
        let size = 1;
        for (let j = i + 1; j < rowsToRender.length && rowsToRender[j].day === rowsToRender[i].day; j++) size++;
        blockSizeAt[rowsToRender[i].r] = size;
      }
    }

    // 너비와 같은 원리로, 행도 height(고정 기준값)를 줘서 기본 높이를 통일하고
    // 줄바꿈된 내용이 그 안에 다 안 들어가는 행만 자동으로 더 높아지게 합니다.
    let bodyHtml = '';
    rowsToRender.forEach(({ r, day }) => {
      bodyHtml += '<tr style="height:52px;">';
      cols.forEach(cIdx => {
        const originalBg = (fullTimetableBgs[r] || [])[cIdx];

        if (cIdx === 0) {
          if (blockSizeAt[r]) {
            bodyHtml += `<td rowspan="${blockSizeAt[r]}" style="${labelColStyle} vertical-align:middle; text-align:center; font-weight:700; background:#f8fafc;">${day}</td>`;
          }
          return;
        }

        if (cIdx >= 2 && dataCellRenderer) {
          const custom = dataCellRenderer(r, cIdx);
          if (custom === false) return; // colspan으로 이미 병합된 셀 - 아무것도 렌더링하지 않고 건너뜁니다.
          if (custom) { bodyHtml += custom; return; }
        }

        let displayCell = String((fullTimetableData[r] || [])[cIdx] || '');
        if (cIdx >= 2 && displayCell.trim()) {
          // 공백마다 다 줄바꿈하면 "생Ⅱ E 신윤지"처럼 블럭 문자가 붙은 과목은 3줄이 되어
          // 다른 행보다 부쩍 높아지므로, 마지막 단어(교사명)만 따로 떼어 2줄로 통일합니다.
          const tokens = displayCell.trim().split(/\s+/);
          if (tokens.length > 1) {
            const teacher = tokens.pop();
            displayCell = tokens.join(' ') + '<br>' + teacher;
          } else {
            displayCell = tokens[0];
          }
        }

        const style = (cIdx === 1) ? labelColStyle : dataColStyle;
        let tdBg = (originalBg && originalBg !== '#ffffff') ? originalBg : '#ffffff';
        if (!displayCell.trim() && tdBg === '#ffffff') tdBg = '#f8fafc';
        bodyHtml += `<td style="background: ${tdBg}; ${style}">${displayCell}</td>`;
      });
      bodyHtml += '</tr>';
    });

    return headHtml + bodyHtml;
  }

  function renderFullTimetable() {
    currentTimetableTitle = '전체 시간표';
    const totalCols = fullTimetableData[0] ? fullTimetableData[0].length : 0;
    const cols = [];
    for (let c = 0; c < totalCols; c++) cols.push(c);

    document.getElementById('viewTimetable').innerHTML = buildMergedTimetableHtml(cols, null);
    resetZoomTimetable();

    const modalBox = document.querySelector('#timetableMod .modal-content');
    if (modalBox) {
      modalBox.style.width = '95vw';
      modalBox.style.height = '90vh';
    }
  }

  // --- 전체/학년별 탭 + 요일 필터 전환 ---
  let ttSelectedGrade = null; // null = "전체" 모드, 아니면 '1학년'|'2학년'|'3학년'
  let ttActiveDays = ['월', '화', '수', '목', '금'];

  function selectTtAll() {
    ttSelectedGrade = null;
    ttActiveDays = ['월', '화', '수', '목', '금'];
    if (document.getElementById('searchGrade')) {
      document.getElementById('searchGrade').selectedIndex = 0;
      document.getElementById('searchClass').selectedIndex = 0;
    }
    renderTtGradeBar();
    renderFullTimetable();
  }

  function selectTtGrade(grade) {
    ttSelectedGrade = grade;
    ttActiveDays = ['월', '화', '수', '목', '금'];
    if (document.getElementById('searchGrade')) {
      document.getElementById('searchGrade').selectedIndex = 0;
      document.getElementById('searchClass').selectedIndex = 0;
    }
    renderTtGradeBar();
    renderGradeTimetable(grade, ttActiveDays);
  }

  // 요일 버튼 클릭 시: 처음(5일 전체 선택 상태)에는 클릭한 요일 하나만 남기고,
  // 그 다음부터는 클릭할 때마다 해당 요일을 추가/제거합니다 (최소 1개는 유지).
  function toggleTtDay(day) {
    if (!ttSelectedGrade) return;
    if (ttActiveDays.length === 5) {
      ttActiveDays = [day];
    } else if (ttActiveDays.includes(day)) {
      if (ttActiveDays.length > 1) ttActiveDays = ttActiveDays.filter(d => d !== day);
    } else {
      ttActiveDays.push(day);
    }
    renderTtGradeBar();
    renderGradeTimetable(ttSelectedGrade, ttActiveDays);
  }

  function renderTtGradeBar() {
    const bar = document.getElementById('ttGradeBar');
    if (!bar) return;

    if (!ttSelectedGrade) {
      bar.innerHTML = `
        <button type="button" class="tt-grade-tab active" onclick="selectTtAll()">전체</button>
        <button type="button" class="tt-grade-tab" onclick="selectTtGrade('1학년')">1학년</button>
        <button type="button" class="tt-grade-tab" onclick="selectTtGrade('2학년')">2학년</button>
        <button type="button" class="tt-grade-tab" onclick="selectTtGrade('3학년')">3학년</button>
      `;
    } else {
      const days = ['월', '화', '수', '목', '금'];
      const daysHtml = days.map(d => {
        const active = ttActiveDays.includes(d) ? 'active' : '';
        return `<button type="button" class="tt-grade-tab tt-day-tab ${active}" onclick="toggleTtDay('${d}')">${d}</button>`;
      }).join('');
      bar.innerHTML = `
        <button type="button" class="tt-grade-tab" onclick="selectTtAll()">전체</button>
        <button type="button" class="tt-grade-tab active" onclick="selectTtGrade('${ttSelectedGrade}')">${ttSelectedGrade}</button>
        ${daysHtml}
      `;
    }
  }

  // 선택한 학년의 반들만, 선택한 요일의 행만 추려서 전체시간표와 동일한 형태로 렌더링합니다.
  function renderGradeTimetable(grade, days) {
    currentTimetableTitle = `${grade} 시간표`;
    if (!days) days = ttActiveDays;

    let gradeRowIdx = -1;
    for (let i = 0; i < 10; i++) {
      if (fullTimetableData[i] && fullTimetableData[i].some(v => String(v).includes('1학년'))) {
        gradeRowIdx = i; break;
      }
    }

    let matchCols = [];
    let currentGrade = "";
    if (gradeRowIdx !== -1) {
      for (let c = 2; c < fullTimetableData[gradeRowIdx].length; c++) {
        let gVal = String(fullTimetableData[gradeRowIdx][c] || '').trim();
        if (gVal.includes('학년')) currentGrade = gVal;
        if (currentGrade === grade) matchCols.push(c);
      }
    }

    if (matchCols.length === 0) {
      document.getElementById('viewTimetable').innerHTML = `<tr><td style="padding:40px; color:#999; text-align:center;">${grade} 시간표 열을 찾을 수 없습니다.</td></tr>`;
      return;
    }

    const cols = [0, 1].concat(matchCols);
    document.getElementById('viewTimetable').innerHTML = buildMergedTimetableHtml(cols, days);
    resetZoomTimetable();

    const modalBox = document.querySelector('#timetableMod .modal-content');
    if (modalBox) {
      modalBox.style.width = '910px';
      modalBox.style.height = '910px';
    }
  }

  function searchClassTimetable() {
    ttSelectedGrade = null;
    ttActiveDays = ['월', '화', '수', '목', '금'];
    renderTtGradeBar();
    const selectedGrade = document.getElementById('searchGrade').value;
    const selectedClass = document.getElementById('searchClass').value; 

    let schedule = { '1':{}, '2':{}, '3':{}, '4':{}, '5':{}, '6':{}, '7':{}, '8':{} };
    const days = ['월', '화', '수', '목', '금'];

    let gradeRowIdx = -1;
    for (let i = 0; i < 10; i++) {
      if (fullTimetableData[i] && fullTimetableData[i].some(v => String(v).includes('1학년'))) {
        gradeRowIdx = i; break;
      }
    }
    let classRowIdx = gradeRowIdx !== -1 ? gradeRowIdx + 1 : -1;

    let targetColIndex = -1;
    let currentGrade = "";

    if (gradeRowIdx !== -1 && classRowIdx !== -1) {
      for (let c = 2; c < fullTimetableData[gradeRowIdx].length; c++) {
        let gVal = String(fullTimetableData[gradeRowIdx][c] || '').trim();
        if (gVal.includes('학년')) currentGrade = gVal;
        
        let cVal = String(fullTimetableData[classRowIdx][c] || '').trim();
        let formattedClass = (cVal && !isNaN(cVal)) ? cVal + '반' : cVal;

        if (currentGrade === selectedGrade && formattedClass === selectedClass) {
          targetColIndex = c;
          break;
        }
      }
    }

    if (targetColIndex === -1) {
      showAlert(`${selectedGrade} ${selectedClass} 시간표 열을 찾을 수 없습니다.`); return;
    }

    let currentDay = "";
    let startRow = classRowIdx !== -1 ? classRowIdx + 1 : 4;

    for (let r = startRow; r < fullTimetableData.length; r++) {
      let rowDay = String(fullTimetableData[r][0] || '').trim();
      if (rowDay && days.includes(rowDay)) currentDay = rowDay;
      
      let periodStr = String(fullTimetableData[r][1] || '').trim();
      let pMatch = periodStr.match(/([1-8])/);
      if (!pMatch) continue; 
      let pNum = pMatch[1];

      if (!currentDay) continue;

      let cellVal = String(fullTimetableData[r][targetColIndex] || '').trim();
      if (cellVal) {
        if (!schedule[pNum]) schedule[pNum] = {};
        let formattedCell = cellVal.replace(/\n/g, ' ').replace(/_x000D_/g, '');
        schedule[pNum][currentDay] = `<span style="font-size:13px; color:#1e293b; font-weight:600;">${formattedCell}</span>`;
      }
    }

    renderCompactTimetable(schedule, `${selectedGrade} ${selectedClass} 시간표`);
  }

  function renderCompactTimetable(schedule, title) {
    const days = ['월', '화', '수', '목', '금'];
    
    let myHtml = `<table style="width:max-content; margin: 0 auto; border-collapse: collapse; text-align:center; box-shadow: 0 4px 6px rgba(0,0,0,0.05); background:#fff;">`;
    
    myHtml += `<tr>
                 <th style="background:#f1f5f9; padding:10px 15px; border:1px solid #cbd5e1; font-size:13px; white-space:nowrap;">교시</th>
                 <th style="background:#f1f5f9; padding:10px 15px; border:1px solid #cbd5e1; font-size:13px; white-space:nowrap;">월</th>
                 <th style="background:#f1f5f9; padding:10px 15px; border:1px solid #cbd5e1; font-size:13px; white-space:nowrap;">화</th>
                 <th style="background:#f1f5f9; padding:10px 15px; border:1px solid #cbd5e1; font-size:13px; white-space:nowrap;">수</th>
                 <th style="background:#f1f5f9; padding:10px 15px; border:1px solid #cbd5e1; font-size:13px; white-space:nowrap;">목</th>
                 <th style="background:#f1f5f9; padding:10px 15px; border:1px solid #cbd5e1; font-size:13px; white-space:nowrap;">금</th>
               </tr>`;

    for (let p = 1; p <= 8; p++) {
      let hasClassInPeriod = days.some(d => schedule[p] && schedule[p][d]);
      if (p === 8 && !hasClassInPeriod) continue; 

      myHtml += `<tr><td style="background:#f8fafc; font-weight:bold; border:1px solid #e2e8f0; padding:10px 15px; color:#64748b; font-size:12px; white-space:nowrap;">${p}</td>`;
      days.forEach(d => {
        let content = (schedule[p] && schedule[p][d]) ? schedule[p][d] : '';
        let bg = content ? '#eff6ff' : '#ffffff'; 
        
        myHtml += `<td style="background:${bg}; border:1px solid #e2e8f0; padding:10px 15px; line-height:1.4; vertical-align:middle; white-space:nowrap;">${content}</td>`;
      });
      myHtml += `</tr>`;
    }
    myHtml += `</table>`;

    document.getElementById('viewTimetable').innerHTML = myHtml;
    currentTimetableTitle = title;

    const modalBox = document.querySelector('#timetableMod .modal-content');
    if (modalBox) {
      modalBox.style.width = '910px';   
      modalBox.style.height = '910px';  
    }
    
    timetableZoom = 0.9;
    applyTimetableZoom();
  }

  function zoomTimetable(amount) {
    timetableZoom = Math.max(0.5, Math.min(2.0, timetableZoom + amount));
    applyTimetableZoom();
  }

  function resetZoomTimetable() {
    timetableZoom = 0.9;
    applyTimetableZoom();
  }

  function applyTimetableZoom() {
    const table = document.getElementById('viewTimetable');
    table.style.zoom = timetableZoom;
    document.getElementById('zoomLabel').innerText = Math.round(timetableZoom * 100) + '%';
  }
</script>
