<script>
  // [PERF] 개발용 계측: google.script.run 호출마다 "[요청 시작] → [서버 응답 완료]" 시간을 콘솔에 찍습니다.
  // 이 파일의 g가 전달 파일(Modals_*, Audi_System) 전체에서 공유되는 유일한 google.script.run 참조라서,
  // 이 한 곳만 감싸면 프로젝트의 모든 서버 호출(총 약 40여 곳)이 자동으로 계측됩니다 — 각 호출부는 손대지 않습니다.
  // 제거 방법: PERF_LOG를 false로 바꾸거나, 이 IIFE 블록을 지우고 `const g = google.script.run;`로 되돌리면 됩니다.
  // 기능 로직은 전혀 바뀌지 않습니다(성공/실패 핸들러를 감싸서 시간만 재고 원래 핸들러를 그대로 호출).
  const g = (() => {
    const PERF_LOG = true;
    if (!PERF_LOG || typeof performance === 'undefined') return google.script.run;
    function withTiming(runner, onSuccess, onFailure) {
      return new Proxy(runner, {
        get(target, prop) {
          if (prop === 'withSuccessHandler') return (fn) => withTiming(target, fn, onFailure);
          if (prop === 'withFailureHandler') return (fn) => withTiming(target, onSuccess, fn);
          const orig = target[prop];
          if (typeof orig !== 'function') return orig;
          return (...args) => {
            const label = prop, t0 = performance.now();
            const timed = target
              .withSuccessHandler((...r) => {
                console.log('[PERF] ' + label + ': ' + Math.round(performance.now() - t0) + 'ms');
                if (onSuccess) onSuccess(...r);
              })
              .withFailureHandler((...r) => {
                console.log('[PERF] ' + label + ': ' + Math.round(performance.now() - t0) + 'ms (실패)');
                if (onFailure) onFailure(...r);
              });
            return timed[prop](...args);
          };
        },
      });
    }
    return withTiming(google.script.run, null, null);
  })();
  let isDeleted = false;
  let isEdited = false;
  let currentDelType = 'data';
  let currentEditType = 'data';

  let wzCalDate = new Date();
  let wzStartD = '', wzEndD = '', wzClickCount = 0;

  // Modals_Resub.html과 Modals_TeacherLookup.html이 함께 읽고 쓰는 '교과'/'담임교사' 캐시입니다.
  // 원래 Modals_Resub.html에 선언돼 있었지만, 결보강을 지연 로딩(lazy)으로 바꾸면서 결보강을 한
  // 번도 열지 않은 채 교사 조회부터 여는 경우에도 안전하도록 항상 로드되는 이 파일로 옮겼습니다.
  let rsSubjectRoster = null; // '교과' 시트 원본
  let rsHomeroom = null;      // '담임교사' 시트 원본 (시트가 없으면 계속 null일 수 있어 아래 플래그로 로딩 여부를 따로 추적)
  let rsSupportDataLoaded = false;

  const el = {
    y: () => document.getElementById('ySel'),
    m: () => document.getElementById('mSel'),
    w: () => document.getElementById('wSel')
  };

  // 1. 초기 세팅 (페이지 로드 시 호출)
  window.onload = () => {
    initSelects();
    loadAll();
    loadMeals();
    initScrollTopBtn();
    initInstitutionBannerCarousel();
  };

  // 데스크톱은 배너가 4개를 넘을 때만 3초마다 자동 순환하고,
  // 모바일은 표시 개수와 관계없이 손가락으로 좌우 이동할 수 있습니다.
  function initInstitutionBannerCarousel() {
    const viewport = document.querySelector('.institution-banner-viewport');
    const track = viewport && viewport.querySelector('.institution-banner-grid');
    if (!viewport || !track) return;

    const originals = Array.from(track.children).filter(el => el.classList.contains('institution-banner'));
    if (originals.length < 2) return;

    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const mobileView = window.matchMedia('(max-width: 768px)');
    // 모바일은 배너 수와 관계없이 3초 자동 순환하며, 양 끝 복제본을 사용해 되감김 없이 이어집니다.
    // 데스크톱은 기존처럼 4개를 초과할 때만 자동 순환합니다.
    const singleCardLoop = mobileView.matches || originals.length <= 4;
    const autoRotate = mobileView.matches || (!reducedMotion && originals.length > 4);

    if (!singleCardLoop) {
      // 데스크톱의 네 칸이 끝까지 자연스럽게 이어지도록 첫 네 개를 복제합니다.
      originals.slice(0, 4).forEach(item => {
        const clone = item.cloneNode(true);
        clone.setAttribute('aria-hidden', 'true');
        clone.setAttribute('tabindex', '-1');
        track.appendChild(clone);
      });
    } else {
      // 4번→1번, 1번→4번 전환이 같은 방향으로 이어지도록 양 끝에 연결용 배너를 둡니다.
      const leadingClone = originals[originals.length - 1].cloneNode(true);
      const trailingClone = originals[0].cloneNode(true);
      [leadingClone, trailingClone].forEach(clone => {
        clone.setAttribute('aria-hidden', 'true');
        clone.setAttribute('tabindex', '-1');
      });
      track.prepend(leadingClone);
      track.appendChild(trailingClone);
    }

    let index = singleCardLoop ? 1 : 0;
    let timer = null;
    let pendingLoopIndex = null;
    const slide = animate => {
      const first = track.querySelector('.institution-banner');
      if (!first) return;
      const gap = parseFloat(getComputedStyle(track).gap) || 0;
      track.style.transition = animate ? '' : 'none';
      track.style.transform = `translateX(-${index * (first.getBoundingClientRect().width + gap)}px)`;
    };
    const advance = () => {
      if (singleCardLoop) {
        index += 1;
        slide(true);
        if (index === originals.length + 1) {
          pendingLoopIndex = 1;
        }
        return;
      }
      index += 1;
      slide(true);
      if (index === originals.length) {
        pendingLoopIndex = 0;
      }
    };
    const retreat = () => {
      if (singleCardLoop) {
        index -= 1;
        slide(true);
        if (index === 0) {
          pendingLoopIndex = originals.length;
        }
        return;
      }
      index = index > 0 ? index - 1 : originals.length - 1;
      slide(true);
    };
    // 마지막 복제본까지 같은 방향으로 이동한 뒤, 실제 CSS 전환이 완전히 끝난 순간에만
    // 눈에 보이지 않게 대응 원본 위치로 교정합니다. 고정 지연시간 사용 시 생기던 되감김을 없앱니다.
    track.addEventListener('transitionend', event => {
      if (event.target !== track || event.propertyName !== 'transform' || pendingLoopIndex === null) return;
      index = pendingLoopIndex;
      pendingLoopIndex = null;
      slide(false);
      track.getBoundingClientRect();
      track.style.transition = '';
    });
    const stop = () => {
      if (timer) window.clearInterval(timer);
      timer = null;
    };
    const start = () => {
      stop();
      if (autoRotate) timer = window.setInterval(advance, 3000);
    };

    let touchStartX = 0;
    let touchStartY = 0;
    let blockNextClick = false;
    viewport.addEventListener('touchstart', event => {
      if (!mobileView.matches || event.touches.length !== 1) return;
      touchStartX = event.touches[0].clientX;
      touchStartY = event.touches[0].clientY;
      stop();
    }, { passive: true });
    viewport.addEventListener('touchend', event => {
      if (!mobileView.matches || !touchStartX || event.changedTouches.length !== 1) return;
      const deltaX = event.changedTouches[0].clientX - touchStartX;
      const deltaY = event.changedTouches[0].clientY - touchStartY;
      touchStartX = 0;
      touchStartY = 0;
      if (Math.abs(deltaX) >= 40 && Math.abs(deltaX) > Math.abs(deltaY)) {
        blockNextClick = true;
        window.setTimeout(() => { blockNextClick = false; }, 450);
        deltaX < 0 ? advance() : retreat();
      }
      start();
    }, { passive: true });
    viewport.addEventListener('touchcancel', () => {
      touchStartX = 0;
      touchStartY = 0;
      start();
    }, { passive: true });
    viewport.addEventListener('click', event => {
      if (!blockNextClick) return;
      event.preventDefault();
      event.stopPropagation();
      blockNextClick = false;
    }, true);

    viewport.addEventListener('mouseenter', stop);
    viewport.addEventListener('mouseleave', start);
    viewport.addEventListener('focusin', stop);
    viewport.addEventListener('focusout', event => {
      if (!viewport.contains(event.relatedTarget)) start();
    });
    window.addEventListener('resize', () => {
      index = singleCardLoop ? 1 : 0;
      slide(false);
      requestAnimationFrame(() => { track.style.transition = ''; });
    });
    document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());
    slide(false);
    requestAnimationFrame(() => { track.style.transition = ''; });
    start();
  }

  // 맨 위로 가기(TOP) 버튼: 일정 높이 이상 스크롤을 내리면 나타나고, 누르면 맨 위로 부드럽게 올라갑니다.
  // (GAS는 내용이 iframe 안에서 스크롤되므로, 그 스크롤 위치를 기준으로 표시 여부를 정합니다.)
  function initScrollTopBtn() {
    const btn = document.getElementById('scrollTopBtn');
    if (!btn) return;
    const scrollY = () => window.pageYOffset || document.documentElement.scrollTop || document.body.scrollTop || 0;
    const onScroll = () => { btn.classList.toggle('show', scrollY() > 300); };
    window.addEventListener('scroll', onScroll, { passive: true });
    document.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
  }

  function scrollToTop() {
    try {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    } catch (e) {
      window.scrollTo(0, 0);
    }
    // 일부 환경에서 스크롤 주체가 문서 요소일 수 있어 함께 처리합니다.
    if (document.documentElement) document.documentElement.scrollTop = 0;
    if (document.body) document.body.scrollTop = 0;
  }

  // 오늘 급식(NEIS) 렌더링. 하루 한 끼만: 서버가 현재 시각 기준으로 정한 "지금 보여줄 한 끼"(cards[0])를 씁니다.
  //  - 13:00 이전: 오늘 점심 / 13:00~18:15: 오늘 저녁 / 18:15 이후: 다음 등교일 점심
  let mealCards = [];   // 현재 끼니부터 앞으로의 끼니 목록
  let mealIndex = 0;    // 지금 보고 있는 끼니 (0=현재, 지난 끼니로는 못 감)
  function loadMeals() {
    g.withSuccessHandler(cards => {
      mealCards = cards || [];
      mealIndex = 0;
      renderMealInline('mealNow', mealCards[0]);
      setupMealSwipeOnce();
    }).withFailureHandler(() => {
      mealCards = []; mealIndex = 0;
      renderMealInline('mealNow', null);
    }).getUpcomingMealCards(14);
  }
  function getActiveMealCards() {
    return mealCards;
  }
  // PC 화살표와 모바일 스와이프 모두 점심→저녁→다음날 점심→다음날 저녁 순서로 이동합니다.
  // 최초로 표시된 현재 끼니보다 과거로는 이동하지 않습니다.
  function mealPrev() {
    const cards = getActiveMealCards();
    if (mealIndex > 0) { mealIndex--; renderMealInline('mealNow', cards[mealIndex]); }
  }
  function mealNext() {
    const cards = getActiveMealCards();
    if (mealIndex < cards.length - 1) { mealIndex++; renderMealInline('mealNow', cards[mealIndex]); }
  }

  function renderMealInline(id, card) {
    const box = document.getElementById(id);
    if (!box) return;
    if (!card) { box.innerHTML = ''; return; }

    let body;
    if (card.status === 'ok' && card.items && card.items.length) {
      body = card.items.map(it => `<li>${it}</li>`).join('');
    } else if (card.status === 'holiday') {
      const nm = (card.holidayName && card.holidayName !== '공휴일')
        ? `공휴일 (${card.holidayName})` : '공휴일';
      body = `<li class="meal-holiday">${nm}</li>`;
    } else {
      body = ''; // 이유를 알 수 없으면 날짜만 표시하고 메뉴는 공란
    }
    const safeLabel = String(card.label).replace(/</g, '&lt;').replace(/>/g, '&gt;');
    const canPrev = mealIndex > 0;
    const activeCards = getActiveMealCards();
    const canNext = mealIndex < activeCards.length - 1;
    const prevArrow = `<span class="meal-nav-arrow${canPrev ? '' : ' disabled'}" role="button" tabindex="0" aria-label="이전 끼니" onclick="mealPrev()">◀</span>`;
    const nextArrow = `<span class="meal-nav-arrow${canNext ? '' : ' disabled'}" role="button" tabindex="0" aria-label="다음 끼니" onclick="mealNext()">▶</span>`;
    box.innerHTML =
      `<div class="meal-inline-wrap">` +
        `<div class="meal-inline-label">${prevArrow}<span class="meal-label-text">${safeLabel}</span>${nextArrow}</div>` +
        `<div class="meal-card-box">` +
          `<ul class="meal-inline-menu">${body}</ul>` +
        `</div>` +
      `</div>`;
  }

  // 모바일: 급식 카드를 옆으로 끌면(스와이프) 이전/다음 끼니로 바뀝니다. (#mealNow에 한 번만 등록)
  let _mealSwipeReady = false;
  function setupMealSwipeOnce() {
    if (_mealSwipeReady) return;
    const box = document.getElementById('mealNow');
    if (!box) return;
    _mealSwipeReady = true;
    let sx = 0, sy = 0;
    box.addEventListener('touchstart', e => { const t = e.touches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
    box.addEventListener('touchend', e => {
      const t = e.changedTouches[0];
      const dx = t.clientX - sx, dy = t.clientY - sy;
      if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) {
        if (dx < 0) mealNext(); else mealPrev();
      }
    }, { passive: true });
  }

  // 주말(토·일)은 다음 주를 준비하는 시기이므로, "이번 주"를 정할 때 토/일이면 다음 주 월요일로
  // 당겨서 계산합니다. (평일은 오늘 그대로) 예: 8/29(토) → 8/31(월)이 속한 9월 1주차를 이번 주로 봅니다.
  function effectiveToday() {
    const d = new Date();
    const day = d.getDay(); // 0=일, 6=토
    if (day === 6) d.setDate(d.getDate() + 2);
    else if (day === 0) d.setDate(d.getDate() + 1);
    d.setHours(0, 0, 0, 0);
    return d;
  }
  // effectiveToday가 속한 주(월~금)의 소속 달(수요일 기준) 연/월을 돌려줍니다.
  function effectiveOwningYM() {
    const d = effectiveToday();
    const day = d.getDay(); // 월~금(1~5)
    const monday = new Date(d.getFullYear(), d.getMonth(), d.getDate() - (day - 1));
    const wed = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + 2);
    return { y: wed.getFullYear(), m: wed.getMonth() + 1 };
  }

  function initSelects() {
    const ew = effectiveOwningYM();          // 주말이면 다음 주가 속한 달로 시작
    const y = ew.y, m = ew.m;
    const base = serverData.currentYear;
    let yH = '', mH = '';
    for(let i=base-2; i<=base+2; i++) yH += `<option value="${i}" ${i===y?'selected':''}>${i}년</option>`;
    for(let i=1; i<=12; i++) mH += `<option value="${i}" ${i===m?'selected':''}>${i}월</option>`;
    el.y().innerHTML = yH; el.m().innerHTML = mH;
    upWeeks();
  }

  // 한 주(월~금 5일) 중 수요일이 속한 달을 그 주의 '소속 달'로 봅니다.
  // (평일 5일 중 최소 3일이 그 달에 속하는 것과 항상 같은 결과이며, 5일이 홀수라 동률 없이 한쪽으로 정해집니다.)
  // 예: 6/29(월)~7/3(금) 주는 수요일이 7/1이라 "7월 1주차"가 되고, 6월 쪽 주차 목록에는 포함되지 않습니다.
  // 이 기준으로 해당 (year, month)에 속하는 주차들의 월요일 날짜를 순서대로 반환합니다.
  function getWeekMondaysForMonth(year, month) {
    year = Number(year);
    month = Number(month);
    const mondays = [];
    let probe = new Date(year, month - 1, 1);
    probe.setDate(probe.getDate() - 10); // 전달 마지막 주까지 여유 있게 앞에서부터 탐색
    for (let i = 0; i < 60; i++) {
      if (probe.getDay() === 1) {
        const wed = new Date(probe.getFullYear(), probe.getMonth(), probe.getDate() + 2);
        if (wed.getFullYear() === year && wed.getMonth() === month - 1) {
          mondays.push(new Date(probe.getFullYear(), probe.getMonth(), probe.getDate()));
        }
      }
      probe.setDate(probe.getDate() + 1);
    }
    return mondays;
  }

  // 등록 후에도 사용자가 보고 있던 연·월·주차·요일/주차 필터를 그대로 유지합니다.
  // 이전에는 새 일정 날짜로 화면을 이동했지만, 현재 보고 있는 "이번주 + 3주차" 같은
  // 화면 맥락이 저장 뒤에도 이어지도록 조회 상태만 보존한 채 다시 불러옵니다.
  function focusSavedScheduleRange() {
    _preserveViewOnLoad = true;
    hasAutoJumpedToThisWeek = true;
    loadAll();
  }

  function upWeeks() {
    const d = effectiveToday();
    const y = parseInt(el.y().value), m = parseInt(el.m().value);
    const mondays = getWeekMondaysForMonth(y, m);

    // 오늘 날짜가 몇 주차(월~금)에 속하는지 계산합니다.
    let currentWeekNum = 1;
    mondays.forEach((mon, idx) => {
      const fri = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + 4, 23, 59, 59, 999);
      if (d >= mon && d <= fri) currentWeekNum = idx + 1;
    });

    let html = '';
    mondays.forEach((mon, idx) => {
      const w = idx + 1;
      html += `<option value="${w}" ${w === currentWeekNum ? 'selected' : ''}>${w}주차</option>`;
    });
    el.w().innerHTML = html;
  }

  // 모바일 주차 네비: 'N월 N주차' 라벨 갱신 + 좌우 화살표로 주차 이동(달 경계는 이전/다음 달로 넘어감).
  function updateMobileWeekLabel() {
    const lab = document.getElementById('mobileWeekLabel');
    if (lab) lab.textContent = `${parseInt(el.m().value) || ''}월 ${parseInt(el.w().value) || 1}주차`;
  }
  function gotoMobileWeek(y, m, w) {
    el.y().value = String(y);
    el.m().value = String(m);
    upWeeks();               // 그 달의 주차 옵션 다시 채우고
    el.w().value = String(w); // 원하는 주차로 지정
    loadAll();
  }
  function mobileWeekNext() {
    let y = parseInt(el.y().value), m = parseInt(el.m().value), w = parseInt(el.w().value) || 1;
    const weeksInMonth = getWeekMondaysForMonth(y, m).length;
    if (w < weeksInMonth) { w += 1; }
    else { m += 1; if (m > 12) { m = 1; y += 1; } w = 1; }
    gotoMobileWeek(y, m, w);
  }
  function mobileWeekPrev() {
    let y = parseInt(el.y().value), m = parseInt(el.m().value), w = parseInt(el.w().value) || 1;
    if (w > 1) { w -= 1; }
    else { m -= 1; if (m < 1) { m = 12; y -= 1; } w = getWeekMondaysForMonth(y, m).length; }
    gotoMobileWeek(y, m, w);
  }

  // 2. 데이터 조회 및 가로 막대(Gantt) 시간표 렌더링
  // PC는 이제 "그 달 전체"(주차들을 세로로 이어붙인 달력)를 보여주고, 모바일은 기존처럼 한 주만 보여줍니다.
  let currentWeekSchedule = []; // (모바일용) 현재 주차 날짜 데이터 보관
  let currentWeekWorkList = []; // (모바일용) 현재 주차 업무 데이터 보관
  let currentWeekAnnualDetails = []; // (모바일용) 연간행사 세부(상세/전달사항/첨부/링크)
  let currentWeekSTime = 0;
  let _preserveViewOnLoad = false; // 자동 새로고침 시 현재 주차 필터를 유지할지 여부
  let _lastVisRefresh = 0;
  // 다른 기기/탭에서 수정한 내용이 반영되도록, 탭으로 돌아오면(다시 보이면) 최신으로 다시 조회합니다.
  // 단, 모달(등록/수정/팝업)이 열려 있으면 작업을 방해하지 않도록 새로고침하지 않습니다.
  function _isAnyModalOpen() {
    return Array.prototype.some.call(document.querySelectorAll('.modal'), m => {
      const disp = m.style.display;
      return disp && disp !== 'none';
    });
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible' || _isAnyModalOpen()) return;
    const now = Date.now();
    if (now - _lastVisRefresh < 4000) return; // 너무 잦은 재조회 방지
    _lastVisRefresh = now;
    _preserveViewOnLoad = true;
    if (typeof loadAll === 'function') loadAll();
  });
  let currentMonthWeeks = []; // (PC용) 이번 달에 속한 주차들의 데이터 배열 (앞뒤로 인접 주 1개씩 포함)
  let currentViewYear = null, currentViewMonth = null; // (PC용) 지금 보고 있는 달 — 전체 월 뷰에서 인접 주 제외용

  // 서버(Code.js)의 escapeHtml_와 동일하게 이스케이프합니다. 모바일 주간 화면(연간 행사 목록 등)이
  // 페이지 로딩 직후 자동으로 렌더링될 때도 바로 필요해서, 지연 로딩되는 Modals_Task.html이 아니라
  // 항상 먼저 로드되는 이 파일에 둡니다(원래 Modals_Task.html에 있었지만 이쪽으로 옮겼습니다).
  function escapeHtmlClient_(text) {
    return String(text)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  // 타임스탬프를 'yyyy-MM-dd'로 (연간행사 세부 저장용 날짜)
  function toIsoDate_(ts) {
    const dt = new Date(ts);
    const mm = String(dt.getMonth() + 1).padStart(2, '0');
    const dd = String(dt.getDate()).padStart(2, '0');
    return dt.getFullYear() + '-' + mm + '-' + dd;
  }

  // 한 주(월~금 5일 중 하루라도)가 지정한 연·월에 걸쳐 있는지 확인합니다.
  function weekHasDayInMonth_(week, y, m) {
    if (!y || !m) return true;
    // select 값은 문자열로 들어오므로 날짜의 숫자 연·월과 비교하기 전에 통일합니다.
    y = Number(y);
    m = Number(m);
    for (let i = 0; i < 5; i++) {
      const d = new Date(week.sTime + i * 86400000);
      if (d.getFullYear() === y && (d.getMonth() + 1) === m) return true;
    }
    return false;
  }
  let activeFilterIndices = [0, 1, 2, 3, 4]; // 화면에 그려지는 날짜 인덱스 (월~금 5일 고정)
  let currentGradeFilter = 'all'; // 학년 필터 ('all' | '1' | '2' | '3')
  let calendarItemDetails = []; // 화면에 그려진 항목(연간 행사/부서별 업무)의 세부 내용 (클릭 시 팝업용)
  let hasAutoJumpedToThisWeek = false; // PC 첫 조회 때만 "이번주+다음주"를 기본 선택하기 위한 1회성 플래그

  // 화면 폭 기준으로 지금이 모바일 레이아웃인지 판단합니다(CSS의 max-width:768px 기준과 동일).
  function isMobileLayout() {
    return window.matchMedia('(max-width: 768px)').matches;
  }

  // 모바일은 임의의 과거 주차를 조회하지 않고, 이번 주와 다음 주만 즉시 전환합니다.
  function getRelativeWeekSelection(offset) {
    const base = effectiveToday();
    const monday = new Date(base.getFullYear(), base.getMonth(), base.getDate() - (base.getDay() - 1) + Number(offset || 0) * 7);
    const wed = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + 2);
    const y = wed.getFullYear(), m = wed.getMonth() + 1;
    const mondays = getWeekMondaysForMonth(y, m);
    const targetTime = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate()).getTime();
    const w = Math.max(1, mondays.findIndex(day => day.getTime() === targetTime) + 1);
    return { y, m, w };
  }

  function mergeMobileWeekLists(first, second) {
    const map = new Map();
    [first, second].forEach(list => (list || []).forEach(dept => {
      if (!map.has(dept.name)) map.set(dept.name, { name: dept.name, items: [] });
      const target = map.get(dept.name).items;
      (dept.items || []).forEach(item => {
        // 두 주의 경계에 걸친 일정은 양쪽 주간 조회에 모두 포함됩니다.
        // 같은 원본 행(rowNum)은 한 번만 넣어 모바일 목록의 중복 표시를 막습니다.
        const duplicate = target.some(saved => item.rowNum && saved.rowNum
          ? Number(saved.rowNum) === Number(item.rowNum)
          : saved.st === item.st && saved.et === item.et && saved.text === item.text);
        if (!duplicate) target.push(item);
      });
    }));
    return Array.from(map.values());
  }

  function mergeMobileAnnualDetails(first, second) {
    const merged = [];
    (first || []).concat(second || []).forEach(item => {
      if (!merged.some(saved => item.rowNum && saved.rowNum
        ? Number(saved.rowNum) === Number(item.rowNum)
        : saved.name === item.name && saved.st === item.st && saved.et === item.et)) merged.push(item);
    });
    return merged;
  }

  // 지금 그려져 있는 화면(모바일=주간 / PC=월간)을 같은 날짜 필터(indices)로 다시 그립니다.
  function rerenderCurrent(indices) {
    if (isMobileLayout()) renderFilteredWeek(indices);
    else renderMonthView(indices);
  }

  function loadAll() {
    const y = el.y().value, m = el.m().value, w = el.w().value;
    updateMobileWeekLabel(); // 모바일 주차 네비 라벨을 현재 주차로 맞춥니다.
    toggleLoading(true, "조회 중...");

    // 자동 새로고침(탭 복귀 등)일 때는 지금 보고 있던 주차 필터/요일을 그대로 유지합니다.
    if (!_preserveViewOnLoad) {
      activeFilterIndices = [0, 1, 2, 3, 4];
      activeWeekFilter = null;
    }
    _preserveViewOnLoad = false;

    if (isMobileLayout()) {
      // 모바일: 위 주차 네비(N월 N주차)로 고른 '한 주'만 조회해서 보여줍니다.
      g.withSuccessHandler(res => {
        toggleLoading(false);
        currentWeekSchedule = res.schedule || [];
        currentWeekWorkList = res.list || [];
        currentWeekAnnualDetails = res.annualDetails || [];
        currentWeekSTime = res.sTime;
        document.getElementById('printTitle').innerText = `${y}년 ${m}월 ${w}주차 주간 계획서`;
        renderWeekRangeInfo(y);
        updateMonthYearHeading(y, m);
        renderFilteredWeek(activeFilterIndices);
      }).withFailureHandler(err => {
        toggleLoading(false);
        showAlert('데이터를 불러오는 중 오류가 발생했습니다.\n' + (err && err.message ? err.message : err));
      }).getCombinedData(y, m, w);
    } else {
      g.withSuccessHandler(res => {
        toggleLoading(false);
        currentMonthWeeks = res.weeks || [];
        currentViewYear = Number(y);
        currentViewMonth = Number(m);
        document.getElementById('printTitle').innerText = `${y}년 ${m}월 주간 계획서`;
        updateMonthYearHeading(y, m);

        // 맨 처음 페이지를 열었을 때만, 오늘이 포함된 "이번주+다음주"를 함께 보여줍니다.
        // (달을 옮기거나 다시 조회할 때는 그 달 전체를 보여주는 게 맞으므로, 최초 1회만 적용합니다.)
        if (!hasAutoJumpedToThisWeek) {
          hasAutoJumpedToThisWeek = true;
          const today = effectiveToday();
          const todayTime = today.getTime();
          const curWeek = currentMonthWeeks.find(wk => todayTime >= wk.sTime && todayTime <= wk.sTime + 4 * 86400000 + 86399999);
          if (curWeek) {
            // 첫 화면은 이번주와 다음주 2개를 함께 선택해 보여줍니다.
            const WEEK = 7 * 86400000;
            const wanted = [curWeek.sTime, curWeek.sTime + WEEK];
            const avail = currentMonthWeeks.map(w => w.sTime);
            activeWeekFilter = wanted.filter(t => avail.includes(t));
            if (activeWeekFilter.length === 0) activeWeekFilter = [curWeek.sTime];
          }
        }

        renderMonthView(activeFilterIndices);
      }).withFailureHandler(err => {
        toggleLoading(false);
        showAlert('데이터를 불러오는 중 오류가 발생했습니다.\n' + (err && err.message ? err.message : err));
      }).getMonthlyCombinedData(y, m);
    }
  }

  // 상단 큰 제목("◀ 2026년 8월 ▶", 한 줄)을 갱신합니다. 모바일에서는 CSS로 숨겨져 있어 실제로는 PC에서만 보입니다.
  function updateMonthYearHeading(y, m) {
    const elH = document.getElementById('monthYearHeading');
    if (!elH) return;
    elH.innerHTML =
      `<button class="cal-heading-nav" onclick="shiftMonth(-1)" aria-label="이전 달">◀</button>` +
      `<span><span class="cal-heading-year">${y}년</span>${m}월</span>` +
      `<button class="cal-heading-nav" onclick="shiftMonth(1)" aria-label="다음 달">▶</button>`;
  }

  // 년/월 select를 직접 바꿨을 때: PC에서는 바로 다시 조회하고, 모바일에서는 예전처럼 조회 버튼을 눌러야 합니다.
  function onYearMonthChange() {
    upWeeks();
    if (!isMobileLayout()) loadAll();
  }

  // 월 이동 화살표(◀ ▶) 클릭 시: 년/월 select를 옮기고 바로 다시 조회합니다.
  function shiftMonth(offset) {
    let y = parseInt(el.y().value), m = parseInt(el.m().value) + offset;
    if (m < 1) { m = 12; y -= 1; }
    else if (m > 12) { m = 1; y += 1; }
    // 연도 select에 없는 해(선택 가능 범위 밖)로는 넘어가지 않습니다.
    const hasYear = Array.from(el.y().options).some(o => Number(o.value) === y);
    if (!hasYear) return;
    el.y().value = y;
    el.m().value = m;
    upWeeks();
    loadAll();
  }

  // "N주차" 바로가기(전체/1학년/2학년/3학년 줄의 맨 왼쪽, PC 전용)를 그립니다.
  // 실제 소속 달(owningYear/owningMonth, 수요일 기준)별로 줄을 나눠, 각 줄 맨 앞에 "그 달로 가기" 버튼을
  // 두고 그 뒤에 그 달의 주차 버튼을 나열합니다. 오늘이 포함된 주는 "N주차" 대신 "이번주"로 표시합니다.
  // 아무 버튼도 누르지 않은 초기 화면은 항상 달(月) 전체가 그대로 보이는 달력 상태입니다.
  function renderWeekQuickNav() {
    const navEl = document.getElementById('weekQuickNav');
    if (!navEl) return;
    if (!currentMonthWeeks || currentMonthWeeks.length === 0) { navEl.innerHTML = ''; return; }

    const today = effectiveToday();
    const todayTime = today.getTime();

    // 소속 달(owningYear-owningMonth)별로 묶습니다. currentMonthWeeks가 이미 날짜순이라 그룹도 자연히 순서대로 생깁니다.
    // 기본적으로 현재 달과 겹치는 주만 버튼으로 표시하되, 첫 화면의 "이번주+다음주"처럼 실제 화면에
    // 선택되어 보이는 인접 주는 다음 달 소속이어도 버튼을 함께 표시합니다.
    const groups = [];
    const groupIndexByKey = {};
    currentMonthWeeks.filter(w =>
      weekHasDayInMonth_(w, currentViewYear, currentViewMonth) ||
      !!(activeWeekFilter && activeWeekFilter.includes(w.sTime))
    ).forEach(week => {
      const key = week.owningYear + '-' + week.owningMonth;
      if (!(key in groupIndexByKey)) {
        groupIndexByKey[key] = groups.length;
        groups.push({ year: week.owningYear, month: week.owningMonth, weeks: [] });
      }
      groups[groupIndexByKey[key]].weeks.push(week);
    });

    navEl.innerHTML = groups.map(group => {
      const monthBtn = `<button class="week-quick-btn week-quick-month-btn" onclick="jumpToMonth(${group.year}, ${group.month})">${group.month}월</button>`;
      const weekBtns = group.weeks.map(week => {
        const isThisWeek = todayTime >= week.sTime && todayTime <= week.sTime + 4 * 86400000 + 86399999;
        const label = isThisWeek ? '이번주' : `${week.weekNum}주차`;
        const isActive = !!(activeWeekFilter && activeWeekFilter.includes(week.sTime));
        return `<button type="button" aria-pressed="${isActive}" class="week-quick-btn${isThisWeek ? ' week-quick-btn-today' : ''}${isActive ? ' active' : ''}" onclick="toggleQuickWeek(${week.sTime})">${label}</button>`;
      }).join('');
      return `<div class="week-quick-row">${monthBtn}${weekBtns}</div>`;
    }).join('');
  }

  // "N주차"/"이번주" 버튼은 누를 때마다 기존 선택을 유지한 채 추가/해제합니다.
  // 선택이 하나도 남지 않으면 현재 달의 전체 주차를 다시 보여줍니다.
  function toggleQuickWeek(sTime) {
    const next = activeWeekFilter ? [...activeWeekFilter] : [];
    const pos = next.indexOf(sTime);
    if (pos >= 0) next.splice(pos, 1);
    else next.push(sTime);
    activeWeekFilter = next.length ? next.sort((a, b) => a - b) : null;
    renderMonthView(activeFilterIndices);
  }

  // "N월" 버튼 클릭 시: 지금 보고 있는 달이면 그 달 자체 주차들만(다른 달에 곁다리로 걸친 주는 제외) 확대해서
  // 보여주고, 다른 달이면 그 달의 달력으로 이동합니다.
  function jumpToMonth(y, m) {
    if (Number(el.y().value) === y && Number(el.m().value) === m) {
      // 그 달(y년 m월)의 날짜가 월~금 중 하루라도 포함된 주는 모두 보여줍니다.
      // (예: "8월"을 누르면 8/31이 든 9월 1주차(8/31~9/4)도 함께 나옵니다.)
      const weeksOfMonth = (currentMonthWeeks || []).filter(w => {
        for (let i = 0; i < 5; i++) {
          const d = new Date(w.sTime + i * 86400000);
          if (d.getFullYear() === y && (d.getMonth() + 1) === m) return true;
        }
        return false;
      });
      if (weeksOfMonth.length === 0) return;
      activeWeekFilter = weeksOfMonth.map(w => w.sTime);
      renderMonthView(activeFilterIndices);
    } else {
      el.y().value = y;
      el.m().value = m;
      upWeeks();
      loadAll();
    }
  }

  // 항목의 대상 학년(grades, 예: "1,2,3")이 현재 학년 필터에 해당하는지 확인합니다.
  // 대상 학년을 하나도 지정하지 않은 항목(학년 정보 없음)은 "전체" 필터에서만 보이고,
  // 1/2/3학년별 필터에서는 보이지 않습니다.
  function matchesGradeFilter(grades) {
    if (currentGradeFilter === 'all') return true;
    if (!grades) return false;
    return String(grades).split(',').map(s => s.trim()).includes(currentGradeFilter);
  }

  // 학년 필터 칩 클릭 시 호출됩니다. PC(제목 옆)와 모바일(검색창 안) 두 군데에 사본이 있으므로
  // data-grade로 두 군데 모두 활성 표시를 맞춰줍니다.
  function setGradeFilter(grade, btnEl) {
    currentGradeFilter = grade;
    document.querySelectorAll('.grade-filter-group .grade-chip').forEach(b => {
      b.classList.toggle('active', b.dataset.grade === grade);
    });
    rerenderCurrent(activeFilterIndices);
  }

  // 조회된 주차가 몇월 며칠부터 며칠까지인지(예: "2026년 8월 24일 ~ 8월 28일") #rangeInfo에 표시합니다.
  // currentWeekSchedule[i].date는 서버가 "8/24(월)" 형태로 내려주므로 그 중 월/일만 뽑아 씁니다.
  function renderWeekRangeInfo(year) {
    const el2 = document.getElementById('rangeInfo');
    if (!el2) return;
    if (!currentWeekSchedule || currentWeekSchedule.length === 0) { el2.innerText = ''; return; }

    const toMd = raw => {
      const m = String(raw || '').match(/^(\d+)\/(\d+)/);
      return m ? `${m[1]}월 ${m[2]}일` : raw;
    };
    const first = toMd(currentWeekSchedule[0].date);
    const last = toMd(currentWeekSchedule[currentWeekSchedule.length - 1].date);
    el2.innerText = `${year}년 ${first} ~ ${last}`;
  }

  // 부서명 포맷팅 헬퍼 함수
  function formatDeptName(name) {
    const map = {
      '교무기획부': '교무부', '교육과정부': '교육<br>과정부', '교육연구부': '교육<br>연구부',
      '학생안전부': '학생<br>안전부', '체육인성부': '체육<br>인성부', '융합과학정보부': '융합<br>과학<br>정보부',
      '방과후활동부': '방과후<br>활동부', '진로상담부': '진로<br>상담부', '보건실': '보건실',
      '1학년부': '1학년', '2학년부': '2학년', '3학년부': '3학년', '행정실': '행정실', '급식실': '급식실'
    };
    return map[name] || name;
  }

  // 모바일 목록에서 부서 이름 줄의 배경색(부서마다 다르게, 날짜/내용 줄과 확실히 구분되도록).
  const DEPT_COLORS = {
    '교무기획부': '#3b82f6', '교육과정부': '#8b5cf6', '교육연구부': '#06b6d4',
    '학생안전부': '#ef4444', '방과후활동부': '#f97316', '융합과학정보부': '#14b8a6',
    '체육인성부': '#22c55e', '진로상담부': '#d97706', '보건실': '#ec4899',
    '1학년부': '#0ea5e9', '2학년부': '#a855f7', '3학년부': '#64748b', '행정실': '#f5b026', '급식실': '#16a34a'
  };
  function deptHeaderColor(name) { return DEPT_COLORS[name] || '#1e3a8a'; } // 목록에 없는(직접 입력) 부서는 남색

  // 부서 업무 항목에서 '제목'만 뽑습니다: 선생님들이 보통 첫 줄에 제목을 쓰므로 첫 줄만 쓰고,
  // '[', ']' 기호만 지웁니다(안의 글자는 그대로 둡니다).
  function extractDeptTitle(text) {
    const firstLine = (text || '').split(/\r?\n/)[0] || '';
    return firstLine.replace(/[\[\]]/g, '').trim() || '(제목 없음)';
  }

  // 한 주(week: {schedule, list, sTime}) 분량의 "날짜 헤더 행 + 연간행사 행 + 부서별 업무 행"을 HTML로 만듭니다.
  // 모바일(한 주만 조회)과 PC(달 전체 = 이 함수를 주차 수만큼 반복 호출) 양쪽에서 공용으로 씁니다.
  // registerDetail은 calendarItemDetails에 항목을 등록해 클릭 팝업과 연결하는 함수를 그대로 전달받습니다.
  // isCurrentWeek이 true면(오늘이 이 주에 포함되면), 그 주 전체를 감싸는 강조 테두리를 두릅니다.
  // cornerHtml을 넘기면 맨 왼쪽 위 칸("구분")에 그 내용을 대신 넣습니다(PC 월간 달력의 "N주차" 클릭용).
  function renderWeekBlockHtml(week, indices, fsStyle, deptCellStyle, registerDetail, showDateHeader, isCurrentWeek, cornerHtml) {
    const rows = []; // <tr>...</tr> 문자열을 순서대로 모아 두었다가, 맨 끝에 첫/마지막 행 표시를 붙입니다.

    if (showDateHeader) {
      // 오늘 날짜 칸에는 날짜 뒤에 파란 굵은 글씨로 ' 오늘'을 붙입니다.
      const _tMid = new Date(); _tMid.setHours(0, 0, 0, 0);
      const todayMidTime = _tMid.getTime();
      let headerRow = `<tr style="${fsStyle}">
        <th style="${deptCellStyle} background:#fdfdfd; border-bottom:1px solid #cbd5e1;">
          ${cornerHtml || '구분'}
        </th>`;
      indices.forEach(idx => {
        const isToday = (week.sTime + idx * 86400000) === todayMidTime;
        // '오늘'을 날짜 위에 한 줄로(2줄) 올립니다. 글자가 날짜보다 짧아 칸 폭은 그대로라, 아래 일정 세로선과 어긋나지 않습니다.
        const dateCell = isToday
          ? `<span style="display:inline-block; line-height:1.25;"><span style="display:block; color:#2563eb; font-weight:800;">오늘</span>${week.schedule[idx].date}</span>`
          : week.schedule[idx].date;
        headerRow += `<th style="${fsStyle} border-bottom:1px solid #cbd5e1; padding:6px;">${dateCell}</th>`;
      });
      headerRow += `</tr>`;
      rows.push(headerRow);
    }

    // 연간 행사(학사일정표, 부서명 없음)를 "같은 행사가 연속된 날짜"별로 하나로 묶어, 부서 업무 항목과
    // 똑같은 형태(st/et를 가진 가상 항목)로 만듭니다. 이렇게 하면 renderCalendarRow가 부서 업무와
    // 동일한 방식으로 날짜 칸을 이어붙인 막대 하나로 그려줍니다(주 안에서 이어지면 이어진 채로 표시).
    const eventOrder = [];
    const eventDayIdx = {};
    week.schedule.forEach((it, dayIdx) => {
      const content = (it.content || '').trim();
      if (!content) return;
      content.split(/\r?\n/).map(s => s.trim()).filter(Boolean).forEach(ev => {
        if (!(ev in eventDayIdx)) { eventDayIdx[ev] = []; eventOrder.push(ev); }
        eventDayIdx[ev].push(dayIdx);
      });
    });
    const eventItems = [];
    eventOrder.forEach(ev => {
      const idxs = eventDayIdx[ev]; // 오름차순
      let runStart = idxs[0], prev = idxs[0];
      for (let k = 1; k <= idxs.length; k++) {
        const cur = idxs[k];
        if (cur === prev + 1) { prev = cur; continue; }
        const dateLabel = (runStart === prev)
          ? week.schedule[runStart].date
          : `${week.schedule[runStart].date} ~ ${week.schedule[prev].date}`;
        eventItems.push({ st: week.sTime + runStart * 86400000, et: week.sTime + prev * 86400000, text: ev, dateLabel });
        runStart = cur; prev = cur;
      }
    });

    // item(st/et)이 이 주에서 화면에 표시된 날짜(indices) 중 어디에 걸치는지 칸 위치로 바꿔줍니다.
    function mapItemToIndices(item) {
      const globalStartIdx = Math.max(0, Math.round((item.st - week.sTime) / 86400000));
      const globalEndIdx = Math.min(4, Math.round((item.et - week.sTime) / 86400000));
      let mapped = [];
      for (let i = globalStartIdx; i <= globalEndIdx; i++) {
        let pos = indices.indexOf(i);
        if (pos !== -1) mapped.push(pos);
      }
      return mapped;
    }

    // 행사 한 줄 / 부서 한 줄을 그리는 공용 함수. 날짜 범위가 이어지는 항목은 칸을 합쳐 색이 이어진
    // 막대 하나로, 제목만 표시합니다. 막대를 누르면 팝업으로 작성된 내용 전체를 볼 수 있습니다.
    function renderCalendarRow(label, popupLabel, items, isEventRow) {
      let rowHtml = `<tr style="page-break-inside: avoid; break-inside: avoid; border-bottom:1px solid #e2e8f0;"${isEventRow ? ' class="cal-event-tr"' : ''}>
        <td class="dept-name-cell" style="${deptCellStyle}${isEventRow ? ' border-right:none;' : ''}">${label}</td>
        <td colspan="${indices.length}" style="padding:0; vertical-align:middle; border:none;">`;
      // 부서명이 2줄로 줄바꿈되어 행이 항목 막대보다 높아질 때, 막대가 위에 붙지 않고 세로 가운데로 오도록 합니다.
      // (표 셀 안에서는 height:100%가 잘 안 먹으므로, td를 vertical-align:middle로 두고 이 div는 내용 높이로 둡니다.)
      // 항목은 "정해진 순서대로" 왼쪽에서 오른쪽으로 흐르다가, 날짜 칸이 겹치면 다음 줄로 넘어갑니다.
      // (dense 채우기를 쓰지 않습니다. dense는 뒤 항목이라도 윗줄 빈칸이 있으면 위로 끌어올려 버려서,
      //  사용자가 끌어서 정한 순서·자리가 무시되기 때문입니다. 이제 순서가 곧 화면 배치가 됩니다.)
      rowHtml += `<div style="display:grid; grid-template-columns: repeat(${indices.length}, minmax(0, 1fr)); grid-auto-flow:row; gap:6px; padding:10px; box-sizing:border-box;">`;

      items.forEach(item => {
        const mappedIndices = mapItemToIndices(item);
        if (mappedIndices.length > 0) {
          const gridStart = Math.min(...mappedIndices) + 1;
          const span = Math.max(...mappedIndices) - Math.min(...mappedIndices) + 1;
          const title = isEventRow ? item.text : extractDeptTitle(item.text);
          // 이 일정이 '이 주에서 실제로 시작/끝나는지' 확인합니다.
          //  - 시작 주가 아니면(전 주에서 이어져옴) 왼쪽 진한 캡을 없앱니다(예: 9/1~9/7 일정의 9/7 왼쪽).
          //  - 끝나는 주에만 오른쪽 끝에 진한 캡을 넣어 "여기까지 일정"임을 표시합니다(9/4 같은 가짜 끝엔 없음).
          const rawStartIdx = Math.round((item.st - week.sTime) / 86400000);
          const rawEndIdx = Math.round((item.et - week.sTime) / 86400000);
          const startsHere = rawStartIdx >= 0;
          const endsHere = rawEndIdx <= 4;
          const barClass = 'event-bar'
            + (isEventRow ? ' cal-event-bar' : '')
            + (!isEventRow && popupLabel === '행정실' ? ' dept-haengjeong' : '')
            + (!isEventRow && popupLabel === '급식실' ? ' dept-gupsik' : '')
            + (!isEventRow && popupLabel && !DEPT_COLORS[popupLabel] ? ' dept-custom' : '')
            + (startsHere ? '' : ' bar-open-start')
            + (endsHere ? ' bar-cap-end' : '');
          // 이 항목이 실제로 속한 주(연/월/주차, 수요일 기준)를 함께 저장해, 월경계 주(예: 8/31~9/4=9월1주차)의
          // 항목도 현재 달력의 월이 아니라 '항목이 속한 주'로 정확히 조회(수정/삭제)되게 합니다.
          const weekCtx = (week && week.owningYear && week.owningMonth)
            ? { y: week.owningYear, m: week.owningMonth, w: week.weekNum } : null;
          // 연간행사(isEventRow)면 학사일정표 명칭에 붙는 세부(Data의 예약부서 행)를 이름+날짜로 매칭해 연결합니다.
          let dText = item.text, dAttach = item.attachments || [], dLinks = item.links || [], dRow = item.rowNum || null, annual = null;
          if (isEventRow) {
            const matched = (week.annualDetails || []).find(a => a.name === item.text && a.st <= item.et && a.et >= item.st);
            annual = { name: item.text, startIso: toIsoDate_(item.st), endIso: toIsoDate_(item.et), rawText: matched ? (matched.rawText || '') : '' };
            dText = matched ? matched.text : '';
            dAttach = matched ? (matched.attachments || []) : [];
            dLinks = matched ? (matched.links || []) : [];
            dRow = matched ? matched.rowNum : null;
          }
          const detailIdx = registerDetail(
            popupLabel, item.dateLabel || item.date || '', dText, weekCtx,
            dAttach, dRow, dLinks, annual
          );

          // 부서 업무 항목(연간행사 제외)에는 순서 바꾸기(꾹 눌러 끌기)용 식별 속성을 붙입니다.
          // 같은 부서(data-dept) + 같은 시작일(data-start)인 항목끼리만 서로 맞바꿀 수 있습니다.
          const reorderAttrs = (!isEventRow && item.rowNum)
            ? ` data-rownum="${item.rowNum}" data-dept="${escapeHtmlClient_(popupLabel || '')}" data-start="${item.st}"`
            : '';
          rowHtml += `<div class="${barClass}" style="grid-column: ${gridStart} / span ${span}; ${fsStyle}" role="button" tabindex="0"${reorderAttrs} onclick="if(!itemReorderSuppressClick_())showItemDetail(${detailIdx})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();showItemDetail(${detailIdx});}">${title}</div>`;
        }
      });
      rowHtml += `</div></td></tr>`;
      return rowHtml;
    }

    const visibleDepts = week.list
      .map(dept => ({ name: dept.name, items: dept.items.filter(item => matchesGradeFilter(item.grades)) }))
      .filter(dept => dept.items.length > 0);

    // 맨 왼쪽 "구분" 칸의 "연간 행사" 글자는 없애고 빈칸으로 둡니다(주황색 배경/줄만 유지).
    // 클릭했을 때 뜨는 팝업 제목에는 구분을 위해 "연간 행사"를 그대로 씁니다.
    if (eventItems.length > 0) rows.push(renderCalendarRow('', '연간 행사', eventItems, true));
    visibleDepts.forEach(dept => { rows.push(renderCalendarRow(formatDeptName(dept.name), dept.name, dept.items, false)); });

    // 모든 주를 하나의 카드처럼 묶고, 오늘이 포함된 주에만 주황색 강조 테두리를 추가합니다.
    // 각 <tr>에 첫 행/중간 행/마지막 행 클래스를 붙여 표 구조를 유지하면서도 주차별 외곽선을 만듭니다.
    const finalRows = rows.map((rowHtml, i) => {
      let cls = 'cal-week-card';
      if (i === 0) cls += ' cal-week-card-start';
      if (i === rows.length - 1) cls += ' cal-week-card-end';
      if (isCurrentWeek) {
        cls += ' cal-current-week';
        if (i === 0) cls += ' cal-current-week-start';
        if (i === rows.length - 1) cls += ' cal-current-week-end';
      }
      return rowHtml.replace(/^<tr style="([^"]*)"( class="([^"]*)")?/,
        (m, styleVal, _g2, existingClass) => `<tr style="${styleVal}" class="${existingClass ? existingClass + ' ' : ''}${cls}"`);
    });

    return { html: finalRows.join(''), visibleDepts };
  }

  // 선택된 날짜 인덱스(예: [0, 2, 4] -> 월, 수, 금)만 화면에 그려주는 (모바일용) 한 주 렌더러
  function renderFilteredWeek(indices) {
    // 최초 조회가 아직 끝나기 전(currentWeekSchedule이 비어있을 때) 학년 필터 등을 눌러도
    // 존재하지 않는 데이터에 접근해 에러가 나지 않도록 조용히 무시합니다.
    if (!currentWeekSchedule || currentWeekSchedule.length === 0) return;
    if (!indices || indices.length === 0) indices = [0, 1, 2, 3, 4];

    // 날짜 개수에 따른 폰트 스케일 계산 (5일: 1.0배, 4일: 1.07배, 3일: 1.14배, 2일: 1.21배, 1일: 1.28배)
    const fontScale = 1.0 + (5 - indices.length) * 0.07;
    const fsStyle = `font-size: ${fontScale}em;`;
    const deptWidth = Math.round(80 * fontScale);
    const deptCellStyle = `width:${deptWidth}px; min-width:${deptWidth}px; box-sizing:border-box; padding:8px 4px; text-align:center; vertical-align:middle; border-right:1px solid #cbd5e1; ${fsStyle}`;

    calendarItemDetails = [];
    function registerDetail(label, dateLabel, text, weekCtx, attachments, rowNum, links, annual) {
      calendarItemDetails.push({
        label, dateLabel, text, weekCtx: weekCtx || null,
        attachments: attachments || [], links: links || [], rowNum: rowNum || null,
        annual: annual || null
      });
      return calendarItemDetails.length - 1;
    }

    const week = { schedule: currentWeekSchedule, list: currentWeekWorkList, sTime: currentWeekSTime };
    const { html: bodyHtml, visibleDepts } = renderWeekBlockHtml(week, indices, fsStyle, deptCellStyle, registerDetail, true);

    document.getElementById('workHead').innerHTML = ''; // 날짜 헤더는 이제 본문 첫 행에 포함됩니다.
    document.getElementById('workBody').innerHTML = bodyHtml
      || `<tr style="${fsStyle}"><td colspan="${indices.length + 1}" style="padding:40px; color:#999; text-align:center; ${fsStyle}">데이터 없음</td></tr>`;
    fitEventBarText(); // 칸 폭에 비해 일정명이 길어 잘리면, 잘리지 않을 때까지 글자를 조금씩 줄입니다.

    // 모바일 전용 목록형 렌더링(PC에서는 CSS로 숨김).
    // 선택한 주차는 날짜가 지났더라도 월~금 전체 일정을 그대로 보여줍니다.

    // 위: 연간 행사 — 같은 행사가 연속된 날짜를 하나로 묶어 '일정별'로 나열하고, 누르면 세부(있으면)를 팝업으로 봅니다.
    const dateMobileEl = document.getElementById('dateMobileList');
    if (dateMobileEl) {
      // (1) 연속 날짜 묶어 이벤트로 만듭니다(PC 달력과 같은 방식).
      const eventOrder = [], eventDayIdx = {};
      currentWeekSchedule.forEach((it, dayIdx) => {
        const content = (it.content || '').trim();
        if (!content) return;
        content.split(/\r?\n/).map(s => s.trim()).filter(Boolean).forEach(ev => {
          if (!(ev in eventDayIdx)) { eventDayIdx[ev] = []; eventOrder.push(ev); }
          eventDayIdx[ev].push(dayIdx);
        });
      });
      const annualEvents = [];
      eventOrder.forEach(ev => {
        const idxs = eventDayIdx[ev];
        let runStart = idxs[0], prev = idxs[0];
        for (let k = 1; k <= idxs.length; k++) {
          const cur = idxs[k];
          if (cur === prev + 1) { prev = cur; continue; }
          const dateLabel = (runStart === prev)
            ? currentWeekSchedule[runStart].date
            : `${currentWeekSchedule[runStart].date} ~ ${currentWeekSchedule[prev].date}`;
          annualEvents.push({ st: currentWeekSTime + runStart * 86400000, et: currentWeekSTime + prev * 86400000, text: ev, dateLabel });
          runStart = cur; prev = cur;
        }
      });
      // (2) 선택한 주차의 모든 이벤트를 클릭 가능한 줄로 표시합니다(세부는 명칭·날짜로 매칭).
      const annualRowsHtml = annualEvents
        .map(evt => {
          const matched = (currentWeekAnnualDetails || []).find(a => a.name === evt.text && a.st <= evt.et && a.et >= evt.st);
          const annual = { name: evt.text, startIso: toIsoDate_(evt.st), endIso: toIsoDate_(evt.et), rawText: matched ? (matched.rawText || '') : '' };
          const detailIdx = registerDetail('연간 행사', evt.dateLabel, matched ? matched.text : '', null,
            matched ? (matched.attachments || []) : [], matched ? matched.rowNum : null, matched ? (matched.links || []) : [], annual);
          return `<div class="mobile-list-row cal-clickable" role="button" tabindex="0" onclick="showItemDetail(${detailIdx})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();showItemDetail(${detailIdx});}">
            <div class="mobile-list-date">${evt.dateLabel}</div>
            <div class="mobile-list-content">${escapeHtmlClient_(evt.text)}</div>
          </div>`;
        }).join('');
      dateMobileEl.innerHTML = `<div class="mobile-list-annual-label">연간 행사</div>`
        + (annualRowsHtml
          || `<div class="mobile-list-row"><div class="mobile-list-content mobile-list-empty">연간 행사가 없습니다.</div></div>`);
    }

    // 아래: 부서별 업무 — 부서마다(지정된 순서로) 그 주의 업무 제목만 세로로 나열합니다. 항목을 누르면
    // 팝업으로 작성된 내용 전체를 볼 수 있습니다.
    const workMobileEl = document.getElementById('workMobileList');
    if (workMobileEl) {
      // 선택한 주차의 지난 날짜를 포함해 부서 업무를 모두 표시합니다.
      const deptBlocks = (visibleDepts || []).map(dept => {
        const rows = dept.items.map(item => {
          const detailIdx = registerDetail(dept.name, item.date || '', item.text, null, item.attachments || [], item.rowNum || null, item.links || []);
          const reorderAttrs = item.rowNum
            ? ` data-rownum="${item.rowNum}" data-dept="${escapeHtmlClient_(dept.name || '')}" data-start="${item.st}"`
            : '';
          return `<div class="mobile-list-row cal-clickable" role="button" tabindex="0"${reorderAttrs} onclick="if(!itemReorderSuppressClick_())showItemDetail(${detailIdx})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();showItemDetail(${detailIdx});}">
            <div class="mobile-list-date">${item.date}</div>
            <div class="mobile-list-content">${extractDeptTitle(item.text)}</div>
          </div>`;
        }).join('');
        return `<div class="mobile-list-dept-header" style="background:${deptHeaderColor(dept.name)};">${dept.name}</div>${rows}`;
      }).filter(Boolean).join('');
      workMobileEl.innerHTML = deptBlocks
        || `<div class="mobile-list-row"><div class="mobile-list-content mobile-list-empty">일정이 없습니다.</div></div>`;
    }
  }

  // (PC용) "N주차"를 선택확대/원래대로 하기 위한 상태. 이전의 날짜 단위 선택확대와 같은 방식이며,
  // 단위만 날짜에서 주차로 바뀐 것입니다. 주차 선택은 week.sTime(그 주 월요일 시각, 고유값)으로 구분합니다
  // — weekNum만으로는 "8월 달력에 곁다리로 보이는 9월 1주차"처럼 다른 달의 같은 번호와 겹칠 수 있어서입니다.
  let activeWeekFilter = null; // null이면 이번 달의 모든 주차, 배열(sTime)이면 그 주차들만 표시

  // (PC용) 이번 달에 속한 주차들을 세로로 이어붙여 "월간 달력"처럼 그리는 렌더러.
  function renderMonthView(indices) {
    if (!currentMonthWeeks || currentMonthWeeks.length === 0) return;
    if (!indices || indices.length === 0) indices = [0, 1, 2, 3, 4];

    const fontScale = 1.0 + (5 - indices.length) * 0.07;
    const fsStyle = `font-size: ${fontScale}em;`;
    const deptWidth = Math.round(80 * fontScale);
    const deptCellStyle = `width:${deptWidth}px; min-width:${deptWidth}px; box-sizing:border-box; padding:8px 4px; text-align:center; vertical-align:middle; border-right:1px solid #cbd5e1; ${fsStyle}`;

    calendarItemDetails = [];
    function registerDetail(label, dateLabel, text, weekCtx, attachments, rowNum, links, annual) {
      calendarItemDetails.push({
        label, dateLabel, text, weekCtx: weekCtx || null,
        attachments: attachments || [], links: links || [], rowNum: rowNum || null,
        annual: annual || null
      });
      return calendarItemDetails.length - 1;
    }

    // 오늘(주말이면 다음 주)이 포함된 주를 찾아 강조 테두리를 표시합니다.
    const now = effectiveToday();
    const todayTime = now.getTime();

    // 3주 등 필터가 있으면 그 주들만, 전체 월 뷰에서는 그 달에 실제로 걸친 주들만(앞뒤 인접 주는 제외) 보여줍니다.
    const weeksToShow = activeWeekFilter
      ? currentMonthWeeks.filter(w => activeWeekFilter.includes(w.sTime))
      : currentMonthWeeks.filter(w => weekHasDayInMonth_(w, currentViewYear, currentViewMonth));

    let bodyHtml = '';
    weeksToShow.forEach((week, wIdx) => {
      const isCurrentWeek = todayTime >= week.sTime && todayTime <= week.sTime + 4 * 86400000 + 86399999;
      // 이 주가 실제로 소속된 달/주차(수요일 기준)를 두 줄로 보여줍니다. 지금 보고 있는 달과 다를 수 있습니다
      // (예: 8월 달력 맨 끝의 8/31~9/4 주는 "9월 1주차"로 표시됩니다).
      const cornerHtml = `<div style="padding:6px; display:inline-block; line-height:1.3;">${week.owningMonth}월<br>${week.weekNum}주차</div>`;

      const { html } = renderWeekBlockHtml(week, indices, fsStyle, deptCellStyle, registerDetail, true, isCurrentWeek, cornerHtml);
      bodyHtml += html;
      // 주차와 주차 사이를 살짝 띄워 구분합니다(마지막 주는 제외).
      if (wIdx < weeksToShow.length - 1) {
        bodyHtml += `<tr class="cal-week-gap" aria-hidden="true"><td colspan="${indices.length + 1}"></td></tr>`;
      }
    });

    document.getElementById('workHead').innerHTML = '';
    document.getElementById('workBody').innerHTML = bodyHtml
      || `<tr style="${fsStyle}"><td colspan="${indices.length + 1}" style="padding:40px; color:#999; text-align:center; ${fsStyle}">데이터 없음</td></tr>`;
    fitEventBarText();
    renderWeekQuickNav();
  }

  // ===== 부서 업무 항목 순서 바꾸기: 항목을 꾹 눌러 다른 항목 위로 끌어다 놓으면 서로 자리를
  // 맞바꿉니다. PC 격자(.event-bar)와 모바일 목록(.mobile-list-row) 양쪽에 공통으로 적용되며,
  // data-rownum/data-dept/data-start(렌더 시점에 심어둠)로 "같은 날짜·같은 부서" 항목만 서로
  // 맞바꿀 수 있게 제한합니다. 내용은 매번 innerHTML로 통째로 새로 그려지므로, 이 리스너들은
  // document에 한 번만 등록해(위임) 다시 그려질 때마다 새로 붙일 필요가 없게 합니다.
  // 마우스(PC)와 손가락(모바일)은 기대하는 조작이 서로 다릅니다.
  //  - 마우스: 누른 채 끌면 바로 순서 바꾸기(데스크톱에서 익숙한 방식). 마우스로는 끌어서 스크롤할
  //    일이 없으므로 "꾹 누르기"를 강요하지 않습니다.
  //  - 손가락: 그냥 끌면 화면 스크롤이어야 하므로, 꾹 누르고 있을 때만 순서 바꾸기로 전환합니다.
  const ITEM_REORDER_HOLD_MS = 400; // (터치) 이 시간 이상 누르고 있어야 "끌기 시작"으로 간주합니다.
  const ITEM_REORDER_MOVE_CANCEL_PX = 10; // (터치) 꾹 누르기 전에 이만큼 움직이면 스크롤로 보고 취소합니다.
  const ITEM_REORDER_MOUSE_DRAG_PX = 4; // (마우스) 누른 채 이만큼 움직이면 바로 끌기 시작으로 봅니다.
  let itemReorderState_ = null;
  let itemReorderClickGuard_ = false; // 꾹 눌렀다 뗀 직후의 click 한 번만 무시(상세 팝업이 뜨지 않도록)

  function itemReorderSuppressClick_() {
    if (itemReorderClickGuard_) { itemReorderClickGuard_ = false; return true; }
    return false;
  }
  // 끌기가 끝난 뒤 브라우저가 만들어내는 click은 항목이 아니라 두 항목의 공통 부모(격자 div)에서
  // 발생할 수도 있어, 그 경우 위 가드가 소비되지 않고 남아 "다음 클릭 한 번"을 잡아먹습니다.
  // 그래서 가드는 짧은 시간 뒤 자동으로 풀고, 새 입력이 시작될 때도 반드시 초기화합니다.
  function setItemReorderClickGuard_() {
    itemReorderClickGuard_ = true;
    setTimeout(() => { itemReorderClickGuard_ = false; }, 400);
  }
  function findReorderItemEl_(node) {
    return node && node.closest ? node.closest('[data-rownum][data-dept][data-start]') : null;
  }
  function clearReorderVisuals_() {
    document.querySelectorAll('.item-reorder-armed').forEach(el => el.classList.remove('item-reorder-armed'));
    document.querySelectorAll('.item-reorder-target').forEach(el => el.classList.remove('item-reorder-target'));
    document.querySelectorAll('.item-reorder-slot').forEach(el => el.remove());
  }

  // PC 격자에서 한 부서 줄의 현재 배치를 읽습니다. 각 항목이 "몇 번째 줄(line)의 어느 날짜 칸
  // (col~col+span)"에 있는지 알아야, 잡은 항목이 들어갈 수 있는 빈 자리를 정확히 계산할 수 있습니다.
  function readReorderLayout_(st) {
    const info = st.siblings.map(el => {
      const m = (el.style.gridColumn || '').match(/^(\d+)\s*\/\s*span\s*(\d+)/);
      const r = el.getBoundingClientRect();
      return { el, col: m ? Number(m[1]) : 0, span: m ? Number(m[2]) : 1, top: Math.round(r.top), rect: r };
    });
    if (info.some(i => !i.col)) return null; // 격자가 아님(모바일 목록) → 슬롯 방식 미사용
    const lines = Array.from(new Set(info.map(i => i.top))).sort((a, b) => a - b);
    info.forEach(i => { i.line = lines.indexOf(i.top); });
    return { info, lines };
  }
  // 화면이 항목을 배치하는 방식(CSS 격자의 순서대로 흐르는 배치)을 그대로 흉내 냅니다.
  // 순서대로 훑으면서, 날짜 칸이 앞 항목보다 왼쪽이면 다음 줄로 내려가고, 그 줄에서 내 칸이
  // 이미 차 있으면 빈 줄을 찾을 때까지 더 내려갑니다. 이 결과가 실제 화면과 똑같습니다.
  function simulateItemFlow_(items) {
    const occupied = [];
    const lineOf = [];
    let curLine = 0, curCol = 1;
    items.forEach((it, idx) => {
      if (it.col < curCol) curLine++;
      curCol = it.col;
      const taken = (line, col, span) => {
        const row = occupied[line];
        if (!row) return false;
        for (let c = col; c < col + span; c++) if (row[c]) return true;
        return false;
      };
      while (taken(curLine, it.col, it.span)) curLine++;
      if (!occupied[curLine]) occupied[curLine] = {};
      for (let c = it.col; c < it.col + it.span; c++) occupied[curLine][c] = true;
      lineOf[idx] = curLine;
      curCol = it.col + it.span;
    });
    return lineOf;
  }

  // 잡은 항목이 "실제로 갈 수 있는 자리"만 점선 네모로 보여줍니다.
  // 날짜(가로 칸)는 절대 바뀌지 않고 줄(세로)만 달라지므로, 순서를 바꿔 끼워 넣어 본 결과를
  // 위 배치 규칙으로 직접 시뮬레이션해서 "정말 그 줄에 놓이는" 경우만 후보로 남깁니다.
  // (그래서 배치가 불가능한 헛 자리는 아예 표시되지 않습니다.)
  function buildReorderSlots_(st) {
    const layout = readReorderLayout_(st);
    if (!layout) return null;
    const self = layout.info.find(i => i.el === st.el);
    if (!self) return null;
    const others = layout.info.filter(i => i.el !== st.el);
    const rowH = self.rect.height;
    const gap = layout.lines.length > 1 ? (layout.lines[1] - layout.lines[0] - rowH) : 6;

    const best = {}; // 결과 줄 -> { order, 흐트러짐 점수 }
    for (let pos = 0; pos <= others.length; pos++) {
      const order = others.slice(0, pos).concat([self]).concat(others.slice(pos));
      const lines = simulateItemFlow_(order);
      const myLine = lines[pos];
      // 다른 항목들이 원래 줄에서 얼마나 밀려났는지 — 적게 흔드는 배치를 고릅니다.
      let disturb = 0;
      order.forEach((it, idx) => { if (it !== self && lines[idx] !== it.line) disturb++; });
      if (!best[myLine] || disturb < best[myLine].disturb) best[myLine] = { order, disturb };
    }

    const slots = [];
    Object.keys(best).map(Number).sort((a, b) => a - b).forEach(line => {
      if (line === self.line) return; // 지금 있는 자리는 표시하지 않습니다(움직일 곳만 보여줌).
      const top = (line < layout.lines.length)
        ? layout.lines[line]
        : layout.lines[layout.lines.length - 1] + (line - layout.lines.length + 1) * (rowH + gap);
      const box = document.createElement('div');
      box.className = 'item-reorder-slot';
      box.style.cssText = 'left:' + self.rect.left + 'px; top:' + top + 'px; width:'
        + self.rect.width + 'px; height:' + rowH + 'px;';
      document.body.appendChild(box);
      slots.push({
        line, el: box, order: best[line].order,
        rect: { left: self.rect.left, top: top, width: self.rect.width, height: rowH }
      });
    });
    st.layout = layout;
    st.self = self;
    return slots.length ? slots : null;
  }
  function resetItemReorderState_() {
    if (itemReorderState_) {
      if (itemReorderState_.holdTimer) clearTimeout(itemReorderState_.holdTimer);
      if (itemReorderState_.ghost) itemReorderState_.ghost.remove();
    }
    clearReorderVisuals_();
    document.body.classList.remove('item-reorder-active');
    itemReorderState_ = null;
  }
  function armItemReorder_(st, x, y) {
    st.armed = true;
    st.el.classList.add('item-reorder-armed');
    document.body.classList.add('item-reorder-active'); // 끄는 동안 글자 선택 등 방해 동작을 막습니다.
    st.siblings = getReorderSiblings_(st); // 잡는 순간의 화면 순서를 기준으로 삼습니다.
    st.targetIndex = -1;
    st.slots = (st.siblings.length > 1) ? buildReorderSlots_(st) : null; // 격자면 갈 수 있는 자리를 점선으로 표시
    st.activeSlot = null;
    // 잡은 항목의 복사본을 만들어 포인터를 따라다니게 합니다(실제 항목은 자리에 그대로 두고,
    // 이 복사본만 떠다니게 해서 "지금 옮기는 중"이라는 게 눈에 보이도록 합니다).
    const rect = st.el.getBoundingClientRect();
    const ghost = st.el.cloneNode(true);
    ghost.classList.remove('item-reorder-armed', 'item-reorder-target');
    ghost.classList.add('item-reorder-ghost');
    ghost.removeAttribute('data-rownum'); // 복사본이 드롭 대상으로 잡히지 않도록 표식을 지웁니다.
    ghost.style.cssText += ';position:fixed; margin:0; pointer-events:none; z-index:10090;'
      + 'left:' + rect.left + 'px; top:' + rect.top + 'px; width:' + rect.width + 'px; height:' + rect.height + 'px;';
    document.body.appendChild(ghost);
    st.ghost = ghost;
    st.ghostDx = rect.left - (x === undefined ? st.startX : x);
    st.ghostDy = rect.top - (y === undefined ? st.startY : y);
    if (navigator.vibrate) { try { navigator.vibrate(15); } catch (e2) { /* 진동 미지원 기기는 조용히 무시 */ } }
  }
  function reorderScheduleItemsAndRefresh_(rowNums) {
    g.withSuccessHandler(ok => {
      if (!ok) showAlert('순서를 바꾸지 못했습니다. 새로고침 후 다시 시도해주세요.');
      else focusSavedScheduleRange(); // 현재 보고 있던 주차/필터를 유지한 채 새 순서로 다시 그립니다.
    }).withFailureHandler(err => {
      showAlert('순서를 바꾸지 못했습니다.\n' + (err && err.message ? err.message : err));
    }).reorderScheduleItems(rowNums);
  }

  // 지금 끌고 있는 항목과 같은 부서 줄에 함께 그려진 항목들을, 화면에 보이는 순서대로 모읍니다.
  // 날짜가 달라도 같은 묶음으로 봅니다(관련 있는 일정끼리 나란히 둘 수 있어야 하므로).
  // PC 격자와 모바일 목록이 동시에 DOM에 있으므로 "같은 목록 안"으로 범위를 좁힙니다.
  function getReorderSiblings_(st) {
    const scope = st.el.parentElement;
    if (!scope) return [st.el];
    return Array.from(scope.children).filter(el =>
      el.dataset && el.dataset.rownum && el.dataset.dept === st.dept);
  }
  // 포인터와 가장 가까운 항목을 찾아 그 앞/뒤 중 어디에 끼워 넣을지 정합니다.
  // PC 격자는 가로세로 2차원이라, 줄이 다르면 위아래로, 같은 줄이면 좌우로 판단합니다.
  // (모바일 목록처럼 세로로만 쌓인 경우에는 자연스럽게 위아래 판단만 쓰이게 됩니다.)
  function computeReorderInsertIndex_(siblings, x, y) {
    let bestIdx = -1, bestDist = Infinity, before = true;
    siblings.forEach((el, i) => {
      const r = el.getBoundingClientRect();
      const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      const d = Math.hypot(x - cx, y - cy);
      if (d < bestDist) {
        bestDist = d;
        bestIdx = i;
        before = (Math.abs(y - cy) > r.height / 2) ? (y < cy) : (x < cx);
      }
    });
    if (bestIdx === -1) return siblings.length;
    return before ? bestIdx : bestIdx + 1;
  }

  document.addEventListener('pointerdown', e => {
    if (e.button === 2) return; // 오른쪽 클릭 등은 무시
    itemReorderClickGuard_ = false; // 새 입력이 시작됐으므로 이전 끌기의 잔여 가드를 확실히 지웁니다.
    const el = findReorderItemEl_(e.target);
    if (!el) return;
    resetItemReorderState_();
    const st = {
      el, rowNum: el.dataset.rownum, dept: el.dataset.dept, start: el.dataset.start,
      startX: e.clientX, startY: e.clientY, armed: false, pointerId: e.pointerId, targetEl: null, holdTimer: null,
      isMouse: e.pointerType === 'mouse'
    };
    // 마우스는 아래 pointermove에서 조금만 움직여도 바로 잡습니다(여기서 타이머를 걸지 않습니다).
    if (!st.isMouse) st.holdTimer = setTimeout(() => {
      if (itemReorderState_ !== st) return;
      armItemReorder_(st);
    }, ITEM_REORDER_HOLD_MS);
    itemReorderState_ = st;
  });

  document.addEventListener('pointermove', e => {
    const st = itemReorderState_;
    if (!st || st.pointerId !== e.pointerId) return;
    if (!st.armed) {
      const moved = Math.hypot(e.clientX - st.startX, e.clientY - st.startY);
      if (st.isMouse) {
        if (moved <= ITEM_REORDER_MOUSE_DRAG_PX) return; // 아직 클릭인지 끌기인지 모르는 상태
        armItemReorder_(st, st.startX, st.startY); // 마우스는 누른 채 움직이기 시작하면 바로 끌기로 봅니다.
      } else {
        if (moved > ITEM_REORDER_MOVE_CANCEL_PX) resetItemReorderState_(); // 꾹 누르기 전에 움직이면 스크롤로 보고 취소
        return;
      }
    }
    e.preventDefault(); // 잡은 뒤부터는 페이지 스크롤 등 기본 동작을 막습니다.
    if (st.ghost) { // 잡은 항목이 손가락/마우스를 따라다니게 해서 "지금 옮기는 중"임을 보여줍니다.
      st.ghost.style.left = (e.clientX + st.ghostDx) + 'px';
      st.ghost.style.top = (e.clientY + st.ghostDy) + 'px';
    }
    if (st.slots) {
      // 점선 자리 위에 올라와 있는지로 판단합니다(날짜 칸이 고정이라 엉뚱한 요일로 가지 않습니다).
      let hit = null;
      st.slots.forEach(s => {
        const r = s.rect;
        const inside = e.clientX >= r.left && e.clientX <= r.left + r.width
          && e.clientY >= r.top && e.clientY <= r.top + r.height;
        if (inside) hit = s;
        s.el.classList.toggle('is-active', inside);
      });
      st.activeSlot = hit;
      return;
    }
    // 모바일 목록처럼 세로로만 쌓인 화면은 기존처럼 끼워 넣을 자리를 계산합니다.
    const siblings = st.siblings || [];
    const from = siblings.indexOf(st.el);
    let insertIdx = computeReorderInsertIndex_(siblings, e.clientX, e.clientY);
    let to = insertIdx > from ? insertIdx - 1 : insertIdx; // 자기 자신을 뺀 뒤의 자리로 보정
    st.targetIndex = (to === from) ? -1 : to; // -1이면 제자리(바뀌는 것 없음)
    siblings.forEach(el => el.classList.remove('item-reorder-target'));
    if (st.targetIndex !== -1) {
      const markEl = siblings[Math.min(insertIdx, siblings.length - 1)];
      if (markEl && markEl !== st.el) markEl.classList.add('item-reorder-target');
    }
  }, { passive: false });

  document.addEventListener('pointerup', e => {
    const st = itemReorderState_;
    if (!st || st.pointerId !== e.pointerId) return;
    if (st.armed) {
      setItemReorderClickGuard_(); // 곧이어 오는 click 한 번은 무시(상세 팝업 대신 순서 바꾸기로 처리)
      const siblings = st.siblings || [];
      const from = siblings.indexOf(st.el);
      if (siblings.length < 2) {
        showAlert('이 부서에 이 주간 일정이 하나뿐이라 순서를 바꿀 수 없습니다.');
      } else if (st.slots) {
        // 점선 자리에는 "그 자리에 놓이려면 필요한 순서"가 이미 계산되어 함께 들어 있습니다.
        // 시뮬레이션으로 확인한 순서 그대로 저장하므로, 놓은 자리와 실제 결과가 어긋나지 않습니다.
        if (st.activeSlot) {
          reorderScheduleItemsAndRefresh_(st.activeSlot.order.map(i => Number(i.el.dataset.rownum)));
        }
      } else if (st.targetIndex !== -1 && st.targetIndex !== undefined && from !== -1) {
        const next = siblings.slice();
        next.splice(from, 1);
        next.splice(st.targetIndex, 0, st.el);
        reorderScheduleItemsAndRefresh_(next.map(el => Number(el.dataset.rownum)));
      }
    }
    resetItemReorderState_();
  });
  document.addEventListener('pointercancel', resetItemReorderState_);

  // 항목(연간 행사/부서별 업무) 막대나 모바일 목록 줄을 클릭했을 때, 작성된 내용 전체를 팝업으로 보여줍니다.
  // 저장 텍스트에서 '전달사항'을 분리합니다. body(제목+상세 포함)와 notice로 나눕니다.
  //  - 새 형식: "【전달사항】" 헤더 뒤를 전달사항으로.
  //  - 옛 형식: "전달사항"으로 시작하는 줄(예: "4. 전달사항: ...")부터 뒤를 전달사항으로 자동 감지.
  function splitNotice(text) {
    text = String(text || '');
    const mk = text.match(/^([\s\S]*?)\n*【전달사항】\n*([\s\S]*)$/);
    if (mk) return { body: mk[1].replace(/\s+$/, ''), notice: mk[2].trim() };
    const lines = text.split(/\r?\n/);
    // "전달사항:" 또는 "4. 전달사항:" 또는 "전달사항"(단독 줄)만 감지 (뒤에 다른 말이 붙은 줄은 제외해 오탐 방지)
    const idx = lines.findIndex(l => /^\s*\d*\s*[.)]?\s*전달\s*사항\s*(?:[:：]|\s*$)/.test(l));
    if (idx !== -1) {
      const body = lines.slice(0, idx).join('\n').replace(/\s+$/, '');
      const firstNoticeLine = lines[idx].replace(/^\s*\d*\s*[.)]?\s*전달\s*사항\s*[:：]?\s*/, '');
      const notice = [firstNoticeLine].concat(lines.slice(idx + 1)).join('\n').trim();
      return { body: body, notice: notice };
    }
    return { body: text, notice: '' };
  }

  // 저장 텍스트를 { title, detail, notice }로 분해합니다. (수정 창 3칸 채우기용)
  //  - 제목: 첫 줄이 "[...]" 이면 그 안의 글자.
  function parseTaskText(raw) {
    raw = String(raw || '');
    let title = '', rest = raw;
    const nl = raw.indexOf('\n');
    const firstLine = nl === -1 ? raw : raw.slice(0, nl);
    const tm = firstLine.match(/^\s*\[(.*)\]\s*$/);
    if (tm) { title = tm[1].trim(); rest = (nl === -1) ? '' : raw.slice(nl + 1); }
    const sn = splitNotice(rest);
    return { title: title, detail: sn.body.trim(), notice: sn.notice };
  }

  // ===== 전달사항 안전 렌더러 =====
  // html은 서버에서 이미 이스케이프된 문자열(<,>,&,",'이 엔티티로 바뀐 상태)이어야 합니다.
  // 1) 이 편집기가 직접 만든 새 서식 태그(strong/em/u/span, 중첩·순서 무관)만 화이트리스트로 복원합니다.
  // 2) 남은 옛 '<내용>' 강조 표기는 기존과 동일하게(빨강+굵게+살짝 큰 글씨) 표시해 과거 기록을 보호합니다.
  // 화이트리스트에 없는 태그/속성은 절대 복원하지 않고 그대로 이스케이프된 문자로 남아 안전합니다.
  function sanitizeNoticeStyle_(styleStr) {
    const decls = String(styleStr || '').split(';').map(s => s.trim()).filter(Boolean);
    const out = [];
    for (const d of decls) {
      const m = d.match(/^(color|font-size|font-weight|font-style|text-decoration)\s*:\s*(.+)$/i);
      if (!m) continue;
      const prop = m[1].toLowerCase(), val = m[2].trim();
      if (prop === 'color' && !/^#[0-9a-fA-F]{6}$/.test(val)) continue;
      if (prop === 'font-size' && !/^(1[0-9]|2[0-4])px$/.test(val)) continue; // 편집기 프리셋 범위(10~24px)만 허용
      if (prop === 'font-weight' && !/^(bold|normal|[1-9]00)$/.test(val)) continue;
      if (prop === 'font-style' && !/^(italic|normal)$/.test(val)) continue;
      if (prop === 'text-decoration' && !/^(underline|none)$/.test(val)) continue;
      out.push(prop + ':' + val);
    }
    return out.join(';');
  }
  function renderNoticeRichText_(html) {
    let out = String(html || '');
    out = out.replace(/&lt;\/(strong|em|u|span)&gt;/g, '</$1>');
    out = out.replace(/&lt;(strong|em|u)&gt;/g, '<$1>');
    out = out.replace(/&lt;span style=&quot;([^&"]*)&quot;&gt;/g, (m, styleStr) => {
      const safe = sanitizeNoticeStyle_(styleStr);
      return safe ? '<span style="' + safe + '">' : '<span>';
    });
    // 옛 '<내용>' 강조 표기 (위 단계에서 이미 새 태그로 소비된 부분은 더 이상 매치되지 않습니다)
    out = out.replace(/&lt;([^&\n]+?)&gt;/g, '<span style="color:#dc2626; font-weight:800; font-size:15px;">$1</span>');
    // 새 편집기에서 사용자가 그냥 문자로 입력한 <, >는 저장 시 &lt;/&gt;(글자 그대로)로 한 번 더 감싸
    // 옛 강조 표기와 구분되도록 했습니다. 여기서 그 한 겹을 되돌려 실제 '<','>' 글자로 보이게 합니다.
    out = out.replace(/&amp;lt;/g, '&lt;').replace(/&amp;gt;/g, '&gt;');
    return out;
  }

  let currentDetailIdx = -1; // 지금 팝업에 열려 있는 항목의 calendarItemDetails 인덱스 (수정/삭제 버튼에서 사용)
  function showItemDetail(idx) {
    const d = calendarItemDetails[idx];
    if (!d) return;
    currentDetailIdx = idx;
    document.getElementById('itemDetailDept').innerText = d.label || '';
    document.getElementById('itemDetailDate').innerText = d.dateLabel || '';
    // 저장 텍스트를 제목/내용/전달사항으로 분해해 각각 표시합니다.
    //  - 제목: 대괄호 없이 가운데·굵게·크게(별도 요소)  - 전달사항: 아래 박스(라벨+색)
    const p = parseTaskText(d.text);
    const titleEl = document.getElementById('itemDetailTitle');
    if (d.annual) {
      // 연간행사: 학사일정표 '명칭'을 제목으로 항상 보여주고, 그 아래에 세부(있으면)를 표시합니다.
      titleEl.textContent = d.annual.name || '';
      titleEl.style.display = 'block';
      document.getElementById('itemDetailText').innerHTML = p.detail || '';
    } else {
      if (p.title) { titleEl.innerHTML = p.title; titleEl.style.display = 'block'; }
      else { titleEl.style.display = 'none'; }
      document.getElementById('itemDetailText').innerHTML = p.detail;
    }
    const noticeWrap = document.getElementById('itemDetailNoticeWrap');
    if (p.notice) {
      document.getElementById('itemDetailNotice').innerHTML = renderNoticeRichText_(p.notice);
      noticeWrap.style.display = 'block';
    } else {
      noticeWrap.style.display = 'none';
    }
    const attachmentWrap = document.getElementById('itemDetailAttachmentWrap');
    const attachmentList = document.getElementById('itemDetailAttachmentList');
    attachmentList.innerHTML = '';
    if (d.attachments && d.attachments.length && d.rowNum) {
      d.attachments.forEach((file, fileIdx) => {
        const button = document.createElement('button');
        button.type = 'button';
        // 등록자가 허용한 방식에 따라 간편 뷰어 또는 다운로드를 바로 실행합니다.
        button.onclick = () => openAttachmentAction(currentDetailIdx, fileIdx, file.fileName);
        const icon = document.createElement('i');
        icon.className = 'fas fa-file';
        const name = document.createElement('span');
        name.textContent = file.fileName;
        button.append(icon, name);
        attachmentList.appendChild(button);
      });
      attachmentWrap.style.display = 'block';
    } else {
      attachmentWrap.style.display = 'none';
    }
    // 링크: 등록 시 넣어둔 '이름 붙인 주소'를 버튼으로 보여줍니다. 버튼을 누르면 새 창으로 열리고,
    //       옆의 '복사' 버튼으로 (긴 주소도) 클립보드에 바로 복사할 수 있습니다.
    const linkWrap = document.getElementById('itemDetailLinkWrap');
    const linkList = document.getElementById('itemDetailLinkList');
    linkList.innerHTML = '';
    if (d.links && d.links.length) {
      d.links.forEach(link => {
        const row = document.createElement('div');
        row.className = 'item-detail-link-row';

        const item = document.createElement('div');
        item.className = 'item-detail-link-item';
        const open = document.createElement('a');
        open.href = link.url; open.target = '_blank'; open.rel = 'noopener noreferrer';
        open.className = 'item-detail-link-open';
        const icon = document.createElement('i'); icon.className = 'fas fa-link';
        const name = document.createElement('span'); name.textContent = link.name || link.url;
        open.append(icon, name);
        const copy = document.createElement('button');
        copy.type = 'button'; copy.className = 'item-detail-link-copy'; copy.title = '주소 복사';
        copy.textContent = '복사';
        copy.onclick = () => copyScheduleLink(link.url, copy);
        const qrBtn = document.createElement('button');
        qrBtn.type = 'button'; qrBtn.className = 'item-detail-link-qr'; qrBtn.title = 'QR 코드 만들기';
        qrBtn.textContent = 'QR코드 생성';
        item.append(open, copy, qrBtn);

        // QR 박스(처음엔 숨김): 'QR코드 생성'을 누르면 링크 오른쪽에 QR 그림 + 'QR 복사' 버튼이 나옵니다.
        const qrBox = document.createElement('div');
        qrBox.className = 'item-detail-qr-box'; qrBox.style.display = 'none';
        const qrHolder = document.createElement('div');
        qrHolder.className = 'item-detail-qr-holder';
        const qrCopy = document.createElement('button');
        qrCopy.type = 'button'; qrCopy.className = 'item-detail-qr-copy'; qrCopy.textContent = 'QR 복사';
        qrBox.append(qrHolder, qrCopy);
        qrBtn.onclick = () => toggleLinkQR(link.url, qrBox, qrHolder, qrCopy, qrBtn);

        row.append(item, qrBox);
        linkList.appendChild(row);
      });
      linkWrap.style.display = 'block';
    } else {
      linkWrap.style.display = 'none';
    }
    // 액션 버튼: 부서 업무는 수정/삭제, 연간행사는 세부 등록(없을 때)/세부 수정·삭제(있을 때).
    // 연간행사의 '명칭'은 학사일정표에서 관리하므로 여기서는 세부 내용만 다루고 명칭은 지우지 않습니다.
    const actionsEl = document.getElementById('itemDetailActions');
    if (d.annual) {
      actionsEl.style.display = 'flex';
      if (d.rowNum) {
        actionsEl.innerHTML =
          '<button class="btn-search" style="flex:1; margin:0; background:var(--edit);" onclick="editAnnualDetail(currentDetailIdx)">✏️ 수정</button>'
          + '<button class="btn-search" style="flex:1; margin:0; background:var(--danger);" onclick="deleteAnnualDetail(currentDetailIdx)">🗑️ 삭제</button>';
      } else {
        actionsEl.innerHTML =
          '<button class="btn-search" style="flex:1; margin:0; background:#7c3aed;" onclick="registerAnnualDetail(currentDetailIdx)">➕ 세부 내용 등록</button>';
      }
    } else {
      actionsEl.style.display = (d.label === '연간 행사') ? 'none' : 'flex';
      actionsEl.innerHTML =
        '<button class="btn-search" style="flex:1; margin:0; background:var(--edit);" onclick="editItemFromDetail(currentDetailIdx)">✏️ 수정</button>'
        + '<button class="btn-search" style="flex:1; margin:0; background:var(--danger);" onclick="deleteItemFromDetail(currentDetailIdx)">🗑️ 삭제</button>';
    }
    initItemDetailDrag();               // 드래그 기능 준비(최초 1회만 실제로 설정)
    if (_resetItemDetailPos) _resetItemDetailPos(); // 열 때마다 가운데로 되돌립니다.
    openMod('itemDetailMod');
  }

  // 링크 주소를 클립보드에 복사합니다. (긴 주소도 한 번에) 복사되면 버튼에 잠깐 '복사됨'을 표시합니다.
  function copyScheduleLink(url, btn) {
    const flash = () => {
      const original = btn.textContent;
      btn.textContent = '복사됨';
      btn.classList.add('copied');
      setTimeout(() => { btn.textContent = original; btn.classList.remove('copied'); }, 1300);
    };
    const fallback = () => {
      try {
        const ta = document.createElement('textarea');
        ta.value = url; ta.style.position = 'fixed'; ta.style.top = '-1000px'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.focus(); ta.select();
        document.execCommand('copy'); document.body.removeChild(ta);
        flash();
      } catch (e) { showAlert('복사에 실패했습니다. 아래 주소를 직접 복사해주세요.\n\n' + url); }
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(flash).catch(fallback);
    } else {
      fallback();
    }
  }

  // 'QR코드 생성' 버튼: 링크 오른쪽에 QR 그림을 그려서 보여주거나(다시 누르면) 닫습니다.
  // QR은 브라우저 안에서 직접 그려지므로 주소가 외부 서버로 나가지 않습니다.
  function toggleLinkQR(url, box, holder, copyBtn, genBtn) {
    if (box.style.display !== 'none') {          // 이미 열려 있으면 닫기
      box.style.display = 'none';
      genBtn.textContent = 'QR코드 생성';
      return;
    }
    if (typeof QRCode === 'undefined') {
      showAlert('QR 생성 기능을 아직 불러오지 못했습니다. 인터넷 연결을 확인한 뒤 잠시 후 다시 시도해주세요.');
      return;
    }
    holder.innerHTML = '';
    try {
      new QRCode(holder, { text: url, width: 150, height: 150, correctLevel: QRCode.CorrectLevel.M });
      box.style.display = 'flex';
      genBtn.textContent = 'QR 닫기';
      copyBtn.onclick = () => copyLinkQR(holder, copyBtn);
    } catch (e) {
      showAlert('QR 코드를 만들지 못했습니다.\n' + (e && e.message ? e.message : e));
    }
  }

  // QR 그림을 이미지(PNG)로 클립보드에 복사합니다. (다른 곳에 붙여넣어 활용)
  function copyLinkQR(holder, btn) {
    const canvas = holder.querySelector('canvas');
    if (!canvas || !canvas.toBlob) {
      showAlert('QR 이미지를 준비하지 못했습니다. QR 그림을 마우스 오른쪽 클릭(모바일은 길게 눌러) → "이미지 복사"를 사용해주세요.');
      return;
    }
    const flash = () => {
      const o = btn.textContent;
      btn.textContent = '복사됨'; btn.classList.add('copied');
      setTimeout(() => { btn.textContent = o; btn.classList.remove('copied'); }, 1300);
    };
    const manual = () => showAlert('이 브라우저에서는 버튼으로 바로 복사가 안 됩니다.\nQR 그림을 마우스 오른쪽 클릭(모바일은 길게 눌러) → "이미지 복사"를 사용해주세요.');
    if (navigator.clipboard && window.ClipboardItem) {
      canvas.toBlob(blob => {
        if (!blob) { manual(); return; }
        navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]).then(flash).catch(manual);
      }, 'image/png');
    } else {
      manual();
    }
  }

  // 세부 내용 팝업을 상단(제목/날짜 줄)을 잡고 자유롭게 옮길 수 있게 합니다. (닫기 × 버튼은 제외)
  let _itemDetailDragReady = false;
  let _resetItemDetailPos = null;
  function initItemDetailDrag() {
    if (_itemDetailDragReady) return;
    const content = document.getElementById('itemDetailContent');
    const handle = document.getElementById('itemDetailHeader');
    if (!content || !handle) return;
    _itemDetailDragReady = true;
    let dragging = false, startX = 0, startY = 0, curX = 0, curY = 0;
    const apply = () => { content.style.transform = `translate(${curX}px, ${curY}px)`; };
    _resetItemDetailPos = () => { curX = 0; curY = 0; content.style.transform = ''; };
    handle.addEventListener('mousedown', e => {
      if (e.target.closest('[aria-label="닫기"]')) return; // 닫기 버튼 클릭은 드래그로 처리하지 않음
      dragging = true;
      startX = e.clientX - curX;
      startY = e.clientY - curY;
      document.body.style.userSelect = 'none';
      e.preventDefault();
    });
    document.addEventListener('mousemove', e => {
      if (!dragging) return;
      curX = e.clientX - startX;
      curY = e.clientY - startY;
      apply();
    });
    document.addEventListener('mouseup', () => {
      if (!dragging) return;
      dragging = false;
      document.body.style.userSelect = '';
    });
  }

  // 첨부파일을 누르면 뷰어 우선으로 바로 실행하고, 다운로드만 허용된 파일은 즉시 내려받습니다.
  let _attachAction = { idx: -1, fileIdx: -1 };
  function openAttachmentAction(idx, fileIdx, fileName) {
    _attachAction = { idx: idx, fileIdx: fileIdx };
    const d = calendarItemDetails[idx];
    const attachment = d && d.attachments ? d.attachments[fileIdx] : null;
    if (!attachment) return;
    if (attachment.allowView) {
      viewSelectedAttachment();
    } else if (attachment.allowDownload) {
      downloadSelectedAttachment();
    } else {
      showAlert('등록자가 이 첨부파일의 열람 방식을 허용하지 않았습니다.');
    }
  }
  function viewSelectedAttachment() {
    const { idx, fileIdx } = _attachAction;
    const d = calendarItemDetails[idx];
    const attachment = d && d.attachments ? d.attachments[fileIdx] : null;
    if (!d || !attachment || !d.rowNum) return;
    const ext = String(attachment.fileName || '').split('.').pop().toLowerCase();
    const HwpViewer = window.__HwpViewer;
    if (!attachment.allowView) { showAlert('등록자가 간편 뷰어 사용을 허용하지 않은 파일입니다.'); return; }
    // 이미지·PDF·텍스트는 앱 안의 간편 뷰어, HWP는 전용 뷰어, 나머지는 드라이브 미리보기를 사용합니다.
    if (ext === 'hwp' && HwpViewer) {
      openHwpViewer(d, attachment);
    } else if (/^(jpg|jpeg|png|gif|webp|bmp|pdf|txt|csv)$/.test(ext)) {
      openSimpleAttachmentViewer(d, attachment, ext);
    } else {
      openDriveViewer(d, attachment);
    }
  }

  let _simpleViewerCtx = null;
  let _simpleViewerUrl = '';
  let _simpleViewerDragReady = false;
  let _resetSimpleViewerPos = null;
  function initSimpleViewerDrag() {
    if (_simpleViewerDragReady || window.matchMedia('(max-width: 768px)').matches) return;
    const content = document.querySelector('#simpleAttachmentViewerMod .simple-attachment-viewer');
    const handle = document.querySelector('#simpleAttachmentViewerMod .simple-viewer-header');
    if (!content || !handle) return;
    _simpleViewerDragReady = true;
    // 가운데 정렬(flex/transform)이면 크기를 늘릴 때 중심 기준으로 재정렬돼 좌상단까지 커집니다.
    // 그래서 데스크톱에서는 top/left(px)로 고정 배치해, 우하단만 늘어나고 우측/아래를 따로 조절할 수 있게 합니다.
    content.style.position = 'absolute';
    content.style.margin = '0';
    let dragging = false, startX = 0, startY = 0, startLeft = 0, startTop = 0;
    _resetSimpleViewerPos = () => {
      // 열 때마다 화면 가운데에 놓되, 좌표를 px로 고정합니다(리사이즈 시 좌상단 안 움직이게).
      content.style.left = '';
      content.style.top = '';
      const r = content.getBoundingClientRect();
      const left = Math.max(8, Math.round((window.innerWidth - r.width) / 2));
      const top = Math.max(8, Math.round((window.innerHeight - r.height) / 2));
      content.style.left = left + 'px';
      content.style.top = top + 'px';
    };
    handle.addEventListener('mousedown', e => {
      if (e.button !== 0 || e.target.closest('button')) return;
      dragging = true;
      startX = e.clientX;
      startY = e.clientY;
      const r = content.getBoundingClientRect();
      startLeft = r.left;
      startTop = r.top;
      document.body.style.userSelect = 'none';
      e.preventDefault();
    });
    document.addEventListener('mousemove', e => {
      if (!dragging) return;
      content.style.left = (startLeft + (e.clientX - startX)) + 'px';
      content.style.top = (startTop + (e.clientY - startY)) + 'px';
    });
    document.addEventListener('mouseup', () => {
      if (!dragging) return;
      dragging = false;
      document.body.style.userSelect = '';
    });
  }
  function openSimpleAttachmentViewer(d, attachment, ext) {
    _simpleViewerCtx = { idx: _attachAction.idx, fileIdx: _attachAction.fileIdx, d: d, attachment: attachment };
    const body = document.getElementById('simpleViewerBody');
    document.getElementById('simpleViewerName').textContent = attachment.fileName || '첨부파일';
    document.getElementById('simpleViewerDownloadBtn').style.display = attachment.allowDownload ? 'inline-flex' : 'none';
    initSimpleViewerDrag();
    body.innerHTML = '<div style="color:#e2e8f0; padding:30px;">파일을 불러오는 중...</div>';
    openMod('simpleAttachmentViewerMod');
    if (_resetSimpleViewerPos) _resetSimpleViewerPos(); // 표시 후 실제 크기 기준으로 가운데 배치(좌상단 px 고정)
    toggleLoading(true, '간편 뷰어를 준비 중...');
    g.withSuccessHandler(res => {
      toggleLoading(false);
      if (!res || !res.success) { closeSimpleAttachmentViewer(); showAlert((res && res.message) || '파일을 열지 못했습니다.'); return; }
      try {
        const bytes = base64ToBytes_(res.base64);
        const mime = res.mimeType || attachment.mimeType || 'application/octet-stream';
        const blob = new Blob([bytes], { type: mime });
        _simpleViewerUrl = URL.createObjectURL(blob);
        body.innerHTML = '';
        if (/^(jpg|jpeg|png|gif|webp|bmp)$/.test(ext)) {
          const img = document.createElement('img');
          img.src = _simpleViewerUrl;
          img.alt = attachment.fileName || '첨부 이미지';
          body.appendChild(img);
        } else if (ext === 'pdf') {
          const frame = document.createElement('iframe');
          frame.src = _simpleViewerUrl;
          frame.title = attachment.fileName || 'PDF 미리보기';
          body.appendChild(frame);
        } else {
          const pre = document.createElement('pre');
          pre.textContent = new TextDecoder('utf-8').decode(bytes);
          body.appendChild(pre);
        }
      } catch (e) {
        closeSimpleAttachmentViewer();
        showAlert('간편 뷰어에서 파일을 표시하지 못했습니다.');
      }
    }).withFailureHandler(err => {
      toggleLoading(false);
      closeSimpleAttachmentViewer();
      showAlert('간편 뷰어를 여는 중 오류가 발생했습니다.\n' + (err && err.message ? err.message : err));
    }).getScheduleAttachmentContent(d.rowNum, attachment.fileId, 'view');

  function base64ToBytes_(b64) {
    const bin = atob(String(b64 || ''));
    const len = bin.length;
    const bytes = new Uint8Array(len);
    for (let i = 0; i < len; i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }
