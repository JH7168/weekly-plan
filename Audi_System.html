<!-- 시청각실 주간 현황 모달 -->
<style>
  #audiWeeklyMod { --audi-navy:#17324d; --audi-blue:#2563a6; --audi-teal:#0f8b8d; --audi-line:#d9e4ec; --audi-soft:#f4f8fb; --audi-red:#c2414f; }
  #audiWeeklyMod .audi-dashboard { display:flex; flex-direction:column; width:min(960px, 94vw); max-width:960px; max-height:90vh; padding:0; overflow:hidden; border:1px solid #d7e2ea; border-radius:18px; background:#fff; box-shadow:0 24px 70px rgba(22,50,77,.22); }
  .audi-head { position:relative; display:flex; align-items:center; gap:14px; padding:22px 60px 20px 24px; background:linear-gradient(120deg,#17324d,#245578); color:#fff; }
  .audi-head-icon { display:grid; place-items:center; width:44px; height:44px; flex:0 0 44px; border:1px solid rgba(255,255,255,.25); border-radius:13px; background:rgba(255,255,255,.1); font-size:21px; }
  .audi-head h3 { margin:0 0 4px; color:#fff; font-size:21px; letter-spacing:-.5px; }
  .audi-head p { margin:0; color:#d8e8f2; font-size:12.5px; }
  .audi-close { position:absolute; top:16px; right:18px; width:34px; height:34px; border:0; border-radius:50%; background:rgba(255,255,255,.1); color:#fff; font-size:24px; line-height:1; cursor:pointer; }
  .audi-close:hover { background:rgba(255,255,255,.2); }
  .audi-body { display:flex; flex:1; flex-direction:column; min-height:0; padding:20px 22px 24px; }
  .audi-toolbar { display:flex; justify-content:space-between; align-items:center; gap:14px; margin-bottom:14px; padding:13px 14px; border:1px solid var(--audi-line); border-radius:12px; background:var(--audi-soft); }
  .audi-period-nav,.audi-actions,.audi-legend { display:flex; align-items:center; gap:7px; }
  .audi-period-nav select { min-height:38px; padding:7px 30px 7px 10px; border:1px solid #c7d6e1; border-radius:8px; background:#fff; color:#253d52; font-weight:700; }
  .audi-refresh,.audi-action { min-height:38px; padding:8px 13px; border:0; border-radius:8px; color:#fff; font-weight:800; cursor:pointer; }
  .audi-refresh { background:var(--audi-blue); }
  .audi-action.reserve { background:var(--audi-teal); }
  .audi-action.cancel { background:var(--audi-red); }
  .audi-guide { display:flex; justify-content:space-between; align-items:center; gap:10px; margin:0 2px 12px; color:#607487; font-size:12px; }
  .audi-legend span { display:inline-flex; align-items:center; gap:5px; white-space:nowrap; }
  .audi-legend i { width:10px; height:10px; border-radius:3px; }
  .audi-legend .free { background:#e8f7f2; border:1px solid #79c8b0; }
  .audi-legend .booked { background:#fff0f1; border:1px solid #e7a4aa; }
  #audiTableContainer { flex:1; min-height:0; overflow:auto; border:1px solid var(--audi-line); border-radius:12px; }
  .audi-table { width:100%; min-width:720px; border-collapse:separate; border-spacing:0; text-align:center; }
  .audi-table th,.audi-table td { padding:12px 9px; border-right:1px solid var(--audi-line); border-bottom:1px solid var(--audi-line); }
  .audi-table tr:last-child td { border-bottom:0; } .audi-table th:last-child,.audi-table td:last-child { border-right:0; }
  .audi-table th { background:#eef4f8; color:#29465e; font-size:13px; }
  .audi-table .audi-corner { width:112px; background:var(--audi-navy); color:#fff; }
  .audi-period { background:#f7fafc; color:#334e63; font-size:13px; font-weight:800; }
  .audi-slot { min-width:105px; height:50px; cursor:pointer; transition:background .16s ease, box-shadow .16s ease; }
  .audi-slot-free { background:#f4fbf8; color:#08785f; font-size:12.5px; font-weight:800; }
  .audi-slot-free:hover { background:#def5eb; box-shadow:inset 0 0 0 2px #67bfa4; }
  .audi-slot-booked { background:#fff4f4; }
  .audi-slot-booked strong { display:block; color:#b83246; font-size:13px; line-height:1.35; }
  .audi-slot-booked span { color:#64748b; font-size:11.5px; }
  .audi-slot.is-selected { background:#d9f3e8 !important; box-shadow:inset 0 0 0 2px #10916f; }
  .audi-slot-booked.is-selected { background:#ffd9dd !important; box-shadow:inset 0 0 0 2px #d53c50; }
  #audiApplyMod .audi-apply-card { max-width:430px; padding:0; overflow:hidden; border-radius:16px; }
  .audi-apply-head { padding:20px 22px; background:#17324d; color:#fff; } .audi-apply-head h3 { margin:0; color:#fff; font-size:19px; }
  .audi-apply-body { padding:20px 22px 22px; } #audiApplyInfo { margin-bottom:17px; padding:11px; border:1px solid #b9ddd2; border-radius:9px; background:#edf9f5; color:#176b57; font-weight:800; text-align:center; }
  .audi-field { margin-bottom:15px; } .audi-field label { display:block; margin-bottom:6px; color:#334e63; font-size:13px; font-weight:800; }
  .audi-field input { width:100%; box-sizing:border-box; padding:11px; border:1px solid #cbd8e2; border-radius:8px; font:inherit; }
  .audi-field input:focus { outline:3px solid rgba(37,99,166,.15); border-color:#2563a6; }
  @media(max-width:768px){ #audiWeeklyMod .audi-dashboard{width:96vw;border-radius:14px}.audi-head{padding:18px 50px 17px 17px}.audi-head p{font-size:11.5px}.audi-body{padding:14px 12px 18px}.audi-toolbar{align-items:stretch;flex-direction:column}.audi-period-nav{display:grid;grid-template-columns:repeat(3,1fr)}.audi-period-nav select{width:100%;min-width:0}.audi-refresh{grid-column:1/-1}.audi-actions{display:grid;grid-template-columns:1fr 1fr}.audi-guide{align-items:flex-start;flex-direction:column}.audi-table th,.audi-table td{padding:10px 7px}}
</style>
<div id="audiWeeklyMod" class="modal" style="z-index: 9999;">
  <div class="modal-content audi-dashboard">
    <div class="audi-head"><div class="audi-head-icon">▣</div><div><h3>시청각실 예약 현황</h3><p>빈 시간을 선택한 뒤 예약하거나, 예약된 시간을 선택해 취소할 수 있습니다.</p></div><button class="audi-close" onclick="closeMod('audiWeeklyMod')" aria-label="닫기">&times;</button></div>
    <div class="audi-body">
      <div class="audi-toolbar">
        <div class="audi-period-nav">
          <select id="audiYearSel" aria-label="연도" onchange="loadAudiWeekly()"></select>
          <select id="audiMonthSel" aria-label="월" onchange="updateAudiWeeksAndLoad()"></select>
          <select id="audiWeekSel" aria-label="주차" onchange="loadAudiWeekly()"></select>
          <button class="audi-refresh" onclick="loadAudiWeekly()">새로고침</button>
        </div>
        <div class="audi-actions"><button class="audi-action reserve" onclick="openMultiAudiApplyForm()">선택 시간 예약</button><button class="audi-action cancel" onclick="promptMultiAudiDelete()">선택 예약 취소</button></div>
      </div>
      <div class="audi-guide"><span>여러 시간을 한 번에 선택할 수 있습니다.</span><div class="audi-legend"><span><i class="free"></i>예약 가능</span><span><i class="booked"></i>예약 완료</span></div></div>
      <div id="audiTableContainer"></div>
    </div>
  </div>
</div>

<!-- 개별 예약 입력 모달 -->
<div id="audiApplyMod" class="modal" style="z-index: 10010;">
  <div class="modal-content audi-apply-card">
    <div class="audi-apply-head"><h3>시청각실 예약 신청</h3></div><div class="audi-apply-body">
    <div id="audiApplyInfo"></div>
    
    <input type="hidden" id="audiApplyDate">
    <input type="hidden" id="audiApplyPeriod">

    <div class="audi-field">
      <label>사용 용도</label><input type="text" id="audiApplyPurpose" placeholder="예) 학부모 연수, 교직원 회의 등">
    </div>
    <div class="audi-field">
      <label>담당 부서 또는 교사명</label><input type="text" id="audiApplyManager" placeholder="예) 교무기획부 박정환">
    </div>

    <div style="display:flex; gap:10px; margin-top:25px;">
      <button class="btn-search" style="flex:2; background:#0f8b8d; margin:0;" onclick="submitAudiApply()">예약 완료</button>
      <button class="btn-cancel" style="flex:1; margin:0;" onclick="closeMod('audiApplyMod')">취소</button>
    </div></div>
  </div>
</div>

<script>
  function openAudiWeekly() {
    initAudiSelects();
    openMod('audiWeeklyMod');
  }

  function initAudiSelects() {
    const d = new Date();
    let y = d.getFullYear(), m = d.getMonth() + 1;
    let yH = '', mH = '';
    for(let i = y - 2; i <= y + 2; i++) yH += `<option value="${i}" ${i === y ? 'selected' : ''}>${i}년</option>`;
    for(let i = 1; i <= 12; i++) mH += `<option value="${i}" ${i === m ? 'selected' : ''}>${i}월</option>`;
    
    document.getElementById('audiYearSel').innerHTML = yH;
    document.getElementById('audiMonthSel').innerHTML = mH;
    updateAudiWeeksAndLoad();
  }

  // 주차 목록 계산은 JS_Main.html의 getWeekMondaysForMonth()(월~금 중 수요일이 속한 달 기준)를 그대로 재사용합니다.
  function updateAudiWeeksAndLoad() {
    const y = parseInt(document.getElementById('audiYearSel').value);
    const m = parseInt(document.getElementById('audiMonthSel').value);
    const d = new Date();
    const mondays = getWeekMondaysForMonth(y, m);

    let currentWeekNum = 1;
    mondays.forEach((mon, idx) => {
      const fri = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + 4, 23, 59, 59, 999);
      if (d >= mon && d <= fri) currentWeekNum = idx + 1;
    });

    let wH = '';
    mondays.forEach((mon, idx) => {
      const w = idx + 1;
      wH += `<option value="${w}" ${w === currentWeekNum ? 'selected' : ''}>${w}주차</option>`;
    });
    document.getElementById('audiWeekSel').innerHTML = wH;
    loadAudiWeekly();
  }

  function calculateAudiDates() {
    const y = parseInt(document.getElementById('audiYearSel').value);
    const m = parseInt(document.getElementById('audiMonthSel').value);
    const targetW = parseInt(document.getElementById('audiWeekSel').value);
    const mondays = getWeekMondaysForMonth(y, m);
    const mon = mondays[targetW - 1];
    if (!mon) return [];

    const days = ['일', '월', '화', '수', '목', '금', '토'];
    let dates = [];
    for (let i = 0; i < 5; i++) {
      const cur = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + i);
      const dStr = `${cur.getFullYear()}-${String(cur.getMonth() + 1).padStart(2, '0')}-${String(cur.getDate()).padStart(2, '0')}`;
      dates.push({ full: dStr, short: `${cur.getMonth() + 1}/${cur.getDate()}`, day: days[cur.getDay()] });
    }
    return dates;
  }

  let selectedAudiSlots = []; // 등록용 다중 선택 보관 배열
  let selectedAudiDeletes = []; // 삭제용 다중 선택 보관 배열

  function loadAudiWeekly() {
    selectedAudiSlots = []; // 조회할 때마다 등록 선택 초기화
    selectedAudiDeletes = []; // 조회할 때마다 삭제 선택 초기화
    const dates = calculateAudiDates();
    if (dates.length === 0) {
      document.getElementById('audiTableContainer').innerHTML = "<p style='text-align:center;'>해당 주차의 평일(월~금)이 없습니다.</p>";
      return;
    }
    
    const dateStrings = dates.map(d => d.full);
    toggleLoading(true, "시청각실 현황 조회 중...");
    g.withSuccessHandler(bookings => {
      toggleLoading(false);
      renderAudiTable(dates, bookings);
    }).getAudiBookings(dateStrings);
  }

  function renderAudiTable(dates, bookings) {
    const periods = ['1교시', '2교시', '3교시', '4교시', '점심시간<br><span style="font-size:11px;">(12:40~14:00)</span>', '5교시', '6교시', '7교시'];
    const pKeys = ['1교시', '2교시', '3교시', '4교시', '점심시간', '5교시', '6교시', '7교시'];

    let html = `<table class="audi-table">`;
    
    html += `<tr><th class="audi-corner">교시 / 날짜</th>`;
    dates.forEach(d => {
      html += `<th>${d.short} (${d.day})</th>`;
    });
    html += `</tr>`;

    periods.forEach((periodLabel, pIdx) => {
      let pKey = pKeys[pIdx];
      html += `<tr><td class="audi-period">${periodLabel}</td>`;
      
      dates.forEach(d => {
        let b = bookings.find(x => x.date === d.full && x.period === pKey);
        let slotId = `${d.full}|${pKey}|${d.day}`;
        
        if (b) {
          // 이미 예약된 항목: 클릭 시 삭제 대상 다중 선택 토글로 변경
          html += `<td id="del_cell_${slotId}" class="audi-slot audi-slot-booked"
                       onclick="toggleAudiDeleteSlot('${d.full}', '${pKey}', '${d.day}', '${b.purpose}', '${b.manager}')" title="클릭하여 삭제할 대상 선택">
                     <strong>${b.purpose}</strong><span>${b.manager}</span>
                   </td>`;
        } else {
          // 빈 칸: 클릭 시 등록 대상 선택 토글
          html += `<td id="cell_${slotId}" class="audi-slot audi-slot-free"
                       onclick="toggleAudiSlot('${d.full}', '${pKey}', '${d.day}')">
                     + 시간 선택
                   </td>`;
        }
      });
      html += `</tr>`;
    });
    html += `</table>`;
    document.getElementById('audiTableContainer').innerHTML = html;
  }

  // [등록] 선택 칸을 껐다 켰다 하는 함수
  function toggleAudiSlot(dateFull, periodKey, dayName) {
    if (selectedAudiDeletes.length > 0) {
      showAlert("현재 '삭제'할 항목을 선택 중입니다.\n혼선을 방지하기 위해 먼저 선택 항목을 삭제하시거나, 삭제 선택을 모두 해제해주세요.");
      return;
    }

    const slotId = `${dateFull}|${periodKey}|${dayName}`;
    const cell = document.getElementById(`cell_${slotId}`);
    const idx = selectedAudiSlots.findIndex(s => s.id === slotId);
    
    if (idx > -1) {
      selectedAudiSlots.splice(idx, 1);
      cell.classList.remove('is-selected');
      cell.innerText = '+ 시간 선택';
    } else {
      selectedAudiSlots.push({ id: slotId, date: dateFull, period: periodKey, day: dayName });
      cell.classList.add('is-selected');
      cell.innerText = '✓ 선택됨';
    }
  }

  // [삭제] 예약된 칸을 삭제 목적으로 다중 선택하는 함수
  function toggleAudiDeleteSlot(dateFull, periodKey, dayName, purpose, manager) {
    if (selectedAudiSlots.length > 0) {
      showAlert("현재 새로운 예약을 '등록'하기 위해 빈칸을 선택 중입니다.\n혼선을 방지하기 위해 등록을 먼저 완료하시거나, 선택을 모두 해제해주세요.");
      return;
    }

    const slotId = `${dateFull}|${periodKey}|${dayName}`;
    const cell = document.getElementById(`del_cell_${slotId}`);
    const idx = selectedAudiDeletes.findIndex(s => s.id === slotId);
    
    if (idx > -1) {
      // 선택 해제
      selectedAudiDeletes.splice(idx, 1);
      cell.classList.remove('is-selected');
    } else {
      // 선택 추가
      selectedAudiDeletes.push({ id: slotId, date: dateFull, period: periodKey, purpose: purpose, manager: manager, day: dayName });
      cell.classList.add('is-selected');
    }
  }

  // 다중 선택 후 우측 상단 '등록' 버튼을 눌렀을 때
  function openMultiAudiApplyForm() {
    if (selectedAudiSlots.length === 0) {
      showAlert("예약할 교시를 빈칸에서 클릭하여 먼저 선택해주세요.");
      return;
    }
    
    document.getElementById('audiApplyPurpose').value = '';
    document.getElementById('audiApplyManager').value = '';
    
    // 같은 날짜는 하나로 묶어서 "M. D.(요일) 2교시, 3교시" 형태로 표시합니다.
    const audiDateGroups = {};
    const audiDateOrder = [];
    selectedAudiSlots.forEach(s => {
      if (!audiDateGroups[s.date]) { audiDateGroups[s.date] = { day: s.day, periods: [] }; audiDateOrder.push(s.date); }
      audiDateGroups[s.date].periods.push(s.period);
    });
    let infoText = audiDateOrder.map(date => {
      const g = audiDateGroups[date];
      const parts = date.split('-');
      return `${parseInt(parts[1], 10)}. ${parseInt(parts[2], 10)}.(${g.day}) ${g.periods.join(', ')}`;
    }).join(' / ');
    if(infoText.length > 35) infoText = infoText.substring(0, 35) + '... 외 ' + (selectedAudiSlots.length - 1) + '건';
    
    document.getElementById('audiApplyInfo').innerHTML = `📌 총 ${selectedAudiSlots.length}타임 선택됨<br><span style="font-size:12px; font-weight:normal; color:#475569;">${infoText}</span>`;
    openMod('audiApplyMod');
  }

  // 예약 일괄 저장 제출
  function submitAudiApply() {
    const purpose = document.getElementById('audiApplyPurpose').value.trim();
    const manager = document.getElementById('audiApplyManager').value.trim();

    if (!purpose || !manager) {
      showAlert("용도와 담당자를 모두 입력해주세요!");
      return;
    }

    toggleLoading(true, "예약 처리 중...");
    const slotsToSave = selectedAudiSlots.map(s => ({ date: s.date, period: s.period }));
    
    g.withSuccessHandler(res => {
      toggleLoading(false);
      if (res.success) {
        closeMod('audiApplyMod');
        showAlert("성공적으로 일괄 예약되었습니다.");
        loadAudiWeekly(); // 완료 후 표 새로고침
      } else {
        showAlert(res.msg); 
      }
    }).saveMultipleAudiBookings(slotsToSave, purpose, manager);
  }

  // 다중 선택 후 우측 상단 '삭제' 버튼을 눌렀을 때 확인 팝업
  function promptMultiAudiDelete() {
    if (selectedAudiDeletes.length === 0) {
      showAlert("삭제할 예약 항목을 표에서 먼저 클릭하여 선택해주세요.");
      return;
    }

    // 어떤 항목들을 지우는지 요약해서 보여주기
    let infoList = selectedAudiDeletes.map(s => `${s.date.substring(5)}(${s.day}) [${s.period}] ${s.purpose}`);
    let displayInfo = infoList.slice(0, 3).join('\n');
    if (infoList.length > 3) displayInfo += `\n... 외 ${infoList.length - 3}건`;

    showConfirm(`총 ${selectedAudiDeletes.length}건의 예약을 일괄 삭제하시겠습니까?\n\n${displayInfo}\n\n⚠️ 삭제 전 반드시 담당 부서/교사와 상의를 완료하셨는지 확인해주세요!`, () => {
      toggleLoading(true, "삭제 처리 중...");
      const slotsToDelete = selectedAudiDeletes.map(s => ({ date: s.date, period: s.period }));
      
      g.withSuccessHandler(res => {
        toggleLoading(false);
        if(res.success) {
          showAlert("선택한 예약이 일괄 삭제되었습니다.");
          loadAudiWeekly(); // 삭제 후 새로고침
        } else {
          showAlert("삭제 중 오류가 발생했습니다.");
        }
      }).deleteMultipleAudiBookingsFromSheet(slotsToDelete);
    });
  }
</script>
